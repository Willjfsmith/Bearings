 facing Japan.","f":"South Korea shares the peninsula's only land border with the North; it's the world's leading shipbuilder by tonnage in many years."},"capital":{"t":["Seoul — Seoul has SOUL.","STOP, COREY, you'll ruin your shoe SOLE — Seoul, South Korea."],"f":"Seoul's name simply means 'capital' in Korean; the metropolitan area holds about half the country's population."},"currency":{"t":"WON — South Korea's won: 'won' rhymes with 'yen' in origin, all mean 'round'."}},"kw":{"flag":{"t":["Green-white-red horizontal with a black trapezoid at the hoist. Pan-Arab colours; the black bit is the hoist chevron.","KUWAIT: green-white-red with a black door-shape at the pole."],"f":"The colours follow a 13th-century poem: white deeds, black battles, green pastures, red swords."},"map":{"t":"Small country at the top of the Persian Gulf, between Iraq and Saudi Arabia.","f":"Kuwait's oilfields were set ablaze by retreating Iraqi troops in 1991 — around 600 wells burned for months."},"capital":{"t":["Kuwait City — same name.","COOL, WAIT — Kuwait; the capital is Kuwait City."],"f":"Kuwait City's Kuwait Towers store water in giant spheres; the tallest is 187 m."}},"kz":{"flag":{"t":["Sky blue with a yellow sun above a steppe eagle, and a gold ornamental strip at the hoist. Eagle under the sun on the steppe.","KAZAKH-stan: sky blue with a golden sun and an eagle flying under it."],"f":"The golden eagle under the sun is a steppe eagle; the ornament on the hoist is a traditional 'koshkar-muiz' (ram's horns) pattern."},"map":{"t":"The huge landlocked country between Russia and the other 'stans, on the Caspian.","f":"Kazakhstan is the largest landlocked country and the Baikonur Cosmodrome, launch site for Gagarin, is on lease to Russia here."},"capital":{"t":"Astana — renamed Nur-Sultan in 2019 and back to Astana in 2022. 'A STAN in a stan.'","f":"The capital was renamed Nur-Sultan in 2019 after the outgoing president, then changed back to Astana in 2022; it's the second-coldest capital after Ulaanbaatar."},"currency":{"t":"TENGE — Kazakhstan's tenge; the word is related to 'tanga', an old Central Asian coin, and to 'money' in Russian slang (dengi)."},"language":{"t":"KAZAKH and RUSSIAN — Kazakh is Turkic; the country is moving it from Cyrillic to Latin script."}},"la":{"flag":{"t":["Red-blue-red horizontal (wide blue middle) with a white disc. The moon over the Mekong.","LAOS: a white moon in a blue river between two red banks."],"f":"The white disc is the full moon over the Mekong; the blue is the river itself. Adopted 1975."},"map":{"t":"Landlocked, long and thin, between Thailand and Vietnam, below China.","f":"Laos is the most heavily bombed country per capita in history — about 2 million tonnes of US ordnance in the 1960s–70s."},"capital":{"t":["Vientiane — 'VIENNA-tiane': the Vienna of the Mekong.","A LOUSE, VENTING — Vientiane, Laos."],"f":"Vientiane's Patuxai monument was built with concrete the US donated for a new airport runway — locals call it the 'vertical runway'."},"currency":{"t":"KIP — Laos: 'KIP' as in 'have a kip' — a sleepy currency."}},"lb":{"flag":{"t":["Red-white-red horizontal with a green cedar tree in the centre. The cedar of Lebanon.","LEBANON: a green cedar between two red bands."],"f":"The cedar of Lebanon is mentioned dozens of times in the Bible; Solomon's temple was built with its wood."},"map":{"t":"Small strip on the Mediterranean north of Israel, west of Syria.","f":"Lebanon is roughly the size of Cyprus and has 18 recognised religious sects sharing power under a fixed formula."},"capital":{"t":["Beirut — 'BAY-ROOT': a cedar's root by the bay.","'LAB ON my BAY ROOT' — Beirut, Lebanon."],"f":"Beirut has been destroyed and rebuilt at least seven times; the 2020 port explosion was one of the largest non-nuclear blasts ever."},"language":{"t":"ARABIC — with French widely spoken; Lebanese often mix all three with English."}},"lk":{"flag":{"t":["Maroon panel with a gold lion holding a sword, plus green and orange vertical stripes at the hoist, gold border. The lion flag.","SRI LANKA: a golden lion with a sword on maroon."],"f":"The lion with a sword is from the old Kandyan kingdom; the four leaves are bo-tree leaves for Buddhist virtues. Green and orange stripes stand for the Muslim and Tamil minorities."},"map":{"t":"Teardrop island off the southern tip of India.","f":"Sri Lanka was Ceylon until 1972; Adam's Bridge, a chain of shoals, nearly links it to India."},"capital":{"t":"Sri Jayawardenepura Kotte — the official capital; Colombo is the big city and also accepted.","f":"The official capital is Sri Jayawardenepura Kotte, a suburb of Colombo, but Colombo remains the commercial capital most people name."},"currency":{"t":"RUPEE — Sri Lanka's rupee, like India's; Sri Lanka was Ceylon, but still rupees."},"language":{"t":"SINHALA and TAMIL — Sinhala in the south, Tamil in the north and east."}},"mm":{"flag":{"t":"Yellow-green-red horizontal with a big white star in the middle. Lithuania's colours with a star.","f":"The yellow-green-red tricolour with a white star arrived in 2010, replacing a red flag with a blue canton; the design deliberately echoed the 1943–45 flag."},"map":{"t":"Between Bangladesh/India and Thailand, with a long tail down the Andaman Sea.","f":"Myanmar (Burma) is one of only three countries not officially using the metric system, with the US and Liberia."},"capital":{"t":["Naypyidaw — 'NAY-pee-DAW': the built-from-scratch capital; Yangon is the old one.","MY AUNT MARY's NAPPY TALK — Naypyidaw, Myanmar."],"f":"Naypyidaw was built in secret and unveiled in 2005; it has 20-lane highways and almost no traffic."},"currency":{"t":"KYAT — Myanmar's kyat, pronounced 'chat': have a chat in Myanmar."},"language":{"t":"BURMESE — with its round script, designed so it wouldn't tear palm leaves."}},"mn":{"flag":{"t":["Red-blue-red vertical with a yellow Soyombo symbol on the hoist red. Blue = the eternal blue sky.","MONGOLIA: red-blue-red vertical with a golden Soyombo at the pole."],"f":"The Soyombo symbol on the hoist is a Buddhist emblem with fire, sun, moon, and yin-yang; the red-blue-red bars were kept from the communist era minus the star."},"map":{"t":"Landlocked between Russia and China.","f":"Mongolia is the least densely populated country in the world and the largest with no coastline that's fully landlocked between just two neighbours (Russia and China)."},"capital":{"t":["Ulaanbaatar — 'red hero'; picture a red-hero horseman.","MULAN as a BATTER, pretending to be a man — Ulaanbaatar, Mongolia."],"f":"Ulaanbaatar (Ulan Bator) is the coldest national capital, averaging around freezing across the year."},"currency":{"t":"TÖGRÖG — Mongolia's tögrög (tugrik) means 'circle'; the symbol is ₮."},"language":{"t":"MONGOLIAN — written in Cyrillic since 1941; the traditional vertical script is returning."}},"mo":{"flag":{"t":"Green with a white lotus flower over a stylised bridge and water, with stars above. Lotus and bridge.","f":"The lotus flower stands on a bridge over water; Macau's flag was adopted at the 1999 handover from Portugal."},"map":{"t":"Tiny peninsula on the west side of the Pearl River mouth, opposite Hong Kong.","f":"Macau makes more gambling revenue than Las Vegas — several times more in most years."},"capital":{"t":"Macau.","f":"Macau was the first and last European colony in Asia, Portuguese from 1557 to 1999."},"currency":{"t":"PATACA — Macau's pataca, an old Portuguese name for the Spanish dollar."},"language":{"t":"CHINESE and PORTUGUESE — Portuguese is still official though few speak it."}},"mv":{"flag":{"t":["Red with a green rectangle and a white crescent. Red border, green centre — islands in the sea.","MAL-DIVES: a green lagoon with a white crescent inside a red reef."],"f":"The green panel with a crescent sits inside a red border; the design dates from 1965, at independence from Britain."},"map":{"t":"Chain of coral atolls southwest of India and Sri Lanka.","f":"The Maldives is the lowest country on Earth, averaging about 1.5 m above sea level; the cabinet once held a meeting underwater in scuba gear."},"capital":{"t":["Malé — 'MAH-lay': the male capital of the Maldives.","MALdives — MALE, the capital, is the start of the country's name."],"f":"Malé is one of the most densely populated cities in the world — a whole capital crammed onto a 6 km² island."},"currency":{"t":"RUFIYAA — the Maldives' rufiyaa is the rupee with a local accent."}},"my":{"flag":{"t":["Red and white stripes with a blue canton holding a yellow crescent and 14-point star. US-style stripes with a crescent.","MALAYSIA: America's Stars and Stripes with a crescent and one 14-point star."],"f":"The 14 stripes and 14-point star are for the 13 states plus the federal territories; the design is modelled on the US Stars and Stripes."},"map":{"t":"The peninsula south of Thailand plus the top of Borneo.","f":"Malaysia is in two halves separated by 600 km of sea: the peninsula and northern Borneo (Sabah and Sarawak)."},"capital":{"t":["Kuala Lumpur — 'KL': the Petronas Towers.","MA LAYS her KOALA in a LUMP — Kuala Lumpur, Malaysia."],"f":"Kuala Lumpur means 'muddy confluence'; the Petronas Towers were the tallest buildings in the world from 1998 to 2004."},"currency":{"t":"RINGGIT — Malaysia's ringgit means 'jagged', after the milled edge of Spanish dollars."},"language":{"t":"MALAY — Bahasa Malaysia; Indonesian is a close variant."}},"np":{"flag":{"t":"The only non-rectangular flag: two stacked red pennants with blue borders, a moon on top and a sun below. Two Himalayan peaks.","f":"The only non-rectangular national flag: two stacked pennants, with a moon for the royal house and a sun for the prime minister's family."},"map":{"t":"Landlocked strip along the Himalayas between India and China (Tibet).","f":"Eight of the world's ten highest mountains, including Everest, are on Nepal's border or inside it."},"capital":{"t":["Kathmandu — 'CAT-man-DO': a catman does yoga in Kathmandu.","KNEE PAUL, and his CAT-MAN hairDO flops — Kathmandu, Nepal."],"f":"Kathmandu was once a lake, according to both legend and geology; it lies in a bowl-shaped valley."},"language":{"t":"NEPALI — related to Hindi and written in the same Devanagari script."}},"om":{"flag":{"t":["White-red-green horizontal with a red vertical strip at the hoist and a crossed-swords emblem. Swords and a dagger — Omani khanjar.","OMAN: crossed swords and a dagger on a red bar at the pole, white-red-green beside."],"f":"The crossed swords and khanjar dagger are the national emblem; before 1970 the flag was plain red."},"map":{"t":"Southeast corner of the Arabian peninsula, facing the Arabian Sea.","f":"The Musandam peninsula, an Omani exclave, juts into the Strait of Hormuz, separated from Oman by the UAE."},"capital":{"t":["Muscat — a MUSCAT grape (not Amman — that's Jordan).","OH MAN, it's an omen — a MUSKET — Muscat, Oman."],"f":"Muscat's Sultan Qaboos Grand Mosque had, for a time, the largest single-piece hand-woven carpet in the world."},"currency":{"t":"RIAL — Oman's rial is one of the strongest currencies: one rial is worth over two US dollars."}},"ph":{"flag":{"t":["Blue over red horizontal with a white hoist triangle holding a sun and three stars. Flown red-side-up in wartime.","PHILIPPINES: a white triangle at the pole with a sun and three stars; flipped to red-on-top means war."],"f":"The only national flag flown upside down to signal war: red on top means the Philippines is at war."},"map":{"t":"The island archipelago east of Vietnam, north of Indonesia.","f":"The Philippines has about 7,640 islands, and the name honours King Philip II of Spain."},"capital":{"t":["Manila — Manila envelopes.","PHILIP sits on MAN HILL-A — Manila, Philippines."],"f":"Manila's Intramuros was the walled Spanish city; the Philippines was governed from Mexico City for 250 years."},"language":{"t":"FILIPINO — based on Tagalog; English is co-official, a legacy of US rule."}},"pk":{"flag":{"t":["Green with a white crescent and star, plus a white vertical strip at the hoist. Green for Muslims, white for minorities.","PAK-istan: green with a white stripe PACKED against the pole, crescent and star."],"f":"The white stripe stands for religious minorities; the green with crescent and star for the Muslim majority."},"map":{"t":"West of India, east of Iran and Afghanistan, Arabian Sea coast.","f":"K2, the world's second-highest peak, is in Pakistan; the Indus Valley civilisation flourished here 4,500 years ago."},"capital":{"t":["Islamabad — 'Islam-abad', the purpose-built capital (Karachi is bigger).","PACK A suitcase on the LLAMA BED — IS LLAMA BAD? — Islamabad, Pakistan."],"f":"Islamabad was built from scratch in the 1960s to replace Karachi as capital; it's known for being unusually green and orderly."},"language":{"t":"URDU — close to Hindi in speech but written in Arabic script; English is the other official language."}},"ps":{"flag":{"t":"Black-white-green horizontal with a red hoist triangle. Jordan's flag without the star.","f":"The Pan-Arab colours come from the 1916 Arab Revolt; the flag has been used by the PLO since 1964."},"map":{"t":"The West Bank and Gaza, alongside Israel.","f":"The territory is split between the West Bank and Gaza, which do not touch each other."},"capital":{"t":"Ramallah — administrative centre (East Jerusalem is the claimed capital).","f":"Palestine claims East Jerusalem as capital; Ramallah is the de facto administrative centre."}},"qa":{"flag":{"t":["Maroon with a white serrated hoist strip (nine points). Bahrain is red with five points.","QATAR: maroon with NINE white teeth along the pole. Bahrain is red with five."],"f":"Qatar's is the only national flag wider than twice its height (11:28); the maroon came from dye that darkened in the sun."},"map":{"t":"A thumb sticking north into the Persian Gulf from Saudi Arabia.","f":"Qatar is a peninsula off Saudi Arabia and hosted the 2022 World Cup, the first in the Middle East."},"capital":{"t":["Doha — 'DOH-ha': Homer Simpson lost in Doha's desert heat.","Playing a GUITAR with a DOH-nut — Doha, Qatar."],"f":"Doha's Museum of Islamic Art was designed by I.M. Pei, who came out of retirement at 91 for it."}},"sa":{"flag":{"t":["Green with white Arabic script (the shahada) above a sword. The only flag with a sword and a creed.","SAUDI ARABIA: green with white script and a sword beneath."],"f":"The writing is the Shahada, so the flag is never flown at half-mast; it's made with a double thickness so the text reads correctly from both sides."},"map":{"t":"Most of the Arabian peninsula.","f":"The Rub' al Khali, the 'Empty Quarter', is the largest continuous sand desert on Earth; Saudi Arabia has no permanent rivers."},"capital":{"t":["Riyadh — 'RE-ADD': re-add oil money in Riyadh.","SAW DE ARABIAN horse — RE: ODD — Riyadh."],"f":"Riyadh's name means 'the gardens'; the city was a walled oasis town until oil money arrived in the 1950s."}},"sg":{"flag":{"t":"Red over white with a white crescent and five stars in the top-left. Indonesia's colours plus crescent and stars.","f":"The five stars stand for democracy, peace, progress, justice and equality; the crescent for a young nation on the rise."},"map":{"t":"A city-island at the tip of the Malay peninsula.","f":"Singapore has grown by about 25% through land reclamation since independence, importing sand from its neighbours."},"capital":{"t":"Singapore — city-state.","f":"Singapore is a city-state, so the capital is the country; it's the only country to gain independence against its will, expelled from Malaysia in 1965."},"language":{"t":"MALAY, CHINESE, TAMIL, ENGLISH — four official languages; Malay is the 'national' one, English the working one."}},"sy":{"flag":{"t":["Red-white-black horizontal with two green stars in the white. Two stars = the old union with Egypt. (The 2024 government uses the green-white-black three-star flag.)","SYRIA: red-white-black with TWO green stars. Egypt has an eagle; Yemen has nothing."],"f":"The two green stars date from the 1958–61 union with Egypt (the United Arab Republic); the opposition uses the older green-white-black flag with three red stars."},"map":{"t":"North of Jordan, east of Lebanon, south of Turkey, with a short Mediterranean coast.","f":"Damascus and Aleppo both claim to be the oldest continuously inhabited cities in the world."},"capital":{"t":"Damascus — 'DAMASK' silk; one of the oldest cities on Earth.","f":"Damascus is said to be the place where Saul became Paul, on the 'road to Damascus'."}},"th":{"flag":{"t":["Red-white-blue-white-red horizontal, wide blue centre. Costa Rica is the inverse (blue outside, red centre).","THAI-land: THICK blue in the middle. Costa Rica has the red in the middle."],"f":"The blue stripe was added in 1917 to match the Allies' colours in WWI; the old flag had a white elephant on red."},"map":{"t":"Elephant's-head shape between Myanmar and Laos/Cambodia, with a trunk down to Malaysia.","f":"Thailand is the only Southeast Asian country never colonised by a European power; it was called Siam until 1939."},"capital":{"t":["Bangkok — 'BANG-COCK': a cockerel bangs a gong in Bangkok.","A TIE flies down the hall and BANGS into a COCKerel — Bangkok, Thailand."],"f":"Bangkok's full ceremonial name is 168 letters long, the longest place name in the world."},"currency":{"t":"BAHT — Thailand's baht was originally a weight of silver (about 15 g)."},"language":{"t":"THAI — a tonal language with its own script; never colonised, so no European official language."}},"tj":{"flag":{"t":"Red-white-green horizontal with a gold crown under seven stars. Iran's colours (white middle, wider) with a crown.","f":"The crown with seven stars stands for the Tajik people ('taj' means crown); the seven stars for perfection and the number seven in Persian legend."},"map":{"t":"Mountainous, landlocked, south of Kyrgyzstan, north of Afghanistan.","f":"The Pamir Highway through Tajikistan is the second-highest international road in the world; over 90% of the country is mountains."},"capital":{"t":["Dushanbe — 'DOO-shan-BAY': means 'Monday' (a Monday market town).","TOUCH HER CHEEK and DO THE SHAMBA — Dushanbe, Tajikistan."],"f":"Dushanbe means 'Monday' — it grew from a village whose market was held on Mondays."},"currency":{"t":"SOMONI — Tajikistan's somoni is named after Ismail Samani, founder of the Samanid dynasty."},"language":{"t":"TAJIK — a form of Persian written in Cyrillic; the only Persian-speaking Central Asian country."}},"tl":{"flag":{"t":["Red with a black triangle inside a yellow triangle at the hoist, and a white star. Black arrow on gold.","TIMOR-LESTE: a black arrowhead inside a yellow one, pointing in from the pole on red."],"f":"The black triangle stands for centuries of colonial darkness; East Timor gained independence in 2002, the first new country of the 21st century."},"map":{"t":"The eastern half of Timor island, north of Australia.","f":"East Timor occupies half an island; the other half is Indonesian. It also has a small exclave, Oecusse, inside Indonesian Timor."},"capital":{"t":["Dili — 'DILLY-dally' in Dili.","This TEA, MORE OR LESS, tastes DILLY — Dili, Timor-Leste."],"f":"Dili was Portuguese for 400 years, then Indonesian-occupied from 1975 to 1999; the country's official languages are Tetum and Portuguese."},"currency":{"t":"US DOLLAR — East Timor uses US dollars with its own centavo coins."},"language":{"t":"TETUM and PORTUGUESE — 400 years of Portuguese rule; Tetum is the local language."}},"tm":{"flag":{"t":["Green with a vertical carpet-pattern strip at the hoist and a crescent with five stars. The carpet stripe is unique.","TURKMEN-istan: green with a CARPET running up the pole."],"f":"The carpet stripe shows five guls (tribal carpet motifs) and is the most detailed design on any national flag."},"map":{"t":"Desert country east of the Caspian, north of Iran and Afghanistan.","f":"The Darvaza gas crater, 'the Gates of Hell', has burned continuously since Soviet engineers lit it in 1971."},"capital":{"t":["Ashgabat — 'ASH GAB AT': the white-marble city. Ashes gab at you.","TURKEY MEN standing in ASH start to GOBBLE, then shout 'HOT!' — Ashgabat, Turkmenistan."],"f":"Ashgabat holds the Guinness record for the most white-marble buildings in one city."},"language":{"t":"TURKMEN — Turkic, like Turkish; written in Latin script since 1993."}},"tr":{"flag":{"t":"Red with a white crescent and star. The original crescent-and-star flag.","f":"Legend says the crescent and star were reflected in a pool of blood after a battle; the flag law fixes the proportions to the millimetre."},"map":{"t":"The bridge from Europe to Asia, between the Black Sea and the Mediterranean.","f":"Turkey straddles two continents; only about 3% of its land is in Europe, but that includes most of Istanbul."},"capital":{"t":["Ankara — ANKARA, not Istanbul. An ANCHOR in the centre of the country.","A TURKEY drives off with an ANCHOR behind the CAR — Ankara, Turkey."],"f":"Atatürk moved the capital from Istanbul to Ankara in 1923 to break with the Ottoman past; Ankara is where angora wool got its name."},"currency":{"t":"LIRA — Turkey's lira, from the Latin 'libra' (pound); Italy's old lira was the same word."},"language":{"t":"TURKISH — switched from Arabic to Latin script in 1928 under Atatürk."}},"tw":{"flag":{"t":["Red with a blue canton holding a white 12-ray sun. 'White sun in blue sky over red earth.'","TAI-WAN: ONE white sun in a blue corner on red."],"f":"'Blue sky, white sun, and a wholly red earth' — the sun has 12 rays for the 12 two-hour periods of the traditional day."},"map":{"t":"Island off the southeast coast of mainland China.","f":"Taiwan is about 180 km off China's coast; the Portuguese called it Ilha Formosa, 'beautiful island'."},"capital":{"t":"Taipei — Taipei 101.","f":"Taipei 101 was the world's tallest building from 2004 to 2010 and has a 660-tonne damper ball to resist typhoons and earthquakes."},"currency":{"t":"NEW TAIWAN DOLLAR — Taiwan's dollar; 'new' since 1949."},"language":{"t":"CHINESE — Mandarin, written in traditional characters (mainland China uses simplified)."}},"uz":{"flag":{"t":"Blue-white-green horizontal with thin red lines, a crescent and twelve stars in the corner. Twelve stars = twelve months.","f":"The 12 stars stand for the months and the zodiac; the crescent is for the republic's rebirth as much as for Islam."},"map":{"t":"Doubly landlocked, in the middle of the 'stans, holds the Aral Sea remnants.","f":"Uzbekistan is one of only two doubly landlocked countries (with Liechtenstein); the Aral Sea on its border has mostly dried up."},"capital":{"t":["Tashkent — 'TASH KENT': a tash (moustache) in Kent. Stone city.","OOZE BACK: TASHA and KENT help — Tashkent, Uzbekistan."],"f":"Tashkent was rebuilt after a 1966 earthquake and has the only metro system in Central Asia, with famously ornate stations."},"currency":{"t":"SO'M — Uzbekistan's so'm, spelled with an apostrophe; Kyrgyzstan's is som."},"language":{"t":"UZBEK — a Turkic language; the country moved from Cyrillic to Latin script."}},"vn":{"flag":{"t":["Red with a big yellow five-point star. One star, no arc — that's Vietnam; China has five stars.","VIET-NAM: one gold star, dead centre on red — as plain as a star flag gets."],"f":"The five-pointed star's points stand for intellectuals, farmers, workers, businesspeople and soldiers."},"map":{"t":"The long S-shape down the east coast of Southeast Asia.","f":"Vietnam is shaped like an S (or, locals say, two rice baskets on a pole); it's the world's second-largest coffee exporter."},"capital":{"t":["Hanoi — 'HA NOI-sy' scooters. Not Ho Chi Minh City (Saigon) — that's the big one.","The VET brings HAND JOY — Hanoi, Vietnam."],"f":"Hanoi is over 1,000 years old, founded in 1010; the seat of government stayed here while Saigon (Ho Chi Minh City) grew bigger."},"currency":{"t":"ĐỒNG — Vietnam's đồng means 'copper'; notes go up to 500,000."},"language":{"t":"VIETNAMESE — written in Latin letters with many accents, thanks to a 17th-century Jesuit."}},"ye":{"flag":{"t":["Red-white-black horizontal, plain. Egypt has an eagle, Iraq script, Syria stars — Yemen has nothing.","YEMEN: red-white-black and nothing else — the plain one."],"f":"The plain red-white-black is the pan-Arab Liberation tricolour with nothing added; Yemen adopted it on unification in 1990."},"map":{"t":"Southwest corner of the Arabian peninsula, opposite the Horn of Africa.","f":"Socotra island, off Yemen, has dragon's blood trees found nowhere else on Earth; the country is on the southern tip of Arabia."},"capital":{"t":["Sana'a — 'SANA': Yemen's ancient mud-brick skyscraper city.","'Why?' 'YEAH, MAN, that's not SANITARY' — Sana'a, Yemen."],"f":"Sana'a's old city, with its gingerbread-like tower houses, has been inhabited for over 2,500 years."}},"ae":{"flag":{"t":["Green-white-black horizontal with a red vertical strip at the hoist. Pan-Arab colours; red at the hoist like Kuwait but no trapezoid.","UAE: green-white-black horizontal with a red bar up the pole."],"f":"The pan-Arab colours in a design from 1971, when seven emirates federated; a 19-year-old won the competition to design it."},"map":{"t":"The Gulf coast between Saudi Arabia and Oman.","f":"The UAE is seven emirates; Abu Dhabi holds about 85% of the land and most of the oil, Dubai has the tallest building in the world."},"capital":{"t":["Abu Dhabi — not Dubai! ABU is the capital; Dubai is the showy one.","'You knighted an ARAB, am I right?' ABU DABS in reply — Abu Dhabi, UAE."],"f":"Abu Dhabi, not Dubai, is the capital; its Sheikh Zayed Mosque has 82 domes and a chandelier weighing 12 tonnes."},"currency":{"t":"DIRHAM — the UAE dirham, like Morocco's; the symbol is Dh."},"language":{"t":"ARABIC — though most residents are expatriates and English is the working language."}},"ao":{"flag":{"t":"Red over black with a yellow half-gear, machete and star. The machete-and-cog looks like a hammer and sickle.","f":"The half cogwheel and machete echo the hammer and sickle; Angola's flag is one of the few with a machete on it."},"map":{"t":"Southwest Africa's Atlantic coast, south of DR Congo; Cabinda is the detached bit up north.","f":"Cabinda is an Angolan exclave cut off by a strip of DR Congo; Angola was Portuguese for 400 years."},"capital":{"t":["Luanda — 'LOO-ANDA': Luanda's lands by the sea.","An ANGEL perched on the LOO AND… — Luanda."],"f":"Luanda has repeatedly ranked as the most expensive city in the world for expatriates, thanks to oil money and imports."},"currency":{"t":"KWANZA — Angola's kwanza is named after the Kwanza river; sounds like the festival Kwanzaa, which is also from an African word."}},"bf":{"flag":{"t":["Red over green with a yellow star in the centre. Burkina: the star burns between red and green.","BURKINA FASO: a red BURNing sky over a green field, one yellow star between."],"f":"Adopted in 1984 by Thomas Sankara, who also renamed the country from Upper Volta to Burkina Faso, 'land of upright people'."},"map":{"t":"Landlocked, north of Ghana, south of Mali and Niger.","f":"Landlocked in the Sahel, Burkina Faso hosts FESPACO, Africa's largest film festival, every two years."},"capital":{"t":["Ouagadougou — 'WAGA-DOO-GOO': wag a doggy in Ouagadougou.","'I WANNA DO GOOD on my diet, but I'm a BURGER KING FATSO' — Ouagadougou, Burkina Faso."],"f":"Ouagadougou is pronounced roughly 'wah-ga-DOO-goo'; locals just say 'Ouaga'."}},"bi":{"flag":{"t":"White diagonal cross (saltire) dividing red and green, with three red stars in a white circle. The X marks Burundi.","f":"The three stars stand for the motto 'Unity, Work, Progress' and for the Hutu, Tutsi and Twa peoples."},"map":{"t":"Tiny, landlocked, south of Rwanda, on Lake Tanganyika.","f":"Burundi sits on the northeastern tip of Lake Tanganyika, the second-deepest lake in the world; the southernmost source of the Nile is here."},"capital":{"t":["Gitega — moved from Bujumbura in 2019. 'GET EGGa' in Gitega.","BURIED UNDER the laundry I found my BLUE JUMPER — Bujumbura (the old capital; Gitega is the new one)."],"f":"Burundi moved its political capital from Bujumbura to Gitega in 2019; Bujumbura stays the economic capital."}},"bj":{"flag":{"t":["Green vertical at the hoist, then yellow over red. Green bar on the left — Benin.","BEN-in: a green BIN standing at the pole, yellow over red beside it."],"f":"Green for hope, yellow for wealth, red for courage — restored in 1990 after 15 years of a Marxist green flag with a red star."},"map":{"t":"A thin vertical strip between Togo and Nigeria, on the Gulf of Guinea.","f":"Benin was the Kingdom of Dahomey, famous for its all-female regiment, the 'Dahomey Amazons'; Vodun (voodoo) originated here."},"capital":{"t":"Porto-Novo — 'new port' (Cotonou is the big city).","f":"Porto-Novo is the official capital but the government mostly sits in Cotonou, the largest city."}},"bw":{"flag":{"t":"Light blue with a black horizontal stripe edged in white. Blue = rain (pula); black and white = racial harmony, zebra stripes.","f":"The black and white stripes stand for racial harmony (and for the zebra); the blue is for water, precious in a mostly desert country — the motto is 'Pula', rain."},"map":{"t":"Landlocked, north of South Africa, mostly the Kalahari.","f":"Botswana has the largest elephant population in the world and the Okavango, a river that ends in an inland delta rather than the sea."},"capital":{"t":["Gaborone — 'GAB-o-ROH-nee': gab on the phone in Gaborone.","The BOTS WANNA GAB ON their own — Gaborone."],"f":"Gaborone was purpose-built as the capital in the 1960s; it's the setting for The No. 1 Ladies' Detective Agency."},"currency":{"t":"PULA — Botswana's pula means 'rain', precious in a desert country; it's also on the coat of arms."},"language":{"t":"TSWANA — Setswana; the country's name means 'land of the Tswana'."}},"cd":{"flag":{"t":"Sky blue with a red diagonal stripe edged in yellow and a yellow star in the corner. The big Congo has the big diagonal.","f":"The diagonal red stripe stands for the blood of the country's martyrs; the star is a bright future. Restored in 2006."},"map":{"t":"The huge country in the middle of Africa, straddling the equator.","f":"DR Congo is the largest country in sub-Saharan Africa; the Congo river is the deepest in the world, over 220 m in places."},"capital":{"t":"Kinshasa — across the river from Brazzaville. 'KIN' — the big Congo's family.","f":"Kinshasa and Brazzaville face each other across the Congo — the closest pair of capitals in the world."},"language":{"t":"FRENCH, LINGALA — Kinshasa is the largest French-speaking city in the world."}},"cf":{"flag":{"t":["Four horizontal stripes (blue, white, green, yellow) cut by a red vertical stripe, star in the corner. The cross-shaped one — 'central'.","CENTRAL AFRICAN REPUBLIC: four horizontal stripes with a red bar straight down the middle."],"f":"The only flag combining pan-African colours with the French tricolour, with a red bar cutting through both; designed by its first president in 1958."},"map":{"t":"Landlocked, dead centre of Africa, north of the two Congos.","f":"Landlocked and nearly at the geographic centre of Africa; Emperor Bokassa crowned himself in 1977 at a cost of a third of the national budget."},"capital":{"t":"Bangui — 'BANG-EE': bang a gong in Bangui.","f":"Bangui sits on the Ubangi river, which forms the border with DR Congo."}},"cg":{"flag":{"t":"Green and red split by a yellow diagonal from bottom-left to top-right. The small Congo is a diagonal tricolour.","f":"A diagonal design in pan-African colours, adopted in 1959, replaced by a red communist flag 1970–1991, then restored."},"map":{"t":"The smaller Congo, west of the river, on the Atlantic.","f":"The smaller Congo, on the north bank of the river; it's almost 70% rainforest."},"capital":{"t":"Brazzaville — the only two capitals in the world facing each other across a river: Brazzaville and Kinshasa.","f":"Brazzaville is named after the explorer Pierre Savorgnan de Brazza; it was capital of Free France in Africa during WWII."}},"ci":{"flag":{"t":"Orange-white-green vertical, orange at the hoist. Ireland reversed; Ivory Coast is on the right on the map, orange on the left on the flag.","f":"The colours mirror Ireland's — orange, white, green — but Ivory Coast's orange is at the hoist. Adopted in 1959."},"map":{"t":"West African coast between Liberia and Ghana.","f":"The country is officially 'Côte d'Ivoire' in every language; its name comes from the ivory trade."},"capital":{"t":"Yamoussoukro — 'YAM-oo-SOO-kro': yams in Yamoussoukro; Abidjan is the big city.","f":"Yamoussoukro was the birthplace of the first president, who made it capital in 1983 and built the largest church in the world there, modelled on St Peter's."},"language":{"t":"FRENCH — the largest French-speaking country in West Africa."}},"cm":{"flag":{"t":"Green-red-yellow vertical with a yellow star on the red. Cameroon: star in the middle stripe.","f":"The first flag with all three pan-African colours; the single star replaced two stars when the country became unitary in 1975."},"map":{"t":"The hinge of Africa where West meets Central, above the Gulf of Guinea's corner.","f":"'Africa in miniature': Cameroon has desert, savanna, rainforest and mountains; the name comes from Portuguese 'camarões', shrimps."},"capital":{"t":["Yaoundé — 'YA-OON-day': yawn all day in Yaoundé; Douala is the port.","I have a CAMERA: 'YA, ONE DAY of photos' — Yaoundé."],"f":"Yaoundé is the political capital; Douala is the larger commercial city and port."}},"cv":{"flag":{"t":["Blue with a thin red-and-white band and a ring of ten yellow stars. Ten stars = ten islands; EU-style ring.","CAPE VERDE: blue with a ring of ten stars low down."],"f":"The ten stars in a ring are the ten islands; the blue is the ocean, in the colours of the EU-style design chosen in 1992."},"map":{"t":"Island group in the Atlantic, west of Senegal.","f":"Cape Verde is an archipelago 570 km off Senegal; more Cape Verdeans live abroad than at home."},"capital":{"t":["Praia — 'PRAY-a' = beach in Portuguese.","A priest in a CAPE of GREEN wants to PRY YA — Praia, Cape Verde."],"f":"Praia means 'beach' in Portuguese; the country changed its official name to Cabo Verde in 2013."},"currency":{"t":"ESCUDO — Cape Verde kept Portugal's old currency name (shield)."}},"dj":{"flag":{"t":"Light blue over green with a white hoist triangle and a red star. Blue sea, green land, red star.","f":"Light blue for the Issa people and sea, green for the Afar and land, a red star for unity. Adopted at independence in 1977."},"map":{"t":"Tiny country at the mouth of the Red Sea, between Eritrea and Somalia.","f":"Djibouti guards the Bab-el-Mandeb strait at the Red Sea's mouth and hosts the only permanent US military base in Africa, plus French, Chinese and Japanese bases."},"capital":{"t":["Djibouti — same name as the country.","DJIBOUTI: your booty is where you sit, and the capital sits on the same name."],"f":"Djibouti City is also the country's name; Lake Assal nearby is the lowest point in Africa, 155 m below sea level."}},"dz":{"flag":{"t":"Green and white vertical halves with a red crescent and star across the middle. Half green, half white — Algeria.","f":"The green half is for Islam, the white for purity; the design was reportedly used by Emir Abdelkader's resistance in the 1800s."},"map":{"t":"Biggest country in Africa, Mediterranean coast between Morocco and Tunisia.","f":"Algeria became the largest country in Africa when Sudan split in 2011; over 80% of it is Sahara."},"capital":{"t":["Algiers — Algeria → Algiers.","ALL CHEERY in public, ALL TEARS in private — Algiers."],"f":"Algiers is called 'El Bahdja', the joyful, and the 'White City' for its whitewashed buildings climbing from the bay."}},"eg":{"flag":{"t":["Red-white-black horizontal with a gold eagle of Saladin in the middle. Eagle = Egypt.","The Arab Liberation family: red-white-black horizontal. Egypt adds a golden eagle, Iraq green script, Syria two green stars, Yemen nothing, Sudan a green triangle."],"f":"The golden eagle is the Eagle of Saladin; the red-white-black is the Arab Liberation flag from the 1952 revolution."},"map":{"t":"Northeast corner of Africa, the Nile, touching Sinai.","f":"About 95% of Egyptians live along the Nile, on around 5% of the land; the Sinai peninsula is in Asia."},"capital":{"t":["Cairo — the pyramids of Giza next door.","He GYPPED me to get a CAR-O — Cairo."],"f":"Cairo is the largest city in Africa and the Arab world; the Giza pyramids are visible from its suburbs. A new administrative capital is being built in the desert to the east."},"currency":{"t":"POUND — Egypt, Lebanon, Syria, Sudan and South Sudan all call their money pounds, from the British and Ottoman era."},"language":{"t":"ARABIC — Egyptian Arabic is the most widely understood dialect, thanks to Egyptian films and music."}},"eh":{"flag":{"t":"Black-white-green horizontal with a red hoist triangle and a red crescent and star. Palestine's flag plus crescent.","f":"The Sahrawi flag mirrors the Palestinian one with a crescent and star added; it's flown by the Polisario Front."},"map":{"t":"Disputed desert territory south of Morocco, on the Atlantic.","f":"Western Sahara is the largest territory on the UN's list of non-self-governing territories, mostly controlled by Morocco since 1975."},"capital":{"t":"El Aaiún (Laayoune).","f":"El Aaiún (Laayoune) was built by the Spanish in the 1930s; the Sahrawi government-in-exile is based in refugee camps in Algeria."}},"er":{"flag":{"t":["Red triangle from the hoist splitting green (top) and blue (bottom), with a gold olive wreath. Wreath in a red triangle.","ERI-TREA: TRI — a red TRIangle from the pole with a golden wreath in it."],"f":"The olive branch and wreath are from the 1952 UN flag for Eritrea; the red triangle points to the future."},"map":{"t":"Red Sea coast north of Ethiopia, once part of it.","f":"Eritrea's Red Sea coast is over 1,000 km long; the Dahlak archipelago has around 350 islands."},"capital":{"t":"Asmara — 'AS MARA': Italian-built art-deco city.","f":"Asmara is a UNESCO site for its 1930s Italian modernist architecture, including a petrol station shaped like an aeroplane."},"currency":{"t":"NAKFA — Eritrea's currency is named after the town of Nakfa, where the independence war turned."},"language":{"t":"TIGRINYA — shared with Ethiopia's Tigray region; Eritrea has no single official language."}},"et":{"flag":{"t":"Green-yellow-red horizontal with a blue disc holding a yellow star. The original pan-African colours; Bolivia is red on top.","f":"Ethiopia's green-yellow-red inspired the pan-African colours used across the continent; the blue disc and star came in 1996."},"map":{"t":"The Horn of Africa's landlocked highland heart.","f":"Ethiopia is the most populous landlocked country and was never colonised (barring a brief Italian occupation)."},"capital":{"t":["Addis Ababa — 'new flower'; Addis ADDS a BABA.","A TEETHY smile: 'all dis leads to A BABY' — Addis Ababa."],"f":"Addis Ababa means 'new flower'; it hosts the African Union headquarters and sits at 2,355 m, one of the highest capitals in the world."},"currency":{"t":"BIRR — Ethiopia's birr means 'silver' in Amharic; brrr, cold silver."},"language":{"t":"AMHARIC — with its own alphabet (Ge'ez script), one of the few native African scripts."}},"ga":{"flag":{"t":"Green-yellow-blue horizontal, equal stripes. Forest, sun, sea — Gabon from land to ocean.","f":"The yellow stripe is the equator, which runs through the country; green for forests, blue for sea."},"map":{"t":"Straddles the equator on the Atlantic, west of Congo.","f":"About 85% of Gabon is rainforest; the country set aside 11% of its land as national parks in 2002."},"capital":{"t":["Libreville — 'free town' in French (Freetown is Sierra Leone's).","A CABIN that's a little FREE LIBRARY VILLAGE — Libreville, Gabon."],"f":"Libreville, 'free town', was founded in 1849 for freed slaves, like Freetown in Sierra Leone."}},"gh":{"flag":{"t":"Red-yellow-green horizontal with a black star. Red on top; Bolivia has no star; Ghana's black star is the football team's name.","f":"Ghana was the first African flag to use the Ethiopian colours, in 1957 — with a black star for African freedom, the 'lodestar'."},"map":{"t":"West Africa, between Ivory Coast and Togo, Lake Volta inside.","f":"Lake Volta is the largest man-made reservoir by surface area in the world; Ghana was the Gold Coast until 1957."},"capital":{"t":"Accra — 'a CRAB' in Accra.","f":"Accra's Jamestown lighthouse and Independence Square date from Ghana becoming the first sub-Saharan colony to gain independence."},"currency":{"t":"CEDI — Ghana's cedi comes from the Akan word for cowrie shell, the old money."}},"gm":{"flag":{"t":"Red-blue-green horizontal with thin white lines. Red sun, blue river, green land — the river is the country.","f":"The blue band is the Gambia river, which the country is essentially built around; the white lines are for peace."},"map":{"t":"A thin strip along the Gambia river, entirely inside Senegal.","f":"The Gambia is the smallest country on mainland Africa, a thin strip along the river inside Senegal — its borders roughly follow how far a cannon could fire from the river."},"capital":{"t":["Banjul — 'BAN JEWELS' in Banjul.","THE GAME is a BANJO DUEL — Banjul, The Gambia."],"f":"Banjul sits on an island at the river's mouth; it's one of Africa's smallest capitals, and many government functions have moved to Serekunda."},"currency":{"t":"DALASI — The Gambia's dalasi; the coin is the 'butut'."}},"gn":{"flag":{"t":["Red-yellow-green vertical, red at the hoist. Mali is the mirror (green at the hoist). Guinea: Great Red first.","GUINEA: red at the pole, like a guinea fowl's red wattle. Mali is the mirror image with green at the pole."],"f":"Guinea's red-yellow-green is the mirror image of Mali's green-yellow-red; adopted in 1958."},"map":{"t":"West African coast, curled around Sierra Leone and Liberia.","f":"Guinea holds the world's largest bauxite reserves and the sources of the Niger, Senegal and Gambia rivers."},"capital":{"t":["Conakry — 'CON a CREE': Conakry.","The GUINEA pig has an empty ice-cream CONE (and a KONA coffee habit) — Conakry."],"f":"Conakry sits on Tombo island and the Kaloum peninsula, jutting into the Atlantic."}},"gq":{"flag":{"t":["Green-white-red horizontal with a blue hoist triangle and a crest with a silk-cotton tree. Tree in the middle.","EQUATORIAL GUINEA: green-white-red with a blue triangle and a tree with six stars."],"f":"The six stars on the tree stand for the mainland and five islands; the tree is a silk-cotton tree where a treaty with Spain was signed."},"map":{"t":"A small block on the Atlantic coast between Cameroon and Gabon, plus the island of Bioko.","f":"The only Spanish-speaking country in Africa; the capital is on an island (Bioko) off Cameroon, not on the mainland."},"capital":{"t":"Malabo — on Bioko island, not the mainland. 'MALL-a-BO'.","f":"Malabo is on Bioko island; a new capital, Ciudad de la Paz, is being built on the mainland."},"language":{"t":"SPANISH — the only Spanish-speaking country in Africa."}},"gw":{"flag":{"t":"Red vertical at the hoist with a black star, then yellow over green. Guinea-Bissau = Ghana's colours turned sideways with the star at the hoist.","f":"The design copies Ghana's colours and black star, via the PAIGC party that fought Portugal."},"map":{"t":"Small country on the coast between Senegal and Guinea.","f":"Guinea-Bissau's Bijagós archipelago has saltwater hippos that swim in the sea; the country grows lots of cashews."},"capital":{"t":"Bissau — same as the country's second word.","f":"Bissau is the only capital that shares its name with the country (Guinea-Bissau) to tell it apart from Guinea."}},"ke":{"flag":{"t":"Black-red-green horizontal with white edges and a Maasai shield and spears. The shield flag.","f":"The Maasai shield and spears defend the country; the design is from KANU, the independence party, adopted in 1963."},"map":{"t":"East African coast on the equator, south of Ethiopia, with Lake Victoria's corner.","f":"The equator crosses Kenya; the Great Rift Valley and the Maasai Mara wildebeest migration are here."},"capital":{"t":["Nairobi — 'NAI-ROBE-y': Nairobi safari.","CAN YA tie your ROBE-Y? — Nairobi, Kenya."],"f":"Nairobi has a national park with lions inside the city limits, with skyscrapers visible behind the giraffes."},"currency":{"t":"SHILLING — Kenya, Uganda, Tanzania and Somalia kept the British shilling."},"language":{"t":"SWAHILI and ENGLISH — Swahili (Kiswahili) is East Africa's lingua franca; 'hakuna matata' is Swahili."}},"km":{"flag":{"t":["Four horizontal stripes (yellow, white, red, blue) with a green hoist triangle holding a crescent and four stars. Four islands, four stars, four stripes.","CO-MO-RO-S: four syllables, four stripes, four stars, four islands."],"f":"The four stripes and four stars are the four islands, including Mayotte, which Comoros claims but France administers."},"map":{"t":"Island group between Mozambique and Madagascar.","f":"Comoros lies between Mozambique and Madagascar and is the world's largest producer of ylang-ylang for perfume."},"capital":{"t":["Moroni — 'MORONI' on the Comoros.","'You're in a COMA, Rose. You MORON-i' — Moroni, Comoros."],"f":"Moroni is on Grande Comore, right beneath Mount Karthala, one of the most active volcanoes in the world."}},"lr":{"flag":{"t":"Eleven red and white stripes with a single white star on blue — a one-star US flag. Founded by freed American slaves.","f":"Modelled on the US flag, with 11 stripes for the signers of the declaration of independence; Liberia was founded by freed American slaves in 1847."},"map":{"t":"West African coast between Sierra Leone and Ivory Coast.","f":"Liberia is Africa's oldest republic and, with the US and Myanmar, one of the three countries not officially metric."},"capital":{"t":["Monrovia — named after US president Monroe.","I LIKE BEER on my MOON ROVER — Monrovia, Liberia."],"f":"Monrovia is named after US President James Monroe — the only foreign capital named after a US president."}},"ls":{"flag":{"t":["Blue-white-green horizontal with a black Basotho hat in the centre. The hat flag.","LE-SOTHO: a black SOMBRERO-shaped hat (the Basotho hat) on blue, white, green."],"f":"The black object is a mokorotlo, the conical Basotho straw hat; adopted in 2006 for the country's 40th anniversary."},"map":{"t":"A country entirely surrounded by South Africa, in the mountains.","f":"Lesotho is entirely surrounded by South Africa and is the only country with all its land above 1,000 m."},"capital":{"t":["Maseru — 'MASS-eh-ROO': mass of kangaroos? no — a mass in Maseru.","'LET'S SEW THE toe' — 'Yes, MASTER, YOU' — Maseru, Lesotho."],"f":"Maseru sits on the Caledon river at the South African border; the name means 'red sandstone'."},"currency":{"t":"LOTI — Lesotho's loti (plural maloti), pegged to the South African rand."}},"ly":{"flag":{"t":"Red-black-green horizontal (wide black middle) with a white crescent and star. Once plain green; now the black-centred flag.","f":"The 1951 monarchy flag, restored in 2011 after 34 years of Gaddafi's plain green flag — the only single-colour national flag ever."},"map":{"t":"North Africa between Tunisia/Algeria and Egypt.","f":"Libya is about 90% desert and holds Africa's largest oil reserves; Leptis Magna is one of the best-preserved Roman cities."},"capital":{"t":["Tripoli — 'TRIP-oli' along the Mediterranean; the Marines' Hymn 'shores of Tripoli'.","LIBBY has TRIPLETS — Tripoli, Libya."],"f":"Tripoli means 'three cities' in Greek; it's on the Mediterranean and was a base for the Barbary pirates."}},"ma":{"flag":{"t":["Red with a green five-point star (interlaced pentagram). Red flag, green star.","MOROCCO: one green pentagram on red — nothing else."],"f":"The green pentagram, the Seal of Solomon, was added in 1915; before that the flag was plain red."},"map":{"t":"Northwest corner of Africa, across from Spain.","f":"Morocco is the only African country with both Mediterranean and Atlantic coasts, and Spain is just 14 km away across the Strait of Gibraltar."},"capital":{"t":["Rabat — not Marrakech or Casablanca. 'RAB-AT': a rabbit at Rabat.","MO ROCCA holding a RABBIT — Rabat, Morocco."],"f":"Rabat is the capital, not Casablanca or Marrakesh; the unfinished Hassan Tower there dates from 1195."},"currency":{"t":"DIRHAM — Morocco and the UAE use the dirham, from the Greek drachma."},"language":{"t":"ARABIC and BERBER — Tamazight (Berber) became official in 2011; French is everywhere."}},"mg":{"flag":{"t":["White vertical at the hoist, then red over green. The only flag that starts with a white bar.","MADAGASCAR: Benin's layout with a WHITE bar at the pole instead of green."],"f":"White and red were the colours of the Merina kingdom; green for the Hova coastal people. Adopted in 1958."},"map":{"t":"The big island off southeast Africa.","f":"Madagascar split from India about 88 million years ago, which is why about 90% of its wildlife, including lemurs, exists nowhere else."},"capital":{"t":["Antananarivo — 'ANT-an-an-a-REEVO': ants arrive in a river of lemurs.","An ANT takes A BANANA down the RIVER — Antananarivo, Madagascar."],"f":"Antananarivo means 'city of the thousand' — for the thousand soldiers who guarded it; locals say 'Tana'."},"currency":{"t":"ARIARY — Madagascar's ariary is one of only two currencies not decimal: 5 iraimbilanja to the ariary."},"language":{"t":"MALAGASY — closer to the languages of Borneo than to Africa; the island was settled from Indonesia."}},"ml":{"flag":{"t":["Green-yellow-red vertical, green at the hoist. Guinea reversed; MaLi = green Left.","MALI: green at the pole — a MALLard's green head first. Guinea is the mirror with red first.","Mali: 'God is number one' — Islamic green comes first. Guinea is red first."],"f":"Mali's flag had a black stick figure (the kanaga) in the centre until 1961; it was removed under religious objections."},"map":{"t":"Landlocked Sahara/Sahel country north of Guinea and Ivory Coast, the Niger bend.","f":"Timbuktu is in Mali; in the 1300s the emperor Mansa Musa was possibly the richest person in history."},"capital":{"t":"Bamako — 'BAM-a-KO': Bam! a KO in Bamako. Timbuktu is up north.","f":"Bamako, on the Niger river, is one of the fastest-growing cities in Africa; the name means 'crocodile river'."},"language":{"t":"FRENCH — official; Bambara is the most spoken."}},"mr":{"flag":{"t":"Green with a yellow crescent and star, and thin red bands top and bottom. Green Islamic flag with red edges.","f":"Two red stripes were added by referendum in 2017 for the blood shed against French colonisation."},"map":{"t":"Sahara Atlantic coast north of Senegal, south of Western Sahara.","f":"Mauritania was the last country to abolish slavery, in 1981; the Richat Structure, the 'Eye of the Sahara', is visible from space."},"capital":{"t":["Nouakchott — 'NEW-AK-SHOT': a new shot in the desert.","MAURA and TANIA take a NEW, AWKWARD SHOT — Nouakchott, Mauritania."],"f":"Nouakchott was a small fishing village chosen as capital in 1958; it's now home to about a third of the population."},"currency":{"t":"OUGUIYA — Mauritania's ouguiya is the other non-decimal currency: 5 khoums make an ouguiya."}},"mu":{"flag":{"t":"Red-blue-yellow-green horizontal, four equal stripes. The only four-colour striped flag: a rainbow island.","f":"One of only two national flags with four horizontal stripes (the other is Central African Republic, with a fifth vertical)."},"map":{"t":"Island east of Madagascar, near Réunion.","f":"The dodo lived only on Mauritius and was extinct within a century of humans arriving."},"capital":{"t":["Port Louis — the French king's port.","MAURA ITCHES; POOR LOUIS — Port Louis, Mauritius."],"f":"Port Louis has the oldest racecourse in the southern hemisphere, the Champ de Mars, from 1812."},"language":{"t":"MAURITIAN CREOLE — French-based; English is official for government and French for the press."}},"mw":{"flag":{"t":"Black-red-green horizontal with a rising red sun on the black. Sunrise over Lake Malawi.","f":"The rising sun stands for the dawn of freedom in Africa; a 2010 redesign with a full white sun was reversed in 2012."},"map":{"t":"A thin landlocked strip along Lake Malawi, between Zambia and Mozambique.","f":"Lake Malawi takes up about a fifth of the country and has more fish species than any other lake."},"capital":{"t":"Lilongwe — 'LEE-LONG-way': it's a long way to Lilongwe.","f":"Lilongwe replaced Zomba as capital in 1975; Blantyre, named after David Livingstone's Scottish birthplace, is the commercial hub."},"currency":{"t":"KWACHA — Malawi and Zambia both use the kwacha, meaning 'dawn'; Zambia's flag has a rising eagle."}},"mz":{"flag":{"t":["Green-black-yellow horizontal with a red hoist triangle holding a star, a book, a hoe and an AK-47. The only flag with a gun.","MOZAMBIQUE: the one with an AK-47."],"f":"The only national flag with a modern firearm on it: an AK-47 crossed with a hoe on an open book."},"map":{"t":"Southeast African coast facing Madagascar.","f":"Mozambique joined the Commonwealth in 1995 despite never having been a British colony — the first such member."},"capital":{"t":"Maputo — 'MA-POO-TOE': Maputo.","f":"Maputo was called Lourenço Marques under the Portuguese; its railway station was designed in the style of Eiffel's era."},"currency":{"t":"METICAL — Mozambique's metical comes from the Arabic 'mithqal', a unit of weight."},"language":{"t":"PORTUGUESE — one of five African countries where Portuguese is official (with Angola, Cape Verde, Guinea-Bissau, São Tomé)."}},"na":{"flag":{"t":"Blue and green split by a red diagonal with white edges, a sun in the corner. Sun in the top-left — the desert.","f":"The sun with 12 rays is on a blue-red-green diagonal; adopted at independence in 1990."},"map":{"t":"Southwest Africa, Namib desert coast, north of South Africa.","f":"The Namib is the oldest desert in the world; the Caprivi Strip was drawn so Germany could reach the Zambezi."},"capital":{"t":["Windhoek — 'WIND HOOK': windy corner.","NAMBY sis holding a WIND HOOK — Windhoek, Namibia."],"f":"Windhoek means 'windy corner'; the city sits at 1,650 m in the centre of the country."}},"ne":{"flag":{"t":["Orange-white-green horizontal with an orange disc. India with a disc instead of a wheel; NIger = disc (like a coin).","NIGER: India's colours with a sun instead of a wheel — Niger is Sahara, so it gets the sun."],"f":"The orange disc is the sun (or the Sahara); the design is similar to India's but with a disc instead of a wheel."},"map":{"t":"Landlocked Sahara north of Nigeria, east of Mali.","f":"Niger is pronounced 'nee-ZHAIR' and is about 80% Sahara; it has one of the highest birth rates in the world."},"capital":{"t":["Niamey — 'NEE-a-MAY': 'kNee, I may' — Niamey on the Niger river.","In a NIGHT shirt, a cop has his KNEE ON ME — Niamey, Niger."],"f":"Niamey sits on the Niger river, from which both Niger and Nigeria take their names."}},"ng":{"flag":{"t":["Green-white-green vertical. Two green bars: Nigeria's green giant.","NIGERIA: green-white-green vertical and nothing else."],"f":"Designed by a student, Taiwo Akinkunmi, in 1959; the original had a red sun in the centre that was dropped."},"map":{"t":"The big West African country on the Gulf of Guinea's corner.","f":"Nigeria is Africa's most populous country, with over 500 languages spoken."},"capital":{"t":["Abuja — not Lagos! 'A BOO-JA': Abuja is the planned capital.","NIGHT CHEERIOS and A 'BUCHA — Abuja, Nigeria."],"f":"Abuja replaced Lagos as capital in 1991, chosen because it's central and ethnically neutral; Lagos remains the largest city in Africa."},"currency":{"t":"NAIRA — Nigeria's naira is a contraction of 'Nigeria'."},"language":{"t":"ENGLISH — official, over Hausa, Yoruba and Igbo; more than 500 languages spoken."}},"rw":{"flag":{"t":"Sky blue (wide) over yellow over green with a golden sun in the top-right. The sun in the corner.","f":"The 2001 redesign dropped the old flag's red and the letter 'R' to move on from the 1994 genocide; the sun stands for enlightenment."},"map":{"t":"Tiny landlocked country north of Burundi, west of Tanzania.","f":"The 'land of a thousand hills'; Rwanda banned plastic bags in 2008 and Kigali is one of Africa's cleanest cities."},"capital":{"t":["Kigali — 'KEY-GAL-ee': a key gal in Kigali.","ROW UNDER the KEY GOALIE — Kigali, Rwanda."],"f":"Kigali holds a nationwide community clean-up, Umuganda, on the last Saturday of every month."},"language":{"t":"KINYARWANDA — with English (since 2008), French and Swahili."}},"sc":{"flag":{"t":"Five coloured rays fanning out from the bottom-left corner. The fan flag.","f":"The five rays fan out from the corner as a young country moving into the future; adopted in 1996."},"map":{"t":"Scattered islands northeast of Madagascar.","f":"The Seychelles' 115 islands are granite outcrops — the only mid-ocean granite islands in the world — and the coco de mer palm grows nowhere else."},"capital":{"t":["Victoria — smallest African capital, on Mahé.","SEA SHELLS playing on a VICTROLA — Victoria, Seychelles."],"f":"Victoria is one of the smallest capitals in the world, with a replica of London's Little Ben clock tower."},"language":{"t":"SEYCHELLOIS CREOLE — French-based creole, official with English and French."}},"sd":{"flag":{"t":["Red-white-black horizontal with a green hoist triangle. Pan-Arab stripes plus a green triangle.","SUDAN: red-white-black with a green triangle at the pole."],"f":"The green triangle stands for Islam and agriculture; the pan-Arab colours replaced a blue-yellow-green flag in 1970."},"map":{"t":"South of Egypt on the Nile, above South Sudan.","f":"Sudan has more pyramids than Egypt — over 200 at Meroë and elsewhere, from the Kushite kingdom."},"capital":{"t":["Khartoum — 'CAR TOMB': where the Blue and White Nile meet.","A SEDAN parks in the CAR TOMB — Khartoum, Sudan."],"f":"Khartoum is where the Blue Nile and White Nile meet; the name may mean 'elephant's trunk', for the shape of the land between them."},"language":{"t":"ARABIC and ENGLISH — Sudan; South Sudan chose English to break with Arabic."}},"sl":{"flag":{"t":["Green-white-blue horizontal. Green mountains, white unity, blue sea — the Lion Mountain.","SIERRA LEONE: green-white-blue — hills, peace, harbour."],"f":"Green for agriculture and mountains, white for justice, blue for the harbour of Freetown, one of the largest natural harbours in the world."},"map":{"t":"West African coast between Guinea and Liberia.","f":"Sierra Leone means 'lion mountains', named by a Portuguese sailor; blood diamonds funded its 1990s civil war."},"capital":{"t":["Freetown — founded for freed slaves.","LEONA's SEA AIR freshener is FREE TO use — Freetown, Sierra Leone."],"f":"Freetown was founded in 1792 for freed slaves from Nova Scotia and Britain; the Cotton Tree in the centre is said to be where they gave thanks."},"currency":{"t":"LEONE — Sierra Leone's currency is the leone: lion."}},"sn":{"flag":{"t":"Green-yellow-red vertical with a green star in the middle. Mali's flag plus a green star.","f":"The green star is for the Islamic faith of most Senegalese; the colours are pan-African."},"map":{"t":"Westernmost mainland Africa, wrapped around The Gambia.","f":"Senegal wraps around The Gambia; Gorée island off Dakar was a slave-trade port and is a UNESCO site."},"capital":{"t":["Dakar — the Dakar Rally.","A ZEN GAL on a DUCK CAR — Dakar, Senegal."],"f":"Dakar is the westernmost city on mainland Africa and was the finish of the Paris–Dakar rally until 2007."},"language":{"t":"FRENCH — official; Wolof is what most people speak."}},"so":{"flag":{"t":["Light blue with a single white star. UN blue — the UN drew the borders.","SOMALIA: one white star on UN blue."],"f":"The star's five points stand for the five regions where Somalis live: Somaliland, Italian Somalia, Djibouti, Ogaden and northern Kenya."},"map":{"t":"The Horn of Africa itself, the pointy bit.","f":"Somalia has the longest coastline in mainland Africa; Somaliland in the north has run itself as a separate state since 1991."},"capital":{"t":["Mogadishu — 'MOGA-DISH-oo': Mogadishu.","A SMILEY face on a MUG O' DISH soup — Mogadishu, Somalia."],"f":"Mogadishu was a rich trading port for a thousand years and once had a cathedral, now in ruins after decades of war."},"language":{"t":"SOMALI — one of the few African countries with one dominant native language; written in Latin script since 1972."}},"ss":{"flag":{"t":["Black-red-green horizontal with white lines, a blue hoist triangle and a yellow star. Kenya's stripes plus Sudan's triangle.","SOUTH SUDAN: Kenya's stripes plus a blue triangle and gold star at the pole."],"f":"Similar to Kenya's and Sudan's but with a blue triangle and gold star; it was the flag of the SPLA independence movement."},"map":{"t":"Landlocked, south of Sudan, north of Uganda.","f":"The world's newest country, independent in 2011; the Sudd is one of the largest wetlands on Earth."},"capital":{"t":["Juba — 'JOO-BA': Juba on the White Nile.","STOP, SEDAN — you can't see past that TUBA — Juba, South Sudan."],"f":"Juba is on the White Nile; the country plans to move its capital to Ramciel in the centre of the country."},"language":{"t":"ENGLISH — chosen at independence in 2011 instead of Arabic."}},"st":{"flag":{"t":["Green-yellow-green horizontal with a red hoist triangle and two black stars. Two stars, two islands.","SÃO TOMÉ & PRÍNCIPE: Ghana's colours with two black stars and a red triangle."],"f":"Two black stars for the two main islands; the colours follow Ghana's pan-African flag."},"map":{"t":"Two small islands in the Gulf of Guinea, off Gabon.","f":"The two islands sit on the equator in the Gulf of Guinea; the country is Africa's second-smallest after Seychelles."},"capital":{"t":"São Tomé — the island and city share the name.","f":"São Tomé city dates from 1485 and was one of the first Portuguese settlements in Africa; cocoa is the main export."},"currency":{"t":"DOBRA — São Tomé's dobra means 'doubloon'."}},"sz":{"flag":{"t":"Blue-yellow-red-yellow-blue with a black-and-white Nguni shield and spears. Shield with a tassel.","f":"The shield, two spears and a fighting stick are Emasotsha regiment weapons; the tassels of feathers are royal."},"map":{"t":"Tiny kingdom on South Africa's eastern edge, next to Mozambique.","f":"Eswatini (Swaziland until 2018) is one of the world's last absolute monarchies; the king renamed it on his 50th birthday."},"capital":{"t":"Mbabane (administrative) — Lobamba is the royal/legislative one; both accepted.","f":"Eswatini has two capitals: Mbabane is administrative, Lobamba is the royal and legislative capital."},"currency":{"t":"LILANGENI — Eswatini's currency; plural is 'emalangeni'."}},"td":{"flag":{"t":["Blue-yellow-red vertical with a darker (indigo) blue than Romania. Chad's blue is deep like the Sahara night.","Chad and Romania are the closest pair of flags on Earth; the only difference is Chad's darker, more indigo blue — invisible on most screens."],"f":"Nearly identical to Romania's — Chad's blue is a slightly darker shade; Chad asked the UN to make Romania change, unsuccessfully."},"map":{"t":"Landlocked Sahara south of Libya, with the shrinking Lake Chad in the west.","f":"Lake Chad has shrunk by about 90% since the 1960s; the country runs from Sahara in the north to savanna in the south."},"capital":{"t":"N'Djamena — 'n-ja-MAY-na': the N' start is Chad's giveaway.","f":"N'Djamena was called Fort-Lamy until 1973; it sits at the meeting of the Chari and Logone rivers."}},"tg":{"flag":{"t":"Five green-and-yellow stripes with a red canton holding a white star. Like Liberia's layout in African colours.","f":"The five stripes stand for the five regions; the design is attributed to painter Paul Ahyi."},"map":{"t":"A thin vertical strip between Ghana and Benin.","f":"Togo is a thin strip, about 50 km wide in places, with 550 km north to south and only 56 km of coast."},"capital":{"t":["Lomé — 'LOW-MAY': low on the coast.","A TOGA made of LAMÉ — Lomé, Togo."],"f":"Lomé is right on the border with Ghana — the border runs along the western edge of the city."}},"tn":{"flag":{"t":["Red with a white disc holding a red crescent and star. Turkey's flag inside a circle.","TUN-isia: Turkey's crescent and star sitting in a TUB — a white circle on red."],"f":"The red disc holds a crescent and star from the Ottoman flag; the design dates to 1831, making it one of the oldest in the Arab world."},"map":{"t":"North Africa's smallest, between Algeria and Libya, pointing at Sicily.","f":"Tunisia has Africa's northernmost point and the ruins of Carthage; the Arab Spring began here in December 2010."},"capital":{"t":["Tunis — Tunisia minus 'ia'.","TUNE-NESIA: what's that TUNE? IS it… — Tunis, Tunisia."],"f":"Tunis's medina is a UNESCO site; the ruins of Carthage are a suburb of the city."}},"tz":{"flag":{"t":"Green and blue split by a black diagonal edged in yellow. Green land, blue sea, black people.","f":"The 1964 union of Tanganyika (green-black-green) and Zanzibar (blue) merged their flags into one diagonal design."},"map":{"t":"East African coast south of Kenya, includes Zanzibar and Kilimanjaro.","f":"Tanzania has Africa's highest peak (Kilimanjaro), largest lake (Victoria) and the Serengeti, plus the island of Zanzibar."},"capital":{"t":["Dodoma — 'DOH-DOH-ma': Dodoma is official; Dar es Salaam is the big one.","TANS A KNEE, YO-YO MA — Dodoma, Tanzania."],"f":"Dodoma has been the official capital since 1974 but the government only fully moved from Dar es Salaam in the 2010s."},"language":{"t":"SWAHILI — Tanzania made Swahili its national language at independence; the word 'safari' is Swahili."}},"ug":{"flag":{"t":["Six stripes of black-yellow-red repeated, with a grey crowned crane in a white disc. The crane flag.","U-GANDA: a grey crane that looks like a GANDER, in a white circle on black-yellow-red."],"f":"The grey crowned crane was the emblem chosen by the British for Uganda; the six stripes are two sets of black-yellow-red."},"map":{"t":"Landlocked on the equator, north shore of Lake Victoria.","f":"The source of the White Nile is at Jinja on Lake Victoria; the equator crosses the country."},"capital":{"t":["Kampala — 'CAMP-ALA': camp on Lake Victoria.","YOU CAN, DAD — CAMP À LA carte — Kampala, Uganda."],"f":"Kampala is built on seven hills like Rome; the name comes from 'impala', from the antelopes that grazed there."}},"za":{"flag":{"t":["A green sideways Y with black, gold, red, white and blue. The six-colour Y — convergence.","SOUTH AFRICA: a green Y on its side.","South Africa is essentially the Dutch 'red, white and blue' with the ANC's black-green-gold Y laid over it."],"f":"The Y-shape shows convergence; adopted in 1994 for the first democratic elections, it was meant to be temporary and stuck."},"map":{"t":"The bottom of Africa.","f":"South Africa has three capitals and completely surrounds Lesotho; it's the only country to have voluntarily dismantled its nuclear weapons."},"capital":{"t":"Pretoria (executive) — Cape Town (legislative) and Bloemfontein (judicial) also count.","f":"Pretoria is the executive capital; Cape Town is legislative and Bloemfontein judicial. Quizzes usually accept Pretoria."},"currency":{"t":"RAND — from the Witwatersrand, the gold ridge Johannesburg sits on."},"language":{"t":"ZULU — the most spoken of 12 official languages (11 plus sign language since 2023); Afrikaans came from Dutch."}},"zm":{"flag":{"t":["Green with a red-black-orange block in the bottom corner and an orange eagle above it. Eagle over the corner blocks.","ZAMBIA: green with an eagle and three stripes tucked in the bottom corner, away from the pole."],"f":"The eagle in flight represents rising above problems; the flag's design is unusually weighted to the fly end."},"map":{"t":"Landlocked, south of DR Congo, Victoria Falls on its southern edge.","f":"Victoria Falls, the largest sheet of falling water in the world, is on the Zambia–Zimbabwe border."},"capital":{"t":["Lusaka — 'LOO-SAKA': Lusaka, not Lilongwe.","A ZOMBIE on the stairs: 'LOSE A SOCK-A' — Lusaka, Zambia."],"f":"Lusaka was chosen as capital in 1935 for its central position and healthy altitude (1,280 m)."},"currency":{"t":"KWACHA — Zambia and Malawi: kwacha means dawn. Zambia's sub-unit is the ngwee."}},"zw":{"flag":{"t":"Seven green-yellow-red-black stripes with a white hoist triangle and the Zimbabwe Bird on a red star. The bird flag.","f":"The Zimbabwe Bird is a soapstone carving from Great Zimbabwe, the medieval stone city the country is named after."},"map":{"t":"Landlocked between Zambia and South Africa; Victoria Falls on the north border.","f":"Zimbabwe was Rhodesia until 1980; Great Zimbabwe is the largest ancient stone structure south of the Sahara."},"capital":{"t":["Harare — 'ha-RAH-ray': hurrah in Harare.","Do laundry the ZUMBA WAY — HURRAH, RAY — Harare, Zimbabwe."],"f":"Harare was named Salisbury until 1982, after Britain's prime minister; the city sits at 1,490 m."},"currency":{"t":"ZIG — Zimbabwe gold, introduced in 2024 after the dollar collapsed twice; the old 100-trillion-dollar note is a collector's item."}},"re":{"flag":{"t":["France's tricolour — it's a French department.","RÉUNION: flies the French tricolour."],"f":"Réunion has no official flag and flies the French tricolour; an unofficial 'volcano' flag shows a radiant sun."},"map":{"t":"Island east of Madagascar next to Mauritius.","f":"Réunion's Piton de la Fournaise is one of the world's most active volcanoes; the island has the record for the most rainfall in 24 hours (1.8 m)."},"capital":{"t":"Saint-Denis.","f":"Saint-Denis is the largest city in any French overseas region."}},"yt":{"flag":{"t":["France's tricolour.","MAYOTTE: flies the French tricolour."],"f":"Mayotte uses the French flag; its local emblem shows two seahorses and a crescent."},"map":{"t":"Island in the Comoros group, kept by France.","f":"Mayotte voted to stay French in 1974 when the other Comoros islands chose independence; it became a full French department in 2011."},"capital":{"t":"Mamoudzou.","f":"Mamoudzou is on the main island, Grande-Terre; the older capital Dzaoudzi is on the tiny Petite-Terre."}},"sh":{"flag":{"t":"British Blue Ensign with a shield showing a ship and a bird. Napoleon's exile island.","f":"The British Blue Ensign with a shield showing a three-masted ship and a wirebird, the island's endemic plover."},"map":{"t":"Remote island in the South Atlantic between Africa and Brazil.","f":"St Helena is where Napoleon was exiled until his death in 1821; it got its first airport only in 2016."},"capital":{"t":"Jamestown.","f":"Jamestown is squeezed into a narrow valley; Jacob's Ladder, a 699-step staircase, climbs out of it."}},"ag":{"flag":{"t":"Red with an inverted triangle holding a rising sun over blue and white bands. Sunrise in a V.","f":"The rising sun in a V for Victory; the flag was designed by a schoolteacher in a 1966 competition."},"map":{"t":"Two islands in the northeast Caribbean, east of St Kitts.","f":"Antigua claims 365 beaches, 'one for every day of the year'; Barbuda's lagoon has one of the largest frigatebird colonies."},"capital":{"t":"St John's — (Canada's St John's is Newfoundland; this one's Antigua).","f":"St John's is a cruise port; the country hosted Test cricket and produced Viv Richards."}},"ai":{"flag":{"t":["British Blue Ensign with three orange dolphins in a circle. Three dolphins.","ANGUILLA is Latin for eel, but the flag shows three orange dolphins in a ring."],"f":"The three dolphins in a circle stand for endurance, unity and strength; on a British Blue Ensign."},"map":{"t":"Tiny island north of St Martin in the Leewards.","f":"Anguilla rebelled in 1967 to leave a federation with St Kitts and Nevis and stay British — Britain sent troops (and police) to a welcoming crowd."},"capital":{"t":"The Valley.","f":"The Valley is one of the few capitals with no real town centre; it's a scattering of buildings along a road."}},"aw":{"flag":{"t":"Light blue with two thin yellow stripes and a red four-point star in the corner. Star in a blue sky.","f":"The four-pointed star stands for the four languages spoken and the four points of the compass; the two yellow stripes for tourism and gold."},"map":{"t":"Just off Venezuela's coast, the westernmost of the ABC islands.","f":"Aruba is just 27 km off Venezuela and sits outside the hurricane belt; it left the Netherlands Antilles in 1986."},"capital":{"t":"Oranjestad — Orange town (Dutch royal house).","f":"Oranjestad's colourful Dutch-style buildings honour the House of Orange; the local language is Papiamento."},"currency":{"t":"FLORIN — Aruba kept the old Dutch florin name; Aruba is Dutch."},"language":{"t":"PAPIAMENTO — a creole of Portuguese, Spanish and Dutch, spoken on Aruba, Curaçao and Bonaire."}},"bb":{"flag":{"t":["Blue-yellow-blue vertical with a black trident head. Neptune's broken trident.","BARBADOS: a black trident on blue-gold-blue."],"f":"The broken trident shows the break from Britain in 1966 — the whole trident was on the colonial badge."},"map":{"t":"The easternmost Caribbean island, off on its own.","f":"Barbados is the easternmost Caribbean island, sitting alone out in the Atlantic; it became a republic in 2021."},"capital":{"t":["Bridgetown — a bridge over the careenage.","Two BARs on opposite sides of the bay; take the BRIDGE TO get between them — Bridgetown."],"f":"Bridgetown has a statue of Nelson older than the one in London's Trafalgar Square (it was removed in 2020)."}},"bm":{"flag":{"t":["British Red Ensign with a shield of a shipwreck. Red ensign (most British territories use blue).","BERMUDA: a RED Ensign — nearly every other British territory flies blue."],"f":"One of the few British territories using the Red Ensign; the badge shows the 1609 wreck of the Sea Venture, which founded the colony."},"map":{"t":"Alone in the Atlantic off the US east coast — not in the Caribbean.","f":"Bermuda is not in the Caribbean — it's off North Carolina, and its shipwreck of 1609 inspired Shakespeare's The Tempest."},"capital":{"t":"Hamilton.","f":"Hamilton is famously tiny, with about 1,000 residents, and is the origin of Bermuda shorts as business wear."}},"bs":{"flag":{"t":["Aquamarine-yellow-aquamarine horizontal with a black hoist triangle. Sea, sand, sea.","BAHAMAS: aquamarine-gold-aquamarine with a black triangle at the pole."],"f":"Black for the strength of the people, aquamarine for the sea, gold for the sand; adopted 1973."},"map":{"t":"The island chain southeast of Florida.","f":"The Bahamas has about 700 islands and is where Columbus first landed in 1492; its 'swimming pigs' live on Big Major Cay."},"capital":{"t":["Nassau — 'NASS-aw': Nassau in the Bahamas.","BAH humbug! NO SANTA — Nassau."],"f":"Nassau's Fort Charlotte has never fired a shot in anger; the city was a pirate republic in the early 1700s under Blackbeard."}},"bz":{"flag":{"t":"Blue with thin red edges and a large white disc with a coat of arms — two woodcutters. The only flag with people on it.","f":"The only national flag with human figures — two woodcutters, one with an axe, one with a paddle — and the most colours (12) of any flag."},"map":{"t":"Central America's Caribbean coast below Mexico's Yucatán, east of Guatemala.","f":"Belize was British Honduras until 1973 and is the only English-speaking country in Central America; it has the second-largest barrier reef in the world."},"capital":{"t":["Belmopan — 'BELL-MO-PAN': planned capital after a hurricane hit Belize City.","Can you BELIEVE they sell an ELMO PAN? — Belmopan."],"f":"Belmopan was built after Hurricane Hattie flattened Belize City in 1961; it's one of the smallest capitals in the world."},"language":{"t":"ENGLISH — the only English-speaking country in Central America, a British colony until 1981."}},"ca":{"flag":{"t":["Red-white-red vertical with a red maple leaf. The maple leaf.","CANADA: a red maple leaf between two red bars."],"f":"The maple leaf has 11 points for no particular reason — it just looked best in wind-tunnel tests. Adopted 1965."},"map":{"t":"The top half of North America.","f":"Canada has the longest coastline in the world and more lakes than every other country combined."},"capital":{"t":["Ottawa — not Toronto! 'OTT-a-WA': oats are cheap in Ottawa.","Drive an AUTO to CANADA — Ottawa."],"f":"Ottawa was chosen by Queen Victoria in 1857 as a compromise between Montreal and Toronto; the Rideau Canal becomes the world's largest skating rink in winter."},"language":{"t":"ENGLISH and FRENCH — Quebec is French-speaking; everything federal is bilingual."}},"cr":{"flag":{"t":["Blue-white-red-white-blue horizontal, wide red centre. Thailand's inverse (Thailand is blue in the middle).","COSTA RICA: the RED band is the thick one. Thailand's thick band is blue."],"f":"Red was added to the blue-white-blue of Central America in 1848, inspired by the French tricolour."},"map":{"t":"Central America between Nicaragua and Panama.","f":"Costa Rica abolished its army in 1948 and produces almost all its electricity from renewables."},"capital":{"t":["San José — Costa Rica's San José (also a Californian city).","The COAST is so RICH they have a SUN HOSE for cloudy days — San José, Costa Rica."],"f":"San José's National Theatre was funded by a tax on coffee exports in the 1890s."},"currency":{"t":"COLÓN — Costa Rica and El Salvador (formerly) named theirs after Columbus (Colón in Spanish)."}},"cu":{"flag":{"t":["Blue and white stripes with a red hoist triangle and white star. Puerto Rico is the same with colours swapped: Cuba = blue stripes, red triangle.","CUBA: blue stripes, red triangle. Puerto Rico swaps them — 'Cuba's cool (blue), Puerto Rico's hot (red).'"],"f":"The three blue stripes are the three provinces of 1849; the red triangle is from Masonic symbolism. Puerto Rico's flag swaps the colours."},"map":{"t":"The long island at the top of the Caribbean, south of Florida.","f":"Cuba is the largest Caribbean island; the US has held a naval base at Guantánamo Bay since 1903 under a lease Cuba refuses to cash."},"capital":{"t":["Havana — Havana cigars.","Here's a Rubik's CUBE — HAVE AT IT — Havana."],"f":"Havana's classic 1950s American cars are still running because imports were cut off by the US embargo after 1960."},"currency":{"t":"PESO — Cuba's peso; the convertible peso for tourists was scrapped in 2021."}},"cw":{"flag":{"t":"Blue with a thin yellow stripe below the middle and two white stars in the corner. Two stars = Curaçao and Klein Curaçao.","f":"The two stars are Curaçao and Klein Curaçao; the blue is the sky above and the sea below the yellow stripe."},"map":{"t":"Middle of the ABC islands off Venezuela.","f":"Curaçao, off Venezuela, is the 'C' of the ABC islands with Aruba and Bonaire; the blue liqueur is named after it."},"capital":{"t":"Willemstad — William's town.","f":"Willemstad's pastel Dutch waterfront is a UNESCO site; its Queen Emma bridge floats on pontoons and swings open for ships."},"language":{"t":"PAPIAMENTO — with Dutch and English; the ABC islands' creole."}},"dm":{"flag":{"t":"Green with a cross of yellow, black and white stripes and a sisserou parrot in a red disc. The parrot flag (the only purple on a national flag).","f":"The only national flag with purple on it — the sisserou parrot, found only on Dominica."},"map":{"t":"In the Windwards between Guadeloupe and Martinique.","f":"Dominica (pronounced dom-in-EE-ka) is the 'Nature Island', with a boiling lake and 365 rivers; it's not the Dominican Republic."},"capital":{"t":"Roseau — 'ROSE-oh'.","f":"Roseau is named after the reeds ('roseaux') that grew there; the island was fought over by Britain and France for a century."}},"do":{"flag":{"t":"Blue and red quarters divided by a white cross with
