<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bearings</title>
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Bearings">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F4F1EA; --bg2:#ECE8DF; --line:rgba(24,22,19,.14); --rule:#181613;
  --ink:#181613; --ink2:#7B766D; --acc:#D2471F; --acc2:#2E5E8C; --ok:#2C7A47; --no:#D2471F;
  --sea:#E6E2D8; --land:#C2BBAC; --hit:#E3A21B;
  --serif:'Iowan Old Style','Charter','Palatino','Palatino Linotype','Book Antiqua',Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161513;--bg2:#1F1D1A;--line:rgba(240,236,228,.16);--rule:#F0ECE4;--ink:#F0ECE4;--ink2:#9A948A;--acc:#F0653A;--acc2:#8DB3DC;--ok:#69BE87;--no:#F0653A;--sea:#1C1B18;--land:#4B4740;--hit:#E3A21B}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:var(--ink)}
a{color:inherit}
.app{max-width:520px;margin:0 auto;padding:12px 20px 56px}
h1,h2{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em}
h1{font-size:36px;line-height:.95}
h2{font-size:24px;line-height:1.1}
.muted{color:var(--ink2)}
.k,.sec,.prompt,.topbar,.back,.mem .lbl,.count .l,.chip,details.data summary,.stage,.item .sub,.hint,.rounds{font-family:var(--mono)}

/* ruler divider: hairline with ticks every 8px, taller every 40px */
.rule{border:0;height:8px;margin:14px 0 12px;background:
  linear-gradient(var(--ink),var(--ink)) 0 0/100% 1px no-repeat,
  repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 8px) 0 0/100% 4px no-repeat,
  repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 40px) 0 0/100% 8px no-repeat}
.rule.soft{opacity:.35}

/* masthead */
.brand{display:flex;align-items:baseline;gap:10px;margin:8px 0 0}
.brand h1{font-size:38px;letter-spacing:-.02em}
.brand .mark{display:none}
.streak{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.streak b{color:var(--acc);font-weight:500}
.tag{display:none}
.welcome{display:flex;gap:12px;align-items:flex-start;font-family:var(--serif);font-size:17px;line-height:1.3;margin:2px 0 0;color:var(--ink)}
.welcome b{font-style:italic;font-weight:400}
.welcome ol{margin:0;padding:0;list-style:none}.welcome li+li{margin-top:4px}
.welcome .small{flex:none;font-size:20px;line-height:1;padding:0 4px;background:none;border:0;color:var(--ink2);font-family:var(--sans)}

/* sections + toggles */
.sec{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);margin:18px 0 4px}
.chips{display:flex;gap:0 16px;flex-wrap:wrap;margin:0}
.chip{padding:6px 0;color:var(--ink2);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid transparent;border-radius:0}
.chip.on{color:var(--ink);border-bottom-color:var(--ink)}
.chip .cnt{color:var(--ink2);margin-left:4px}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* counts */
.counts{display:flex;gap:26px;margin:18px 0 16px;align-items:flex-end}
.count{padding:0;background:none;border:0}
.count .n{font-family:var(--serif);font-size:42px;line-height:.9;letter-spacing:-.02em}
.count .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
.count.acc .n{color:var(--acc)}

.btn{display:block;width:100%;padding:14px 16px;border-radius:2px;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.btn.quiet{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.3;cursor:default}
.btn+.btn{margin-top:8px}
.hint{font-size:11px;letter-spacing:.02em;color:var(--ink2);margin:10px 0 0;line-height:1.5}

/* rows */
.games{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.game{display:flex;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;min-height:0;background:none;border-radius:0;flex-direction:row}
.game b{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1;letter-spacing:-.01em}
.game span{font-family:var(--mono);font-size:11px;color:var(--ink2);display:block;margin-top:5px;letter-spacing:.02em}
.game .arw{margin-left:auto;font-family:var(--mono);color:var(--ink2);font-size:14px}
.game.daily b{color:var(--acc);font-style:italic}
.game:disabled{opacity:.3}
.panel{background:none;border:0;padding:0}
details.data summary{cursor:pointer;color:var(--ink2);font-size:10px;letter-spacing:.18em;text-transform:uppercase;list-style:none}details.data summary::-webkit-details-marker{display:none}

/* session */
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.topbar a{color:var(--ink);text-decoration:none}
.bar{height:1px;background:var(--line);overflow:hidden;margin:10px 0 22px}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
.rdots{display:flex;gap:5px;margin:-12px 0 16px;flex-wrap:wrap}.rdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.rdots i.ok{background:var(--ok)}.rdots i.mid{background:var(--hit)}.rdots i.no{background:var(--no)}
.done .rdots{justify-content:center;margin:12px 0 16px}
.flagbox{background:none;border:0;border-radius:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.flag{width:min(300px,84vw);aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;border-radius:0;overflow:hidden;background:var(--bg2);outline:1px solid var(--line);outline-offset:-1px}
.flag img{width:100%;height:100%;object-fit:cover;display:block}
.capcard{text-align:center;padding:30px 10px 6px}
.capcard .prompt{margin:0 0 10px}
.map{width:100%;aspect-ratio:3/2;display:block;border-radius:0;background:var(--sea);margin-top:6px;outline:1px solid var(--line);outline-offset:-1px}
.flagbox .map,.flagbox .pinwrap{width:100%;margin:6px 0 0}
.tapmap{touch-action:none;user-select:none}.tapmap path.tap{fill:var(--land)}.tapmap.live path.tap{cursor:pointer}@media(hover:hover){.tapmap.live path.tap:hover{fill:#A8A08F}}.tapmap path.hit{fill:var(--hit)}.tapmap path.miss{fill:var(--no)}
.tapmap circle.tapring{fill:rgba(210,71,31,.10);stroke:rgba(210,71,31,.7);pointer-events:none}.tapmap circle.hit{stroke:var(--hit);fill:rgba(227,162,27,.55)}.tapmap circle.miss{stroke:var(--no);fill:rgba(210,71,31,.5)}
.choices.flags .choice{padding:8px}.choices.flags .choice::before{display:none}.flag.opt{width:100%;outline:none;background:transparent}.flag.opt .emo{font-size:56px}
.pinwrap{position:relative;width:100%;touch-action:none;overscroll-behavior:contain}.pinmap,.tapmap{touch-action:none;aspect-ratio:5/4;}.pinmap.wide,.tapmap.wide{aspect-ratio:5/3}.pinmap,.tapmap{user-select:none;border-radius:0;outline:1px solid var(--line);outline-offset:-1px}.pinmap{cursor:crosshair}
.zoomctl{position:absolute;right:8px;top:14px;display:flex;flex-direction:column;gap:6px}.zb{width:34px;height:34px;border-radius:2px;background:var(--bg);color:var(--ink);font-size:18px;border:1px solid var(--rule);font-family:var(--mono)}
.rounds{margin:16px auto 6px;max-width:340px;text-align:left;font-size:12px}.rounds div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.rounds div span:first-child{flex:1;font-family:var(--sans);font-size:15px}.rounds div b{min-width:52px;text-align:right;font-weight:500}
.flag.sm{width:min(180px,50vw)}
.flag .emo{font-size:120px;line-height:1}
.prompt{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);margin-top:8px}
.answer{font-family:var(--serif);font-size:34px;text-align:center;line-height:1;letter-spacing:-.015em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;counter-reset:opt}
.choice{position:relative;padding:22px 12px 14px;border-radius:2px;background:none;border:1px solid var(--rule);font-size:16px;text-align:center;line-height:1.2;min-height:70px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.choice::before{counter-increment:opt;content:counter(opt,decimal-leading-zero);position:absolute;top:6px;left:8px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink2)}
.choice.right{background:var(--ok);border-color:var(--ok);color:#fff}.choice.right::before{color:rgba(255,255,255,.7)}
.choice.wrong{background:var(--no);border-color:var(--no);color:#fff}.choice.wrong::before{color:rgba(255,255,255,.7)}
.choice:disabled{cursor:default}.choice:disabled:not(.right):not(.wrong){opacity:.35}
.type{margin-top:18px;display:flex;gap:10px;align-items:flex-end}
.type input{flex:1;padding:10px 0;border-radius:0;background:none;border:0;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:28px}
.type input::placeholder{color:var(--ink2);opacity:.6}
.type input.right{border-color:var(--ok)} .type input.wrong{border-color:var(--no)}
.dk{display:block;margin:12px auto 0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-decoration:underline;text-underline-offset:4px;padding:8px}
.verdict{margin-top:18px;font-family:var(--serif);font-size:28px;text-align:center;line-height:1.1}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.actbar{position:sticky;bottom:0;margin:18px -4px 0;padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.actbar .btn+.btn{margin-top:8px}

/* mem */
.mem{margin-top:16px;background:none;border:0;border-top:1px solid var(--rule);border-radius:0;padding:10px 0 2px}
.mem .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px;display:flex;align-items:baseline}
.mem .lbl::before{content:'';display:inline-block;width:7px;height:7px;background:var(--acc);margin-right:8px;align-self:center}
.mem.lib .lbl::before{background:var(--acc2)}
.mem.empty .lbl::before{background:var(--line)}
.mem .editlink{margin-left:auto;font-size:10px;letter-spacing:.06em;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-transform:none}
.memedit{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.mem p{margin:0;font-family:var(--serif);font-size:18px;line-height:1.3}
.mem img{max-width:100%;margin-top:10px;display:block}
.mem p+p{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.mem .fact{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-family:var(--sans);font-size:14px;line-height:1.45;color:var(--ink2)}
.mem .factlbl{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);margin-right:8px}
.memedit textarea{width:100%;min-height:84px;padding:10px 0;border-radius:0;background:none;border:0;border-bottom:1px solid var(--line);resize:vertical;font-size:16px;line-height:1.4}
.memedit .row{margin-top:10px}
.memedit label{display:block;margin:8px 0 2px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.small{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;border-radius:2px;background:none;color:var(--ink);border:1px solid var(--rule)}
.small.gold{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filepick{position:relative;overflow:hidden}
.filepick input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* level rings */
.ring{width:18px;height:18px;flex:none}
.stage{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);letter-spacing:.02em}
.dots{display:flex;gap:3px}

/* library */
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.item{display:flex;gap:12px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;text-align:left;width:100%}
.item .mini{width:40px;height:27px;overflow:hidden;flex:none;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:20px;outline:1px solid var(--line);outline-offset:-1px}
.item .mini img{width:100%;height:100%;object-fit:cover}
.item .nm{font-family:var(--serif);font-size:18px;line-height:1.1}
.item .sub{font-size:10px;color:var(--ink2);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.search{width:100%;padding:8px 0;border-radius:0;background:none;border:0;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:24px;margin:0 0 6px}
.search::placeholder{color:var(--ink2);opacity:.7}
.back{color:var(--ink2);font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:6px 0;margin-bottom:8px;display:inline-block;text-decoration:none}
.done{text-align:center;padding:44px 0 16px}
.done h1{margin-bottom:10px;font-size:56px;letter-spacing:-.03em}
.done .muted{font-family:var(--serif);font-size:19px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:2px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.install{display:flex;gap:12px;align-items:center;border:1px solid var(--rule);padding:10px 12px;margin:0 0 6px;font-size:13px;line-height:1.4}
.install b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:2px}
.install .x{margin-left:auto;font-size:18px;color:var(--ink2);padding:0 4px}

/* satellite */
.map.sat path{fill:rgba(255,255,255,.04)!important;stroke:rgba(255,255,255,.55)!important}
.map.sat path.hit{fill:rgba(224,165,39,.55)!important}
.map.sat path.halo{stroke:#fff!important;fill:none!important}.map.sat path.target{fill:rgba(224,165,39,.45)!important;stroke:var(--hit)!important}
.map path.halo{fill:none}.map.sat path.miss{fill:rgba(210,71,31,.55)!important}
.tapmap.sat path.tap{pointer-events:all}
.map.sat rect{fill:#0b1a2a}
.zb.on{background:var(--ink);color:var(--bg)}
.pinwrap.static{touch-action:auto}.pinwrap.static .zoomctl{top:auto;bottom:10px;right:8px}.pinwrap.static .zb{width:28px;height:28px;font-size:14px;opacity:.85}
.wl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);text-decoration:none}
/* fullscreen map questions */
.mapscreen{position:fixed;inset:0;z-index:20;background:var(--bg)}
.mapscreen .pinwrap{position:absolute;inset:0;width:100%;margin:0}
.mapscreen .pinmap,.mapscreen .tapmap{width:100%;height:100%;aspect-ratio:auto;border-radius:0;outline:none}
.mapscreen .zoomctl{top:auto;bottom:calc(96px + env(safe-area-inset-bottom));right:10px}
.mapscreen .ov{position:absolute;left:0;right:0;padding:10px 16px;pointer-events:none}
.mapscreen .ov > *{pointer-events:auto}
.mapscreen .ov.top{top:0;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(var(--bg) 55%,rgba(0,0,0,0))}
.mapscreen .ov.top .answer{font-size:26px;text-align:left;line-height:1.05}.mapscreen .ov.top .prompt{margin-top:6px}
.mapscreen .ov.bottom{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),var(--bg) 60%)}
.mapscreen .topbar{margin-bottom:8px}
.flag.thumb{width:72px;flex:none;box-shadow:none}
.flag.thumb .emo{font-size:36px}
/* collections */
.tabs{gap:0 14px;margin:0 0 4px}.tabs .chip{font-size:13px;letter-spacing:.02em;text-transform:none;font-family:var(--serif);font-size:19px;padding:4px 0}
.shape{width:min(220px,58vw);aspect-ratio:1;display:block}.shape.sm{width:56px}.shaperow{display:flex;justify-content:center;margin:-2px 0}
.choices.shapes .choice{padding:10px}.shape.opt{width:100%;max-width:120px;margin:0 auto}.shape.opt path{fill:var(--ink)}
.mini.dot{display:flex;align-items:center;justify-content:center}.mini.dot i{width:10px;height:10px;border-radius:50%;background:var(--acc);display:block}
.shape.mini{width:40px;height:27px;flex:none;padding:2px}
.photo{background:var(--bg2);outline:1px solid var(--line);outline-offset:-1px}.photo .ph{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}.photo img{width:100%;height:100%;object-fit:cover}.photo.nophoto .ph::after{content:'photo needs a connection';display:block;margin-top:6px;opacity:.6;letter-spacing:.06em;font-size:9px}
.tapmap .ctx path{fill:var(--land);opacity:.45;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

orra's flag is almost identical to Moldova's and Romania's; only the coat of arms tells it apart. The motto on the arms is 'Virtus Unita Fortior' — strength united is stronger."},"map":{"t":"A speck in the Pyrenees, pinched between Spain and France.","f":"Andorra has two heads of state at once: the President of France and the Bishop of Urgell in Spain, a deal dating from 1278."},"capital":{"t":["Andorra la Vella — 'la Vella' is 'the old one': the old town in the valley.","A valley girl finds an ANT DOOR that leads to THE VALLEY — Andorra la Vella."],"f":"Andorra la Vella is the highest capital in Europe, at about 1,000 m."},"currency":{"t":"EURO — Andorra never had its own currency: pesetas and francs, then the euro."},"language":{"t":"CATALAN — Andorra is the only country where Catalan is the sole official language."}},"al":{"flag":{"t":["Red with a black two-headed eagle. ALbania → the eagle looks ALl ways at once.","ALL-BAN-ia: everything BANNED except one black two-headed eagle on ALL red."],"f":"The double-headed eagle comes from the seal of Skanderbeg, the 15th-century hero who held off the Ottomans for 25 years."},"map":{"t":"Adriatic coast facing the heel of Italy, above Greece.","f":"Under communism Albania built an estimated 170,000 concrete bunkers — you still trip over them on beaches and hillsides."},"capital":{"t":["Tirana — Albanians call themselves 'sons of the eagle'; picture a TIRAnt eagle ruling Tirana.","A TYRANNOSAURUS that turned vegan and went all bony — Tirana."],"f":"Tirana's mayor in the 2000s, Edi Rama, fought urban decay by painting the grey communist blocks in wild colours."},"currency":{"t":"LEK — Albania's lek: 'let's go to Albania for a LEK-ture'."},"language":{"t":"ALBANIAN — an Indo-European language on its own branch, unrelated to its neighbours."}},"at":{"flag":{"t":["Red-white-red horizontal, no emblem. Legend: a duke's white tunic soaked red except under his belt.","AUS-TRI-a: TRI stripes — a red-white-red sandwich."],"f":"One of the oldest flag designs in the world, traced to a 1230 seal of Duke Frederick II of Austria."},"map":{"t":"Landlocked, hugging the Alps south of Germany and Czech Republic.","f":"Austria was once the heart of an empire covering much of central Europe; today it's a neutral country by a 1955 law."},"capital":{"t":["Vienna — Viennese waltz, Vienna sausages: Austria's grand old capital.","A street littered with VIENNA sausages — Austria, Vienna."],"f":"Vienna has topped 'most liveable city' rankings repeatedly, and its coffee-house culture is on UNESCO's heritage list."}},"ba":{"flag":{"t":["Blue with a yellow triangle and a diagonal row of white stars. Triangle = the country's roughly triangular shape.","BOS-nia: the BOSS wears a yellow triangle badge on a blue suit, with white star buttons."],"f":"Adopted in 1998 by a UN high representative because the ethnic groups couldn't agree; the colours are deliberately EU-like and neutral."},"map":{"t":"Triangle wedged inside Croatia's crescent, with a tiny sliver of Adriatic coast.","f":"Bosnia's whole coastline is about 20 km at Neum — Croatia is split in two by it, so Croatia built a bridge to bypass it."},"capital":{"t":"Sarajevo — 'Sara, yes? No.' Where WWI began, 1914.","f":"Sarajevo hosted the 1984 Winter Olympics and, eight years later, endured the longest siege of a capital in modern history — 1,425 days."},"currency":{"t":"CONVERTIBLE MARK — Bosnia's mark was pegged to the German mark in 1998; still called KM."}},"be":{"flag":{"t":["Black-yellow-red vertical. BEEs are black and yellow — BElgium.","BELG-ium: Germany's flag stood up on END, black bar up against the pole."],"f":"The colours come from the arms of the Duchy of Brabant: a gold lion with red claws on black."},"map":{"t":"Between France and the Netherlands, facing the Channel.","f":"Belgium's border with the Netherlands at Baarle is so tangled that some houses have the border running through them; your nationality depends on where the front door is."},"capital":{"t":["Brussels sprouts — Belgian capital, EU headquarters.","BELCH him! He's choking on a BRUSSELS sprout."],"f":"Brussels is officially bilingual — every street sign is in French and Dutch."},"language":{"t":"DUTCH, FRENCH, GERMAN — Flemish (Dutch) in the north, French in the south, a little German in the east; Brussels is officially both."}},"bg":{"flag":{"t":["White-green-red horizontal. Like Italy's tricolour laid on its side, minus the blue of Russia's.","BUL-garia: the Russian flag with BULLs grazing — the middle stripe has gone green."],"f":"The green stripe replaced the blue of the Russian pan-Slavic tricolour to stand for Bulgaria's farmland."},"map":{"t":"Black Sea coast, north of Greece and Turkey, south of Romania.","f":"Bulgaria's Rose Valley produces most of the world's rose oil, used in nearly every luxury perfume."},"capital":{"t":"Sofia — a SOFt, wise capital (Sophia = wisdom).","f":"Sofia's motto is 'grows but does not age'; the city sits at the foot of Vitosha mountain, with ski slopes a tram ride away."},"currency":{"t":"EURO — Bulgaria's lev (lion) gave way to the euro in 2026, the 21st member."}},"by":{"flag":{"t":["Red over green with a red-and-white embroidery strip up the hoist. The only flag with a decorative ribbon edge.","BELA-rus: RUSsian red on top, green lawn below, and a BELt of red embroidery up the pole."],"f":"The embroidery pattern on the hoist is from a real 1917 towel design by a peasant woman, Matrona Markevich."},"map":{"t":"Landlocked, sits directly east of Poland, under the Baltics, west of Russia.","f":"Belarus still uses the Soviet-era name Belovezhskaya forest, home to Europe's last wild bison herd."},"capital":{"t":"Minsk — Belarus is often mixed up with Russia; Minsk sounds like a mini Moscow.","f":"Minsk was so thoroughly destroyed in WWII that it was rebuilt from scratch as a Stalinist showpiece city."},"language":{"t":"BELARUSIAN — official, but most people speak Russian day to day."}},"ch":{"flag":{"t":["Red square with a white cross — the Red Cross is this inverted. The only square national flag besides Vatican.","SWISS: a fat white PLUS sign on red, square as a cube of Swiss cheese."],"f":"The Red Cross emblem is the Swiss flag with colours reversed, in honour of founder Henry Dunant's home country."},"map":{"t":"Landlocked Alpine square between France, Germany, Austria and Italy.","f":"Switzerland has four official languages: German, French, Italian and Romansh."},"capital":{"t":["Bern — a BEAR is on Bern's coat of arms; Zurich is bigger but not the capital.","A controlled BURN in SWISS cheese land — Bern, Switzerland."],"f":"Switzerland has no official capital in law; Bern is the 'federal city' and the answer quizzes want."},"currency":{"t":"FRANC — Switzerland and Liechtenstein kept the franc after France gave it up for the euro."},"language":{"t":"GERMAN, FRENCH, ITALIAN, ROMANSH — four languages; Romansh is spoken by about 60,000 people."}},"cy":{"flag":{"t":["White with a copper-coloured map of the island above two olive branches. Copper — Cyprus gave copper its name.","CY-prus → Cu, copper: a copper-coloured island on white. Copper is named after Cyprus."],"f":"The flag deliberately avoids blue and red (Greece and Turkey's colours) and shows the island in copper, since the metal's name comes from Cyprus."},"map":{"t":"Island in the far east of the Mediterranean, below Turkey.","f":"Cyprus has been divided since 1974, with a UN buffer zone running right across the island."},"capital":{"t":["Nicosia — the last divided capital in Europe; NIck's Cypriot house is split down the middle.","A CYPRESS tree growing NICKEL COSIES — Nicosia."],"f":"Nicosia is the last divided capital in the world; you cross a checkpoint on Ledra Street to reach the other half."},"language":{"t":"GREEK and TURKISH — Greek in the south, Turkish in the north since the 1974 division."}},"cz":{"flag":{"t":["White over red with a blue triangle at the hoist. The blue wedge is what separates it from Poland.","CZECH: a blue CHECK-mark wedge from the pole over white-and-red."],"f":"The blue triangle was added in 1920 because the plain white-over-red was identical to Poland's."},"map":{"t":"Landlocked, tucked between Germany and Poland, above Austria.","f":"The Czech Republic asked to be called 'Czechia' in 2016; it's the more beer-drinking country per head in the world."},"capital":{"t":["Prague — Prague Castle, Czech capital.","A CHECK mark on the test — PRAGUE? Prego! — Czechia."],"f":"Prague's astronomical clock has run since 1410 — the oldest still working."},"currency":{"t":"KORUNA — 'crown' in Czech; Czechia kept it instead of the euro."}},"de":{"flag":{"t":["Black-red-gold horizontal. Germany = black top ('dark beer on top').","GER-MAN: a German traffic light after dark — black, red, gold, top to bottom."],"f":"Black, red and gold came from the uniforms of the Lützow Free Corps in the Napoleonic wars: black coats, red facings, gold buttons."},"map":{"t":"Central Europe's heavyweight, north of the Alps, coast on the North and Baltic seas.","f":"Germany borders nine countries — more than any other in Europe."},"capital":{"t":["Berlin — the Berlin Wall.","GERMS? BURN the LINENS — Berlin."],"f":"Bonn was West Germany's capital until 1990; Berlin's Reichstag got its glass dome in 1999."},"currency":{"t":"EURO — Germany gave up the Deutsche Mark in 2002; the European Central Bank sits in Frankfurt."}},"dk":{"flag":{"t":["Red with a white off-centre Nordic cross — the original Nordic cross, the oldest flag still in use.","DEN-MARK: take a red flag and MARK it with a white cross.","Nordic family: Denmark is the plain one, red with a white cross and nothing else; Sweden is blue with yellow; Finland white with blue; Norway and Iceland have two-colour crosses."],"f":"Legend says the Dannebrog fell from the sky during a 1219 battle in Estonia — the oldest continuously used national flag."},"map":{"t":"The peninsula poking up from Germany plus islands, the bridge to Scandinavia.","f":"Greenland and the Faroes are Danish, so the Kingdom of Denmark is the 12th largest in the world by area."},"capital":{"t":"Copenhagen — the Little Mermaid sits in Copenhagen harbour.","f":"Copenhagen has more bicycles than people, and the Little Mermaid statue has been beheaded twice by vandals."},"currency":{"t":"KRONE — Denmark and Norway spell it krone; Sweden and Iceland spell it krona/króna. All mean crown."}},"ee":{"flag":{"t":["Blue-black-white horizontal. Sky, dark soil, snow — Estonia's winter from the top down.","ES-TONE-ia: three flat tones — blue, black, white.","Estonia: blue sky, black earth, white snow — top to bottom."],"f":"The blue-black-white was first raised by a student society in 1884 and banned under the Soviets."},"map":{"t":"Top of the three Baltics, directly across the gulf from Finland.","f":"Estonia has over 2,000 islands and is closer culturally to Finland than to its Baltic neighbours — the languages are related."},"capital":{"t":["Tallinn — TALL INN: the tall medieval towers of Tallinn.","A tombSTONE with a TALL N on top — Tallinn, Estonia."],"f":"Tallinn's old town is one of the best-preserved medieval cities in Europe, and Estonia is where Skype was built."},"language":{"t":"ESTONIAN — a Finnic language, closer to Finnish than to Latvian next door."}},"es":{"flag":{"t":["Red-yellow-red horizontal with a wide yellow middle and a crest toward the hoist. Red-yellow-red like a Spanish omelette in bread.","SPAIN: a Spanish omelette — one fat yellow yolk between two thin red slices."],"f":"The red-yellow-red was chosen by Charles III in 1785 so ships could tell Spanish vessels from others at sea."},"map":{"t":"Most of the Iberian peninsula, west of France.","f":"Spain includes the Canary Islands off Africa and two cities on the African mainland, Ceuta and Melilla."},"capital":{"t":["Madrid — MAD REAL Madrid fans, in the middle of Spain.","SPIN a MAT to RID it of bugs — Madrid, Spain."],"f":"Madrid sits almost exactly at the geographic centre of Spain, and at 650 m is the highest capital in the EU."}},"fi":{"flag":{"t":["White with a blue Nordic cross. Blue lakes on white snow.","FIN-land: one blue FIN cutting through white snow."],"f":"The blue-and-white design was adopted in 1918; the poet Topelius suggested blue for the lakes and white for the snow."},"map":{"t":"The Nordic country wedged between Sweden and Russia.","f":"Finland is 'the land of a thousand lakes' — actually about 188,000 of them."},"capital":{"t":["Helsinki — HELL SINKS into the frozen Baltic.","A shark FIN in a ring of HELL fire, SINKING — Helsinki."],"f":"Helsinki was a small town until the Russians made it the capital in 1812 to pull Finland away from Sweden."},"language":{"t":"FINNISH — not related to Swedish or Russian at all; its cousins are Estonian and Hungarian."}},"fo":{"flag":{"t":["White with a red Nordic cross outlined in blue. Danish cross, Icelandic colours swapped.","FAROE: Iceland in reverse — white background, red cross with blue edges."],"f":"Called Merkið ('the banner'), it was designed by Faroese students in Copenhagen in 1919."},"map":{"t":"Tiny island cluster halfway between Scotland and Iceland.","f":"The Faroes have more sheep than people and no trees to speak of; 'Faroe' likely means 'sheep islands'."},"capital":{"t":"Tórshavn — Thor's harbour.","f":"Tórshavn is one of the smallest capitals in the world, with roughly 14,000 people."}},"fr":{"flag":{"t":["Blue-white-red vertical, blue at the hoist. The original tricolour; Ireland copied the layout.","FR-ance: Bleu-Blanc-Rouge from the pole — the two B's first, then Rouge."],"f":"White was the king's colour; blue and red were the colours of Paris. Lafayette combined them in 1789."},"map":{"t":"The hexagon: Atlantic and Mediterranean coasts, Channel to the north.","f":"France has more time zones than any other country (12) thanks to its overseas territories."},"capital":{"t":"Paris — the Eiffel Tower.","f":"The Eiffel Tower was meant to be dismantled after 20 years; it was saved because it made a good radio mast."},"currency":{"t":"EURO — France, Germany, Italy, Spain and 16 others; the newest members are Croatia (2023) and Bulgaria (2026)."}},"gb":{"flag":{"t":["Union Jack: red cross of England, white diagonal of Scotland, red diagonal of Ireland on blue.","UNION Jack: three flags UNIONED — England's red cross, Scotland's white X, Ireland's red X.","'Broad white on top' — the Scouts' rule for flying the Union Jack the right way up: the wide white diagonal sits above the red one nearest the pole."],"f":"Wales isn't represented on the Union Jack because it was already annexed to England when the flag was made."},"map":{"t":"The big island off France's northwest, plus Northern Ireland.","f":"The UK is four nations, and 'Great Britain' is just the big island — Northern Ireland isn't on it."},"capital":{"t":["London — Big Ben.","LONDON Bridge is falling down — the UK's is the one everyone knows."],"f":"London has been the capital for nearly a thousand years and was the largest city in the world from around 1825 to 1925."},"currency":{"t":"POUND — sterling, originally a pound weight of silver pennies; the oldest currency still in use."}},"gg":{"flag":{"t":["Red cross on white with a golden cross inside it. The gold cross is what separates it from England.","GUERNSEY: England's cross with a golden cross laid inside it."],"f":"The gold cross inside the red one was added in 1985 to stop Guernsey being mistaken for England."},"map":{"t":"Channel Islands, just off Normandy — Guernsey is the more western one.","f":"Guernsey is closer to France than to England and isn't part of the UK — it's a Crown Dependency."},"capital":{"t":"St Peter Port — a saint's port.","f":"Victor Hugo wrote Les Misérables in exile in St Peter Port."}},"gi":{"flag":{"t":["White over a thin red strip with a red castle and a gold key. The key to the Mediterranean.","GIBRALTAR: a red castle with a golden KEY hanging under it — the key to the Med."],"f":"The castle and key come from the arms granted by Spain in 1502, before Britain took the Rock in 1704."},"map":{"t":"The rock at the very bottom tip of Spain, facing Morocco.","f":"Gibraltar's airport runway crosses the main road into town; traffic stops when planes land."},"capital":{"t":"Gibraltar — city and territory share the name.","f":"Gibraltar's Barbary macaques are the only wild monkeys in Europe."}},"gr":{"flag":{"t":["Nine blue-and-white stripes with a white cross in the canton. Blue sea, white foam.","GREECE: a GREEK sailor's striped shirt — nine blue and white stripes."],"f":"The nine stripes are said to match the syllables of the motto 'Eleftheria i Thanatos' — Freedom or Death."},"map":{"t":"Bottom of the Balkans, a hand reaching into the Mediterranean with hundreds of islands.","f":"Greece has around 6,000 islands, of which only about 227 are inhabited."},"capital":{"t":["Athens — the Acropolis.","EIGHT GREASED HENS — Athens, Greece."],"f":"Athens hosted the first modern Olympics in 1896, and the Parthenon has been a temple, a church, a mosque and a gunpowder store."},"language":{"t":"GREEK — 3,400 years of written records, the longest of any living language."}},"hr":{"flag":{"t":["Red-white-blue horizontal with a red-and-white checkerboard shield. The chequerboard is Croatia's football-shirt pattern.","CRO-AT-ia: a red-and-white CHECKERBOARD 'coat' on the tricolour."],"f":"The chequerboard (šahovnica) dates back at least to the 1500s and even appears on Croatian football shirts."},"map":{"t":"A crescent (or boomerang) wrapping around Bosnia, with the long Adriatic coast.","f":"Croatia's coast has over 1,200 islands, and the country invented the necktie (cravat = Croat)."},"capital":{"t":["Zagreb — ZAGs like the coastline: Zagreb is inland though, up north.","A CROW swoops down for a 'ZA GRAB — Zagreb."],"f":"Zagreb has a 'Museum of Broken Relationships' displaying objects left over from failed romances."},"currency":{"t":"EURO — Croatia swapped the kuna ('marten', for the fur once used as money) for the euro in 2023."}},"hu":{"flag":{"t":["Red-white-green horizontal. Iran has green on top; Hungary red on top (Communist history: red first).","HUNG-ary: a HUNGry mouth — red lips on top, white teeth, green tongue below."],"f":"The colours date to the 1848 revolution against Austria; red for strength, white for fidelity, green for hope."},"map":{"t":"Landlocked Danube basin, south of Slovakia, with Lake Balaton.","f":"Lake Balaton is the largest lake in central Europe, nicknamed the 'Hungarian Sea'."},"capital":{"t":["Budapest — Buda and Pest, two halves either side of the Danube.","BUDDHA is HUNGRY — Budapest, Hungary."],"f":"Budapest was three towns — Buda, Óbuda and Pest — until they merged in 1873; it has the oldest metro line on the continent."},"currency":{"t":"FORINT — from Florence, like the florin; Hungary never joined the euro."},"language":{"t":"HUNGARIAN — Magyar: unrelated to every neighbour, distantly related to Finnish and Estonian."}},"ie":{"flag":{"t":["Green-white-orange vertical, green at the hoist. Ireland is west, so green sits on the left; Ivory Coast is the mirror.","IRE-land: I for Ireland goes first — green at the pole. Ivory Coast puts orange first.","Ireland is the Emerald Isle, so green goes first (at the pole). Ivory Coast is the mirror. An indoor athletics championship once forgot Ivory Coast's flag and the winner just turned Ireland's around."],"f":"Orange stands for the Protestant followers of William of Orange; white for peace between them and Catholic green."},"map":{"t":"The island west of Britain; the republic is everything except the northeast corner.","f":"Ireland has no snakes — supposedly because St Patrick drove them out, actually because they never arrived after the Ice Age."},"capital":{"t":["Dublin — DUBlin: the Liffey doubles through the middle.","A DOUBLE IN — Dublin, Ireland."],"f":"Dublin's Guinness brewery signed a 9,000-year lease in 1759 at £45 a year."},"language":{"t":"IRISH — Gaeilge, the first official language, though English is what most people speak."}},"im":{"flag":{"t":["Red with three armoured legs joined at the thigh (the triskelion). Whichever way you throw it, it stands.","ISLE OF MAN: one MAN with three legs, spinning on red."],"f":"The three-legged triskelion's motto is 'Quocunque Jeceris Stabit' — whichever way you throw it, it will stand."},"map":{"t":"Island in the Irish Sea, dead centre between Ireland, Scotland, England and Wales.","f":"The Isle of Man's parliament, Tynwald, has met since 979 — the oldest continuous parliament in the world."},"capital":{"t":"Douglas — Douglas is a Scottish name; the island's nearest big neighbour is Scotland.","f":"Douglas is the finish line of the TT motorcycle races, the most dangerous race on Earth."}},"is":{"flag":{"t":["Blue with a red Nordic cross outlined in white. Norway reversed: Iceland is an island surrounded by blue sea.","ICE-land: Norway's colours iced over — blue background, red cross wrapped in white ice.","Iceland = an ISLAND, so the background is the blue sea and the cross is red-hot lava edged in white ice. Norway is the swap."],"f":"Red for volcanic fire, white for ice, blue for the sea and sky — a snapshot of the island."},"map":{"t":"Big island alone in the North Atlantic, below the Arctic Circle.","f":"Iceland sits on the Mid-Atlantic Ridge; the country is literally splitting apart at about 2 cm a year."},"capital":{"t":["Reykjavík — 'smoky bay', named after the steam from hot springs.","In ICELAND they'll RAKE YA, VIC — Reykjavík."],"f":"Reykjavík is the northernmost capital in the world and is heated almost entirely by geothermal water."},"currency":{"t":"KRÓNA — Iceland's króna, with the accent, is the tiny one; the country of 380,000 has its own currency."},"language":{"t":"ICELANDIC — so little changed that Icelanders can read 1,000-year-old sagas."}},"it":{"flag":{"t":["Green-white-red vertical. Pesto, mozzarella, tomato.","IT-aly: pesto, mozzarella, tomato from the pole — green, white, red."],"f":"Napoleon introduced the tricolour to Italy in 1797, swapping France's blue for green."},"map":{"t":"The boot kicking Sicily.","f":"Italy contains two whole countries inside it: San Marino and Vatican City."},"capital":{"t":"Rome — the Colosseum.","f":"Rome's Trevi Fountain collects about €1.5 million in coins a year, given to charity."}},"je":{"flag":{"t":["White with a red diagonal cross (saltire) and a small crest on top. Jersey's red X marks the spot.","JERSEY: a JERSEY with a big red X across it."],"f":"The red saltire may come from a medieval clerk confusing Jersey with Ireland, whose saltire is red on white."},"map":{"t":"Channel Islands, the one closest to France.","f":"Jersey is 14 miles from France; it was occupied by Germany in WWII, the only British soil that was."},"capital":{"t":"St Helier — a saint, like Guernsey's St Peter Port.","f":"St Helier is named after a 6th-century hermit beheaded by pirates on the island."}},"li":{"flag":{"t":["Blue over red with a gold crown in the corner. Crown added in 1937 after they noticed Haiti had the same flag at the Olympics.","LIECHTEN-stein: a golden crown LIT in the top corner of blue over red."],"f":"At the 1936 Olympics, Liechtenstein discovered its flag was identical to Haiti's; the crown was added the next year."},"map":{"t":"A sliver between Switzerland and Austria on the Rhine.","f":"Liechtenstein is doubly landlocked (surrounded only by landlocked countries) — the only other one is Uzbekistan."},"capital":{"t":["Vaduz — 'VA-DOOZ': a tiny castle town for a tiny principality.","LICK TEN STEINS and watch the FAT OOZE — Vaduz, Liechtenstein."],"f":"Vaduz is one of just two capitals not served by an airport or a railway station in its own country (the other's Andorra la Vella)."},"currency":{"t":"SWISS FRANC — Liechtenstein has used Switzerland's franc since 1924."}},"lt":{"flag":{"t":["Yellow-green-red horizontal. Lithuania: sun (yellow), forest (green), blood (red). Yellow on top — the L-Tania sun.","LIT-huania: a LIT yellow sun on top, then green, then red."],"f":"Lithuania was the first Soviet republic to declare independence, in March 1990; this flag went straight back up."},"map":{"t":"Bottom of the three Baltics, touching Poland and Kaliningrad.","f":"By some calculations the geographic centre of Europe lies in Lithuania, north of Vilnius."},"capital":{"t":["Vilnius — VILlage-us: the old town of Vilnius.","LITHE Uncle Wayne is a VILLAIN — Vilnius, Lithuania."],"f":"A bohemian district of Vilnius, Užupis, declared itself an independent republic in 1997 — its constitution includes 'a dog has the right to be a dog'."},"language":{"t":"LITHUANIAN — the most archaic living Indo-European language, with features close to Sanskrit."}},"lu":{"flag":{"t":["Red-white-light-blue horizontal. Netherlands but with a lighter blue; small country, light blue.","LUX-embourg: the Dutch flag in de-LUXe light blue."],"f":"The light blue was formalised in 1993 specifically to differentiate it from the Netherlands."},"map":{"t":"A pocket-sized country wedged between Belgium, Germany and France.","f":"Luxembourg was the first country to make all public transport free, in 2020."},"capital":{"t":"Luxembourg City — same name as the country.","f":"Luxembourg City sits on cliffs above two river gorges; its old fortifications were called the 'Gibraltar of the North'."},"language":{"t":"LUXEMBOURGISH, FRENCH, GERMAN — Luxembourgish is a Germanic language; laws are written in French."}},"lv":{"flag":{"t":["Dark maroon-white-maroon horizontal, thin white stripe. A wounded leader wrapped in a white sheet, bloody on both sides.","LAT-via: dark maroon with one thin white LATh across the middle."],"f":"A legend says a wounded Latvian chief was wrapped in a white sheet that stayed white only where his body lay; it's one of the oldest flag designs, from the 1280s."},"map":{"t":"Middle of the three Baltics, on the Gulf of Riga.","f":"Riga's Gulf freezes in hard winters; Latvia has more Art Nouveau buildings per head than anywhere else."},"capital":{"t":["Riga — the middle Baltic gets the middle-length name: Tallinn, Riga, Vilnius.","LATS delivered VIA a special RIG — Riga, Latvia."],"f":"Riga's Central Market is housed in five WWI Zeppelin hangars."},"language":{"t":"LATVIAN — a Baltic language, related only to Lithuanian."}},"mc":{"flag":{"t":["Red over white, nearly square. Indonesia is the same colours but wider; Poland is upside down.","MONACO: red on top, white below, and MONO — nothing else on it.","Monaco and Indonesia are the same red-over-white; Monaco is nearly square (4:5), Indonesia is wide (2:3). Poland is the upside-down one."],"f":"Monaco's flag has been the same since 1881; Indonesia adopted an identical one in 1945 and Monaco protested, unsuccessfully."},"map":{"t":"A dot on the French Riviera near Italy, second-smallest country.","f":"Monaco is the most densely populated country on Earth and has expanded its land area by reclaiming sea."},"capital":{"t":"Monaco — it's a city-state.","f":"Monaco's Grand Prix is run through the city's ordinary streets, taking six weeks to set up."},"currency":{"t":"EURO — Monaco mints its own euro coins with the prince's face though it isn't in the EU."}},"md":{"flag":{"t":["Blue-yellow-red vertical with an eagle holding a shield on the yellow. Romania's flag with a bird — Moldova was part of Romania.","MOLD-ova: Romania's flag with an eagle MOULDED into the middle."],"f":"The eagle holds a shield with an aurochs head — the same bull that appears on Romania's arms, a nod to shared Moldavian history."},"map":{"t":"Landlocked between Romania and Ukraine.","f":"A strip along the eastern border, Transnistria, runs itself as a breakaway state with Soviet-style symbols."},"capital":{"t":["Chișinău — 'KISH-in-ow': a KISH dish in a knish shop.","MOULDED OVER? It's CHEESY NOW — Chișinău, Moldova."],"f":"Chișinău has a wine cellar (Milestii Mici) with 200 km of tunnels — a Guinness record."},"currency":{"t":"LEU — Moldova and Romania both use the leu ('lion'); Bulgaria's lev is the same word."}},"me":{"flag":{"t":["Red with a gold border and a gold double-headed eagle. Fancy gold trim — Montenegro's flag looks like a royal frame.","MONTE-negro: a MOUNTain of gold trim round a red flag."],"f":"The gold-bordered flag is based on the royal standard of King Nikola I, restored in 2004."},"map":{"t":"Small Adriatic coast south of Croatia, above Albania.","f":"The Bay of Kotor is often called the southernmost fjord in Europe (it's actually a drowned river canyon)."},"capital":{"t":"Podgorica — 'under the little hill' — PODs of Gorillas under the hill.","f":"Podgorica was called Titograd from 1946 to 1992, after Yugoslavia's Tito."},"currency":{"t":"EURO — Montenegro and Kosovo use the euro without permission; they simply adopted it in 2002."}},"mk":{"flag":{"t":["Red with a yellow sun radiating eight rays to the edges. The 'sun of liberty' — rays go all the way out.","MACE-DON-ia: a sun with eight rays, DONE in yellow on red."],"f":"Greece objected to the original 16-ray 'Vergina Sun', so it was redesigned with eight rays in 1995."},"map":{"t":"Landlocked, north of Greece, south of Serbia and Kosovo.","f":"The country added 'North' to its name in 2019 to end a 27-year dispute with Greece."},"capital":{"t":["Skopje — SKOP-yeh: Mother Teresa was born in Skopje.","'NO,' says the MASTODON, 'you can't SCOPE me' — Skopje, North Macedonia."],"f":"Skopje was flattened by an earthquake in 1963; its rebuilt railway station clock is stopped at the moment it struck, 5:17."},"currency":{"t":"DENAR — North Macedonia's denar, a dinar spelled the Macedonian way."}},"mt":{"flag":{"t":["White over red vertical with a George Cross in the corner. The George Cross was awarded to the whole island in WWII.","MALTA → MEDAL-ta: a medal (the George Cross) in the top corner of white-and-red halves."],"f":"George VI awarded the George Cross to the whole island in 1942 for enduring bombing in WWII."},"map":{"t":"Tiny island south of Sicily.","f":"Malta has one of the highest population densities in the world and no rivers or lakes."},"capital":{"t":["Valletta — Valletta's VALiant knights of Malta.","The MALT FELL OUTTA the cup — Valletta, Malta."],"f":"Valletta was built by the Knights of St John after the 1565 siege — Europe's first planned city with a grid."},"language":{"t":"MALTESE — the only Semitic language written in Latin letters, descended from Arabic with Italian vocabulary."}},"nl":{"flag":{"t":["Red-white-blue horizontal. 'Red, white and blue' in the natural order, top down.","NETHER-lands: blue is NETHER (below), red on top.","Say 'red, white and blue' — that's the Dutch flag top to bottom. Luxembourg's is the same order in lighter blue; Russia is 'white, blue, red'."],"f":"The original 'Prince's Flag' was orange-white-blue; the orange dye faded to red, so red became official."},"map":{"t":"Low country on the North Sea, north of Belgium, west of Germany.","f":"About a third of the Netherlands is below sea level, kept dry by dikes and pumps."},"capital":{"t":["Amsterdam — capital, though government sits in The Hague.","NETHER regions bothered by a HAMSTER DAM — Amsterdam, Netherlands."],"f":"Amsterdam has more bridges than Venice — over 1,200 — and is built on millions of wooden piles."}},"no":{"flag":{"t":["Red with a blue Nordic cross outlined in white. Denmark's flag with a blue cross added.","NOR-way: NOR Denmark NOR Sweden — Denmark's red flag with Sweden's blue cross laid on top (white edge round it).","Nordic family: all five have an off-centre cross. Norway is red with a blue cross; Iceland is the reverse (blue with a red cross) — 'Iceland is an island, so it's surrounded by blue sea'."],"f":"The blue cross was added in 1821; between 1844 and 1898 the flag had a Sweden-Norway union mark in the corner nicknamed the 'herring salad'."},"map":{"t":"The long western spine of Scandinavia, fjords facing the Atlantic.","f":"Norway's coastline, counting fjords and islands, is over 100,000 km — enough to circle the Earth two and a half times."},"capital":{"t":["Oslo — 'Oh, slow' — northern pace of life.","NORWAY: ALL SLOW — Oslo."],"f":"Oslo was called Christiania (after a Danish king) from 1624 until 1925."},"currency":{"t":"KRONE — Norway's krone: the country said no to the EU twice, so no euro."}},"pl":{"flag":{"t":["White over red. Snow on top of the ground; Indonesia and Monaco are red on top.","POL-and: the white is up the POLE (on top), red underneath. Indonesia is red-up."],"f":"White and red come from the white eagle on a red shield, Poland's arms since the 13th century."},"map":{"t":"Big flat country east of Germany, Baltic coast on top.","f":"Poland's borders moved hundreds of kilometres west after WWII; the country was wiped off the map entirely from 1795 to 1918."},"capital":{"t":["Warsaw — 'WAR SAW': the city saw war, flattened in 1944.","POLE LAND won't win a WAR with SAWS — Warsaw."],"f":"Warsaw's old town was rebuilt brick by brick after 1945 using 18th-century paintings as a guide — it's now a UNESCO site."},"currency":{"t":"ZŁOTY — Poland's złoty means 'golden'; pronounced 'ZWOT-ih'."}},"pt":{"flag":{"t":["Green at the hoist (narrower), red on the fly, with an armillary sphere and shield on the join. Sphere = the Age of Discovery navigators.","PORT-ugal: green on the PORT (left) side, PORT-wine red filling the rest."],"f":"The armillary sphere was the navigation instrument of Portugal's Age of Discovery; the flag was adopted in 1911 after the monarchy fell."},"map":{"t":"The west edge of Iberia, facing the Atlantic.","f":"Portugal's border with Spain is one of the oldest unchanged borders in the world, essentially fixed since 1297."},"capital":{"t":"Lisbon — LIST of BONs: Portuguese custard tarts (pastéis de nata) in Lisbon.","f":"Lisbon was largely destroyed by an earthquake, tsunami and fire on All Saints' Day 1755."}},"ro":{"flag":{"t":["Blue-yellow-red vertical, plain. Chad is the same but with a darker blue.","RO-mania: the ROyal (lighter) blue. Chad is the same flag in a darker blue."],"f":"In the 1989 revolution people cut the communist emblem out of the flag, leaving a hole in the middle."},"map":{"t":"Black Sea coast, north of Bulgaria, curled around the Carpathians.","f":"Transylvania is in Romania, and Bran Castle is marketed as Dracula's — though Vlad the Impaler probably never lived there."},"capital":{"t":["Bucharest — not Budapest! BUCHarest = 'BOOK a rest' in Romania.","ROMAINE lettuce as a BOOK REST — Bucharest, Romania."],"f":"Bucharest's Palace of the Parliament is the heaviest building in the world."},"currency":{"t":"LEU — Romania's leu, plural lei, means lion — the Dutch lion dollars that circulated in the 1600s."},"language":{"t":"ROMANIAN — a Romance language, like Italian and Spanish, surrounded by Slavic and Hungarian neighbours."}},"rs":{"flag":{"t":["Red-blue-white horizontal (Russia upside down) with a two-headed eagle crest toward the hoist.","SERB-ia: Russia SERVED upside down (red-blue-white), eagle in the middle."],"f":"The reversed Russian colours come from the pan-Slavic movement; the white double-headed eagle is from the Nemanjić dynasty."},"map":{"t":"Landlocked heart of the Balkans, above North Macedonia and Kosovo.","f":"Serbia has been landlocked since Montenegro left the union in 2006."},"capital":{"t":["Belgrade — 'white city' (beo-grad) where the Sava meets the Danube.","The waitress will SERVE YA and GRATE a BELL — Belgrade, Serbia."],"f":"Belgrade has been fought over in about 115 wars and razed 44 times — one of the most-contested cities in history."}},"ru":{"flag":{"t":["White-blue-red horizontal. White top: 'snow above the sea above the blood'. Serbia is the reverse with a crest.","RUS-sia: White Bear Runs — White, Blue, Red, top to bottom."],"f":"Peter the Great borrowed the Dutch colours in the 1690s for his new navy; the flag was banned under the Soviets and restored in 1991."},"map":{"t":"The biggest country, spanning from the Baltic to the Pacific.","f":"Russia spans 11 time zones and borders 14 countries."},"capital":{"t":["Moscow — the Kremlin.","RUSHING to see the MOSS COW — Moscow, Russia."],"f":"Moscow's Kremlin walls are red brick — and the Red Square is 'red' because the old Russian word also meant beautiful."},"currency":{"t":"RUBLE — from the Russian 'rubit', to chop: a chopped-off piece of a silver bar."}},"se":{"flag":{"t":["Blue with a yellow Nordic cross. IKEA colours.","SWEDEN = IKEA: yellow cross on blue, straight off the shop sign."],"f":"The blue and yellow come from the national arms — three gold crowns on blue — dating to the 1400s."},"map":{"t":"The eastern half of Scandinavia, facing the Baltic.","f":"Sweden has around 267,000 islands, more than any other country."},"capital":{"t":["Stockholm — Stockholm syndrome, from a Stockholm bank robbery.","STOCK your HOME with SWEDISH fish — Stockholm."],"f":"Stockholm is built on 14 islands, and the Vasa museum holds a warship that sank on its maiden voyage in 1628 and was raised almost intact."},"currency":{"t":"KRONA — Sweden spells it krona (plural kronor); IKEA prices are in it."}},"si":{"flag":{"t":["White-blue-red horizontal with a shield of Mount Triglav (three peaks) and stars in the top-left. SloveNIa has mouNtaIns.","SLOVEN-ia: the shield has three MOUNTAIN peaks — the country is in the Alps."],"f":"The three peaks on the crest are Mount Triglav, Slovenia's highest mountain; the wavy lines below are the sea and rivers."},"map":{"t":"Small Alpine country between Italy, Austria and Croatia; tiny bit of coast.","f":"Slovenia's coast is only 47 km, but over half the country is forest."},"capital":{"t":["Ljubljana — 'lyoo-BLYAH-nah': the 'beloved' city; dragons on its bridge.","SLOW VEIN, so LUBE LEANNE — Ljubljana, Slovenia."],"f":"Ljubljana's symbol is a dragon, and the city was reshaped by one architect, Jože Plečnik, between the wars."}},"sk":{"flag":{"t":["White-blue-red horizontal with a double cross on three blue hills, toward the hoist. Slovakia's cross sits lower and further left than Slovenia's mountains.","SLOVAK-ia: the shield is a double cross on three hills, sitting LOW and to the left."],"f":"The double cross on three hills has been Slovakia's symbol since medieval Hungary; the three hills are the Tatra, Fatra and Mátra ranges."},"map":{"t":"Landlocked, between Czech Republic, Poland, Ukraine, Hungary and Austria.","f":"Czechoslovakia split peacefully on 1 January 1993 in the 'Velvet Divorce'."},"capital":{"t":["Bratislava — the only capital bordering two countries (Austria and Hungary); 'BRAT is LAVA-hot'.","SWALLOWED A KEY: the BRAT IS slow as LAVA — Bratislava, Slovakia."],"f":"Bratislava was the coronation city of Hungarian kings for nearly 300 years; Vienna is only 55 km away."},"language":{"t":"SLOVAK — close enough to Czech that speakers understand each other."}},"sm":{"flag":{"t":["White over light blue with a coat of arms of three towers on three peaks. Three towers on Mount Titano.","SAN MARINO: MARINE blue and white halves."],"f":"The three towers on the arms are real: Guaita, Cesta and Montale on Mount Titano."},"map":{"t":"A dot inside north-central Italy, near Rimini.","f":"San Marino claims to be the oldest surviving republic, founded in AD 301 by a stonemason fleeing persecution."},"capital":{"t":"City of San Marino — same name as the country.","f":"San Marino has two heads of state (Captains Regent) elected every six months — the shortest term in the world."},"currency":{"t":"EURO — San Marino, like the Vatican and Monaco, has its own euro coins without being in the EU."}},"sj":{"flag":{"t":["Norway's flag — it's Norwegian territory.","SVALBARD: no flag of its own — it flies Norway's."],"f":"Svalbard has no flag of its own and flies Norway's, but by a 1920 treaty citizens of 40+ countries can live and work there visa-free."},"map":{"t":"Arctic islands halfway between Norway and the North Pole.","f":"The Global Seed Vault, storing backup seeds from around the world, is buried in a Svalbard mountainside."},"capital":{"t":"Longyearbyen — LONG YEAR: polar night makes the year feel long.","f":"In Longyearbyen you must carry a rifle outside town because of polar bears, and it's illegal to be buried there — bodies don't decompose in permafrost."}},"ua":{"flag":{"t":["Blue over yellow. Blue sky over a yellow wheat field.","UK-raine: Under the sKy, grain — blue sky over yellow wheat."],"f":"The colours were used by Ukrainian revolutionaries in 1848 and banned in Soviet times; officially blue over yellow since 1992."},"map":{"t":"Big country north of the Black Sea, between Poland and Russia.","f":"Ukraine is the largest country entirely in Europe, and the geographical centre of Europe is claimed at Dilove in the west."},"capital":{"t":["Kyiv — chicken Kyiv.","You'll need a CRANE to reach the KEY I'VE hidden — Kyiv, Ukraine."],"f":"Kyiv is over 1,500 years old and was the capital of the medieval Rus' state from which Russia takes its name."},"currency":{"t":"HRYVNIA — Ukraine's hryvnia was the currency of medieval Kyivan Rus'; the word once meant a neck ring."},"language":{"t":"UKRAINIAN — Slavic, closer to Belarusian and Polish than to Russian in vocabulary."}},"va":{"flag":{"t":["Yellow and white vertical with the crossed keys of St Peter under the papal tiara. Square flag.","VAT-ican: a VAT of gold, a vat of white, keys across the seam."],"f":"Yellow and white replaced red and yellow in 1808 after Napoleon's troops adopted the papal colours; it's one of only two square national flags."},"map":{"t":"A walled enclave inside Rome — smallest country on Earth.","f":"Vatican City is about 0.44 km² — you could walk across it in 20 minutes. It has its own post office, radio station and ATMs in Latin."},"capital":{"t":"Vatican City — the whole country is the city.","f":"The Vatican has the shortest railway in the world, about 300 m, and the Swiss Guard still wears Renaissance-style uniforms."},"currency":{"t":"EURO — the Vatican mints tiny quantities of euro coins with the Pope on them; collectors pay a fortune."},"language":{"t":"LATIN and ITALIAN — the Vatican's ATMs give instructions in Latin."}},"xk":{"flag":{"t":["Blue with a gold map of the country and six white stars above it. One of only two flags with a map on it (Cyprus is the other).","KOSO-vo: the country's own outline in gold, under six white stars on blue."],"f":"The six stars stand for six ethnic groups; the flag was chosen in 2008 partly because it avoids any flag already used by Albania or Serbia."},"map":{"t":"Landlocked between Serbia, North Macedonia, Albania and Montenegro.","f":"Kosovo declared independence in 2008; about half of UN members recognise it."},"capital":{"t":["Pristina — 'PRISTINE-a', the new capital of Europe's newest country.","COAST OVER the PRISTINE forest — Pristina, Kosovo."],"f":"Pristina has a statue of Bill Clinton and a Bill Clinton Boulevard, thanking the US for the 1999 intervention."},"currency":{"t":"EURO — Kosovo adopted the euro unilaterally in 2002 and has never had its own currency."}},"ax":{"flag":{"t":"Sweden's flag with a red cross inside the yellow one. Swedish-speaking, Finnish-owned — Sweden's colours plus Finland's red history.","f":"The red cross was added to the Swedish design in 1954 to mark Finland (red was on Finland's old arms)."},"map":{"t":"Islands between Sweden and Finland at the mouth of the Gulf of Bothnia.","f":"Åland is demilitarised by an 1856 treaty and is Swedish-speaking despite belonging to Finland."},"capital":{"t":"Mariehamn — 'Marie's harbour', named after a Russian empress.","f":"Mariehamn was founded in 1861 and named after Maria Alexandrovna, wife of Tsar Alexander II."},"language":{"t":"SWEDISH — Åland is Finnish territory but Swedish-speaking by treaty."}},"af":{"flag":{"t":"Black-red-green vertical with a white mosque emblem in the centre. (The Taliban use a white flag; this is the internationally shown tricolour.)","f":"Afghanistan has had around 30 flag changes since 1900, more than any other country; the black-red-green tricolour was restored in 2002 and the Taliban replaced it again in 2021."},"map":{"t":"Landlocked, between Iran and Pakistan, with a thin panhandle touching China.","f":"The Wakhan Corridor, a thin strip in the north-east, was drawn in the 1890s to keep the British and Russian empires from touching; it gives Afghanistan a short border with China."},"capital":{"t":["Kabul — a CABLE-knit AFGHAN blanket.","An AFGHAN blanket knitted in CABLE stitch — Kabul."],"f":"Kabul sits at about 1,800 m, making it one of the highest capitals in the world."},"currency":{"t":"AFGHANI — the only currency named after the people; Afghan → afghani, nothing to remember."},"language":{"t":"DARI and PASHTO — Dari is Afghan Persian; Pashto is the language of the Pashtuns, the largest group."}},"am":{"flag":{"t":["Red-blue-orange horizontal. The only national flag with an orange stripe at the bottom — apricots are Armenian.","ARMENIA: red-blue-APRICOT — the only tricolour ending in orange."],"f":"Red for the highland and the blood of Armenians, blue for the sky, orange (officially 'apricot') for creative talent — the apricot is the national fruit."},"map":{"t":"Landlocked in the Caucasus, south of Georgia, west of Azerbaijan.","f":"Mount Ararat, on Armenia's coat of arms and visible from Yerevan, is actually across the border in Turkey."},"capital":{"t":["Yerevan — 'YEAR-a-VAN': parked a van there for a year, near Mount Ararat.","ARM MANIA gym: the class is called 'You're a fan' — Yerevan."],"f":"Yerevan was founded in 782 BC, making it older than Rome."},"currency":{"t":"DRAM — Armenia: a DRAM of brandy (Armenian brandy is famous — Churchill drank it)."},"language":{"t":"ARMENIAN — its own alphabet, invented in AD 405 by a monk, Mesrop Mashtots."}},"az":{"flag":{"t":"Blue-red-green horizontal with a white crescent and eight-point star. Turkish blue, Islamic green, progress red.","f":"The eight-pointed star stands for the eight Turkic peoples; the flag was first used by the short-lived 1918 republic and restored in 1991."},"map":{"t":"Caspian Sea coast, east of Armenia; has a detached piece (Nakhchivan).","f":"The exclave of Nakhchivan is separated from the rest of Azerbaijan by Armenia; 'Land of Fire' refers to natural gas seeping from the ground and burning."},"capital":{"t":["Baku — BAKU BAKES in the oil-rich heat by the Caspian.","'Abs are by Jean, BACK is all YOU' — Baku."],"f":"Baku lies about 28 m below sea level — the lowest-lying capital in the world."},"currency":{"t":"MANAT — Azerbaijan and Turkmenistan both use the manat (from Russian 'moneta', coin)."},"language":{"t":"AZERBAIJANI — a Turkic language very close to Turkish."}},"bd":{"flag":{"t":["Green with a red disc, offset toward the hoist. Japan's red sun set into a green delta.","BANGLADESH: Japan's sun gone green — a red disc on a green field."],"f":"The red disc is set slightly toward the hoist so it looks centred when the flag flies; it was adopted in 1971 after the war of independence from Pakistan."},"map":{"t":"The Ganges delta, almost surrounded by India, next to Myanmar.","f":"Bangladesh is almost entirely surrounded by India, and most of it is a river delta only a few metres above sea level."},"capital":{"t":["Dhaka — DHAKA rhymes with 'DACCA': the crowded delta capital.","BANG goes the starting gun and the DACHshunds race — Dhaka."],"f":"Dhaka is one of the most densely populated cities on Earth and the 'rickshaw capital of the world', with hundreds of thousands of cycle rickshaws."},"currency":{"t":"TAKA — Bangladesh's taka: 'TAKe a taka'."},"language":{"t":"BENGALI — the language the country is named for; the 1952 Language Movement is why 21 February is International Mother Language Day."}},"bh":{"flag":{"t":["Red with a white hoist strip joined by five white triangles (a zigzag). Five points = the five pillars of Islam. Qatar has nine and is maroon.","BAHRAIN: red with FIVE white teeth. Qatar is darker with nine."],"f":"The five white points stand for the five pillars of Islam; before 2002 there were more points, trimmed to avoid confusion with Qatar's flag."},"map":{"t":"A tiny island in the Persian Gulf, beside Saudi Arabia and Qatar.","f":"Bahrain is an island connected to Saudi Arabia by the 25 km King Fahd Causeway; the name means 'two seas'."},"capital":{"t":["Manama — 'MA-NAMA': mama's island home.","A lamb says BAH in the RAIN; the man on it sings 'MA-NA-MA' — Manama."],"f":"Manama hosts the Bahrain Grand Prix, the first F1 race ever held in the Middle East (2004)."}},"bn":{"flag":{"t":"Yellow with a black and white diagonal stripe and a red crest. Yellow = royalty; the sultan's flag.","f":"The diagonal black and white stripes represent the two chief ministers who advised the Sultan; the crest was added in 1959."},"map":{"t":"Two small pieces on the north coast of Borneo, inside Malaysian Sarawak.","f":"Brunei is split in two by the Malaysian state of Sarawak; it once ruled most of Borneo."},"capital":{"t":"Bandar Seri Begawan — 'BANDAR' means port; a long name for a tiny rich sultanate.","f":"Bandar Seri Begawan is home to Kampong Ayer, a 'water village' of 30,000 people on stilts, called the 'Venice of the East'."}},"bt":{"flag":{"t":"Diagonal yellow over orange with a white dragon across the middle. The Thunder Dragon kingdom.","f":"The dragon holds jewels in its claws for wealth; Bhutan calls itself Druk Yul, the Land of the Thunder Dragon."},"map":{"t":"Himalayan kingdom between India and China, east of Nepal.","f":"Bhutan measures Gross National Happiness instead of GDP and is the world's only carbon-negative country."},"capital":{"t":["Thimphu — a Bhutanese monk beats the TIMPani in Thimphu.","A BOOT ON a THIMBLE — Bhutan, Thimphu."],"f":"Thimphu has no traffic lights; a policeman in white gloves directs traffic at the main junction."},"currency":{"t":"NGULTRUM — Bhutan: the most unpronounceable currency belongs to the most remote kingdom; pegged to the Indian rupee."},"language":{"t":"DZONGKHA — the 'fortress language', close to Tibetan."}},"cn":{"flag":{"t":["Red with one big yellow star and four small ones in an arc. The big star is the party; four smaller are the people.","CHINA: one CHIef star and four followers in the corner of a red flag."],"f":"The big star is the Communist Party; the four small ones are the workers, peasants, petty bourgeoisie and patriotic capitalists."},"map":{"t":"The giant of East Asia, from the Himalayas to the Pacific.","f":"China has 14 land neighbours (tied with Russia) and, despite spanning five geographic time zones, uses one official time."},"capital":{"t":["Beijing — the Forbidden City.","BATHING in a CHINA bowl — Beijing."],"f":"Beijing's Forbidden City has 9,999 rooms by legend (about 8,700 in fact) — one fewer than heaven's 10,000."},"currency":{"t":"YUAN — China's yuan; 'renminbi' is the currency system, yuan is the unit, like 'sterling' and 'pound'."},"language":{"t":"CHINESE — Mandarin is the standard; Cantonese in the south (and Hong Kong)."}},"ge":{"flag":{"t":["White with a red St George's cross and four smaller red crosses in the quarters. Five crosses — Georgia, the country of St George.","GEORGIA: five red crosses on white — one big, four small."],"f":"The five-cross flag is medieval (used by Georgian kingdoms from the 1300s) and came back in 2004 after the Rose Revolution."},"map":{"t":"Black Sea coast in the Caucasus, south of Russia, north of Turkey and Armenia.","f":"Georgia claims the oldest winemaking in the world — 8,000-year-old wine residue has been found in clay jars there."},"capital":{"t":["Tbilisi — 'to-BILL-easy': warm springs city; 'tbili' means warm.","GEORGE enjoys TEA BLISS — Tbilisi."],"f":"Tbilisi means 'warm place', after the hot sulphur springs the city was founded around."},"currency":{"t":"LARI — Georgia's lari; the smaller unit is the tetri ('white')."},"language":{"t":"GEORGIAN — has its own alphabet, one of only 14 in the world; unrelated to any other language family."}},"hk":{"flag":{"t":"Red with a white five-petal bauhinia flower. The flower is Hong Kong's orchid tree.","f":"The five petals of the bauhinia orchid each hold a red star; the flag was raised at the 1997 handover from Britain."},"map":{"t":"Tip of south China's coast, east of the Pearl River mouth, opposite Macau.","f":"Hong Kong is 260-odd islands plus a piece of the mainland; the New Territories were leased for 99 years in 1898, which set the 1997 handover date."},"capital":{"t":"Hong Kong — city-territory.","f":"The old capital Victoria has effectively no official status today; Hong Kong has the most skyscrapers of any city in the world."},"language":{"t":"CHINESE and ENGLISH — Cantonese is the spoken Chinese of Hong Kong."}},"id":{"flag":{"t":["Red over white, wide (2:3). Monaco is the same colours but squarer; Poland is upside down. Big country, wide flag.","INDO-nesia: red on top, white below. Monaco is the same; Poland is upside down."],"f":"Indonesia's flag is identical to Monaco's except in proportions; Poland's is the same colours flipped."},"map":{"t":"The huge island chain between Malaysia and Australia along the equator.","f":"Indonesia has about 17,000 islands and is the largest country in the world spread across so many; it straddles the equator."},"capital":{"t":["Jakarta — JAKARTA on Java; Indonesia is moving capital to Nusantara but Jakarta is the answer.","YOUR CART is stuck IN DOUGH — Jakarta, Indonesia."],"f":"Jakarta is sinking so fast (up to 25 cm a year in places) that Indonesia is building a new capital, Nusantara, on Borneo."},"currency":{"t":"RUPIAH — Indonesia's is 'rupiah', with an H; India's is 'rupee'."},"language":{"t":"INDONESIAN — Bahasa Indonesia, a form of Malay chosen as a neutral national language in 1945."}},"il":{"flag":{"t":"White with two blue horizontal stripes and a blue Star of David. Based on the tallit prayer shawl.","f":"The blue stripes copy a tallit prayer shawl; the design was chosen at the First Zionist Congress in 1897."},"map":{"t":"Eastern Mediterranean coast between Lebanon and Egypt.","f":"The Dead Sea, on Israel's border with Jordan, is the lowest point on land at about 430 m below sea level."},"capital":{"t":["Jerusalem — claimed capital; embassies mostly in Tel Aviv.","IT'S REAL JUICY fruit — Jerusalem, Israel."],"f":"Israel names Jerusalem as capital, but most embassies are in Tel Aviv because the city's status is disputed."},"currency":{"t":"SHEKEL — Israel revived the biblical shekel in 1980; 'new shekel' since 1985 after inflation."},"language":{"t":"HEBREW — the only ancient language revived as a mother tongue; Arabic has special status."}},"in":{"flag":{"t":["Saffron-white-green horizontal with a navy 24-spoke wheel (Ashoka Chakra). Niger has an orange disc instead, not a wheel.","IN-DIA: a blue wheel IN the middle of orange-white-green."],"f":"The blue Ashoka Chakra has 24 spokes for the hours of the day; by law the flag must be made of khadi, hand-spun cloth."},"map":{"t":"The subcontinent, a triangle pointing south into the Indian Ocean.","f":"India became the most populous country in 2023, and the Himalayas are still rising as the Indian plate pushes into Asia."},"capital":{"t":["New Delhi — 'NEW DELI' opened in India.","An INDIAN excited about a NEW DELI — New Delhi."],"f":"New Delhi was purpose-built by the British and inaugurated in 1931; it lies inside the larger city of Delhi."},"currency":{"t":"RUPEE — from Sanskrit 'rupya', wrought silver. India, Pakistan, Nepal, Sri Lanka, Mauritius, Seychelles all use rupees."},"language":{"t":"HINDI — with English; 22 scheduled languages and no single national language."}},"iq":{"flag":{"t":"Red-white-black horizontal with green Arabic script (the takbir) in the middle. Egypt has an eagle; Iraq has writing; Syria has two green stars; Yemen is plain.","f":"The green script is the Takbir, 'God is greatest', written in Kufic style since 2008; Saddam Hussein's handwriting was removed from the flag."},"map":{"t":"Between Iran and Syria/Saudi Arabia, the Tigris and Euphrates, tiny Gulf coast.","f":"Mesopotamia, 'between the rivers' Tigris and Euphrates, is where writing and cities were invented."},"capital":{"t":["Baghdad — 'BAG DAD': dad's bag lost in Baghdad.","I ROCK with my BAGpipes, DAD — Baghdad, Iraq."],"f":"Baghdad was founded in 762 as a perfectly round city and was the largest city in the world by around 900."},"currency":{"t":"DINAR — from the Roman 'denarius': Iraq, Jordan, Kuwait, Bahrain, Libya, Tunisia, Algeria, Serbia, North Macedonia."}},"ir":{"flag":{"t":["Green-white-red horizontal with a red tulip-like emblem and script along the stripe edges. Green on top (Islamic); Hungary is red on top.","IRAN vs HUNGARY: same three colours. 'I RAN through the green grass first' — Iran has green on top; Hungary has red on top."],"f":"The border writing is 'Allahu Akbar' repeated 22 times, for the 22nd day of Bahman (11 Feb 1979), the revolution's date."},"map":{"t":"Between Iraq and Afghanistan, Caspian on top, Persian Gulf below.","f":"Iran was called Persia in the West until 1935; Persian carpets, cats and the word 'paradise' all come from here."},"capital":{"t":["Tehran — 'TEA-RAN': the tea ran out in Tehran.","I RAN, TAYLOR RAN — Tehran, Iran."],"f":"Tehran sits at the foot of the Alborz mountains; you can ski in the morning and be back in the city for lunch."},"currency":{"t":"RIAL — Iran, Oman, Yemen use the rial; Qatar and Saudi Arabia spell it riyal."},"language":{"t":"PERSIAN (FARSI) — Iran is not Arab; Persian is Indo-European, written in Arabic script."}},"jo":{"flag":{"t":["Black-white-green horizontal with a red hoist triangle and a small white star. Palestine's flag plus a star.","JORDAN: Palestine's flag with a seven-point star added in the red triangle."],"f":"The seven-pointed star stands for the seven verses of the opening chapter of the Quran."},"map":{"t":"Landlocked (bar a sliver of Red Sea at Aqaba), east of Israel, north of Saudi Arabia.","f":"Petra, the rose-red city carved into cliffs, sits in Jordan's south; Aqaba is the country's only bit of coast."},"capital":{"t":["Amman — 'a MAN from Jordan' (Amman, not Oman).","Michael JORDAN is A MAN — Amman."],"f":"Amman was called Philadelphia in Roman times, after Ptolemy II Philadelphus."}},"jp":{"flag":{"t":["White with a red disc in the centre. Land of the Rising Sun; Bangladesh's disc is on green and offset.","JAPAN: the Rising Sun — one red circle on white."],"f":"The Hinomaru, 'circle of the sun', was only made the official national flag by law in 1999, though it's been used for centuries."},"map":{"t":"The island arc east of Korea.","f":"Japan is about 14,000 islands; the four big ones are Hokkaido, Honshu, Shikoku and Kyushu."},"capital":{"t":["Tokyo — Tokyo Tower.","Throwing TOKENS into a Japanese noodle PAN — Tokyo."],"f":"Tokyo was called Edo until 1868, when the emperor moved there from Kyoto and renamed it 'eastern capital'."},"currency":{"t":"YEN — 'round' in Japanese, like the Chinese yuan and Korean won — all from the same word."}},"kg":{"flag":{"t":"Red with a yellow sun; inside the sun is a stylised yurt roof (tunduk). Sun with a roof — Kyrgyz nomads.","f":"The yellow sun has 40 rays for the 40 tribes; the pattern in the centre is the tunduk, the roof-crown of a yurt."},"map":{"t":"Landlocked mountains south of Kazakhstan, west of China, above Tajikistan.","f":"Around 90% of Kyrgyzstan is mountainous; Issyk-Kul is the world's second-largest alpine lake and never freezes."},"capital":{"t":["Bishkek — 'BISH-KEK': a bishop eats cake in Bishkek.","A BUSH KICK flushes out the enemy — Bishkek, Kyrgyzstan."],"f":"Bishkek was named Frunze (after a Bolshevik general) from 1926 to 1991."},"currency":{"t":"SOM — Kyrgyzstan's som; Uzbekistan's is spelled so'm. Both mean 'pure'."},"language":{"t":"KYRGYZ and RUSSIAN — Kyrgyz is Turkic and still written in Cyrillic."}},"kh":{"flag":{"t":"Blue-red-blue horizontal with a white Angkor Wat temple on the red. The only flag with a building on it.","f":"Cambodia's is the only national flag with a building on it: Angkor Wat, the world's largest religious monument."},"map":{"t":"Between Thailand and Vietnam, south of Laos, on the Gulf of Thailand.","f":"Tonlé Sap lake swells to about five times its size each monsoon, and its river actually reverses direction."},"capital":{"t":["Phnom Penh — 'NOM PEN': nom on a pen.","A secret CAM on my BODY, shaped like a PHENOMENAL PEN — Phnom Penh."],"f":"The Khmer Rouge emptied Phnom Penh in 1975; the entire city was forced into the countryside within days."},"currency":{"t":"RIEL — Cambodia's riel; US dollars circulate alongside it and ATMs give both."},"language":{"t":"KHMER — the Khmer people and the Khmer Empire that built Angkor."}},"kp":{"flag":{"t":["Blue-red-blue with thin white lines and a red star in a white circle toward the hoist. Star in a circle — the communist Korea.","KOREA (North): a red star in a white circle on red — the red, star-driven one."],"f":"The red star is inside a white disc; North Korea dropped the traditional taegeuk symbol (kept by the South) in 1948."},"map":{"t":"Northern half of the Korean peninsula, bordering China.","f":"The DMZ along the 38th parallel is so untouched that it's become an accidental nature reserve."},"capital":{"t":"Pyongyang — 'PYONG-YANG': ping-pong yang, north of the line.","f":"Pyongyang's Ryugyong Hotel, 105 storeys, was begun in 1987 and has never opened."},"currency":{"t":"WON — both Koreas use the won, same word as yen and yuan."}},"kr":{"flag":{"t":["White with a red-and-blue yin-yang and four black trigrams. Balance and harmony — South Korea.","KOREA (South): a red-blue yin-yang on white — the calm, balanced one."],"f":"The four trigrams are from the I Ching; the flag is called Taegukgi after the yin-yang symbol in the centre."},"map":{"t":"Southern half of the Korean peninsula,
