 a Bible in the centre. The only flag with a Bible.","f":"The only national flag with a Bible on it — open to John 8:32, 'the truth shall make you free'."},"map":{"t":"The eastern two-thirds of Hispaniola, next to Haiti.","f":"The Dominican Republic shares Hispaniola with Haiti; Columbus's brother founded Santo Domingo in 1496."},"capital":{"t":["Santo Domingo — Domingo → Dominican.","Mr DOMINIC republished his name as SANTO DOMINGO."],"f":"Santo Domingo is the oldest continuously inhabited European city in the Americas, with the first cathedral, hospital and university."}},"gd":{"flag":{"t":"Red border with yellow and green triangles, stars, and a nutmeg on the hoist. The nutmeg flag — the Spice Isle.","f":"The nutmeg on the hoist side: Grenada is the 'Spice Isle' and once produced a third of the world's nutmeg."},"map":{"t":"Southern Windwards, just above Trinidad.","f":"The US invaded Grenada in 1983 after a coup; the island's Underwater Sculpture Park was the first in the world."},"capital":{"t":["St George's — St George's, Grenada.","A GRENADE thrown at SANTA cowering in a GORGE — St George's, Grenada."],"f":"St George's harbour is a flooded volcanic crater, often called the prettiest harbour in the Caribbean."}},"gl":{"flag":{"t":["White over red with a disc split the opposite way. A sun rising/setting over ice.","GREEN-land has no green: white over red with a disc split the opposite way."],"f":"The only Nordic flag without a cross; the disc is the sun rising over the ice. Adopted 1985."},"map":{"t":"The huge island northeast of Canada.","f":"Greenland is the world's largest island, geographically North American but politically Danish; about 80% is ice sheet."},"capital":{"t":"Nuuk — 'NUKE' the ice: Nuuk.","f":"Nuuk was founded in 1728 by a Danish-Norwegian missionary; it's the world's smallest capital by population of a major territory, around 19,000."},"language":{"t":"GREENLANDIC — an Inuit language; the country is Kalaallit Nunaat."}},"gt":{"flag":{"t":["Light blue-white-light blue vertical with a quetzal bird crest. Vertical stripes and a bird — Guatemala.","GUATEMALA: the only Central American flag with VERTICAL bands (light blue-white-light blue) and a quetzal."],"f":"The quetzal bird on the emblem was chosen because it reputedly dies in captivity — a symbol of liberty; the currency is also the quetzal."},"map":{"t":"Central America directly below Mexico, west of Belize.","f":"Guatemala was the heartland of the Maya; Tikal's temples rise above the northern jungle."},"capital":{"t":"Guatemala City.","f":"Guatemala City replaced Antigua as capital after earthquakes destroyed Antigua in 1773."},"currency":{"t":"QUETZAL — Guatemala's money is named after the sacred bird on its flag; the Maya used its feathers as currency."}},"hn":{"flag":{"t":["Blue-white-blue horizontal with five blue stars in the middle. Five stars = the five old Central American states.","H-O-N-D-U: five letters, five blue stars in the white band.","Central American family: blue-white-blue horizontal (for the old federation). Honduras has five stars, Nicaragua a triangle emblem, El Salvador a coat of arms, Guatemala's runs vertical, Costa Rica adds a thick red band."],"f":"The five stars are the five countries of the old Federal Republic of Central America, which Honduras hopes to reunite."},"map":{"t":"Central America, the wide one between Guatemala and Nicaragua.","f":"Honduras was the original 'banana republic' — the term was coined by O. Henry about a fictional version of it."},"capital":{"t":["Tegucigalpa — 'te-GOOSE-e-GAL-pa': a goose and a gal.","Driving a HONDA: 'TAG — YOU SEE GAL PALS' — Tegucigalpa."],"f":"Tegucigalpa's airport, Toncontín, was long rated one of the most dangerous in the world for its short runway in a mountain valley."},"currency":{"t":"LEMPIRA — named after a 16th-century chief who fought the Spanish."}},"ht":{"flag":{"t":["Blue over red with a coat of arms on a white panel. Liechtenstein is the same colours with a crown instead.","HAI-ti: HIGH blue over LOW red, arms in a white square."],"f":"Legend says Dessalines tore the white out of the French tricolour in 1803; the flag was identical to Liechtenstein's until 1937."},"map":{"t":"The western third of Hispaniola.","f":"Haiti was the first Black republic and second independent country in the Americas (1804), after the only successful slave revolution."},"capital":{"t":["Port-au-Prince — the prince's port.","I HATE a PORTLY PRINCE — Port-au-Prince, Haiti."],"f":"Port-au-Prince was devastated by the 2010 earthquake, which killed over 200,000 people."},"currency":{"t":"GOURDE — Haiti's gourde: gourds were once used as money on the island."},"language":{"t":"HAITIAN CREOLE and FRENCH — Creole is what everyone speaks; French is the language of government."}},"jm":{"flag":{"t":"Gold diagonal cross (saltire) dividing green (top/bottom) and black (sides). The X flag with no red, white or blue.","f":"The only national flag without red, white or blue; the motto reads 'hardships there are but the land is green and the sun shineth'."},"map":{"t":"Island south of Cuba.","f":"Jamaica gave the world reggae, Usain Bolt and the word 'barbecue' (from Taíno 'barbacoa'); the Blue Mountains grow prized coffee."},"capital":{"t":["Kingston — Kingston, home of Bob Marley.","A JAM-MAKING KING gets STUNG — Kingston, Jamaica."],"f":"Kingston replaced Port Royal as the main town after the pirate city sank into the sea in a 1692 earthquake."},"language":{"t":"JAMAICAN PATOIS — an English creole; English is official."}},"kn":{"flag":{"t":"Green and red split by a black diagonal band edged in yellow with two white stars. Two stars, two islands.","f":"The two stars are the two islands, St Kitts and Nevis, or hope and liberty; adopted 1983."},"map":{"t":"Two islands in the Leewards, west of Antigua.","f":"The smallest country in the Americas by both area and population; Nevis was Alexander Hamilton's birthplace."},"capital":{"t":"Basseterre — 'low land' in French.","f":"Basseterre is French for 'low land'; the town was founded by the French in 1627, though the island became British."}},"ky":{"flag":{"t":"British Blue Ensign with a shield of a lion, three stars and a turtle. Cayman = turtle.","f":"The badge shows a turtle over three stars for the three islands, with the motto 'He hath founded it upon the seas'."},"map":{"t":"Three islands south of Cuba, west of Jamaica.","f":"The Caymans have more registered companies than people and are a global tax haven; they were named 'Las Tortugas' by Columbus for the turtles."},"capital":{"t":"George Town — (Guyana's Georgetown is one word).","f":"George Town is home to the Cayman Islands National Museum in the islands' oldest building, and hundreds of bank offices."}},"lc":{"flag":{"t":["Light blue with a yellow triangle in front of a black-and-white triangle. The Pitons — two volcanic peaks.","ST LUCIA: two Pitons (a black-and-white triangle over a gold one) on light blue."],"f":"The triangles are the Pitons, two volcanic spires rising from the sea; the design is by Dunstan St Omer, 1967."},"map":{"t":"Windwards, between Martinique and St Vincent.","f":"St Lucia changed hands between France and Britain 14 times; it has produced two Nobel laureates from a population of 180,000."},"capital":{"t":"Castries — 'CASTRIES': castles by the sea.","f":"Castries has burned down several times; its Derek Walcott Square is named after the poet who won the Nobel in 1992."}},"mq":{"flag":{"t":["France's tricolour.","MARTINIQUE: flies the French tricolour."],"f":"Martinique uses the French flag; a snake flag from 1766 was dropped in 2018 for its links to slavery."},"map":{"t":"Windwards, between Dominica and St Lucia.","f":"Mount Pelée erupted in 1902 and killed about 28,000 people in Saint-Pierre in minutes; only a handful survived, including a prisoner in a cell."},"capital":{"t":"Fort-de-France.","f":"Fort-de-France became capital after Saint-Pierre was destroyed in 1902; Empress Joséphine was born on the island."}},"ms":{"flag":{"t":"British Blue Ensign with a shield of a woman holding a cross and a harp. Irish heritage — the harp.","f":"The badge shows Erin, the woman symbolising Ireland, with a harp — Montserrat was settled by Irish Catholics in the 1600s."},"map":{"t":"Tiny Leeward island southwest of Antigua, half buried by its volcano.","f":"The Soufrière Hills volcano buried the capital Plymouth in 1997; two-thirds of the population left, and the south is still an exclusion zone."},"capital":{"t":"Brades (de facto) — Plymouth was abandoned.","f":"Plymouth is a ghost town under volcanic ash but remains the legal capital; the government works from Brades in the north."}},"mx":{"flag":{"t":["Green-white-red vertical with an eagle on a cactus eating a snake. Italy's colours with the Aztec eagle.","MEXICO: Italy's flag with an eagle on a cactus in the middle."],"f":"The eagle on a cactus eating a snake is the Aztec sign for where to found Tenochtitlan — now Mexico City."},"map":{"t":"Below the US, tapering down to Central America.","f":"Mexico has 68 official languages and the largest Spanish-speaking population in the world; chocolate, vanilla and tomatoes all originated here."},"capital":{"t":"Mexico City.","f":"Mexico City is built on a drained lake and is sinking about 50 cm a year in places; it was the largest city in the Americas before Columbus arrived."},"currency":{"t":"PESO — 'weight' in Spanish; Mexico, Argentina, Chile, Colombia, Cuba, Dominican Republic, Uruguay, Philippines all use pesos."},"language":{"t":"SPANISH — the world's largest Spanish-speaking country; 68 indigenous languages are also recognised."}},"ni":{"flag":{"t":["Blue-white-blue horizontal with a triangle emblem in the middle. Like El Salvador and Honduras; Nicaragua's has a rainbow in the triangle.","Nica-RA-gua: a RAinbow in the emblem — the only Central American flag with purple."],"f":"The triangle emblem shows five volcanoes between two seas and a rainbow; Nicaragua's is one of the few flags with purple (in the rainbow)."},"map":{"t":"Central America's biggest, with two huge lakes, between Honduras and Costa Rica.","f":"Lake Nicaragua has freshwater sharks; the country was a serious rival to Panama for the canal, and a Chinese-backed canal plan fizzled in the 2010s."},"capital":{"t":["Managua — 'MAN-AH-GWA': man on the lake.","NICK's CAR takes on AGUA; a MAN bails the AGUA — Managua, Nicaragua."],"f":"Managua's centre was never rebuilt after the 1972 earthquake; the city sprawls without a real downtown."}},"pa":{"flag":{"t":["Four quarters: white with blue star, red, blue, white with red star. The quartered flag.","PANAMA: four quarters, two stars — blue star top-left, red star bottom-right."],"f":"The quarters were meant to balance the two parties, Liberals (red) and Conservatives (blue); adopted at independence from Colombia in 1903."},"map":{"t":"The S-shaped isthmus joining Central and South America.","f":"The Darién Gap is the only break in the Pan-American Highway; Panama is the only place you can see the sun rise over the Pacific and set over the Atlantic."},"capital":{"t":["Panama City.","PAN O' MY rice, PAN O' MY rice — Panama, Panama City."],"f":"Panama City has the oldest European settlement on the Pacific coast of the Americas (1519), and the Canal handed over from the US in 1999."},"currency":{"t":"BALBOA — Panama's balboa (named after the explorer) exists only as coins; notes are US dollars."}},"pr":{"flag":{"t":["Red and white stripes with a blue hoist triangle and white star. Cuba swapped: Puerto Rico = red stripes, blue triangle.","PUERTO RICO: hot red stripes, blue triangle — Cuba swapped."],"f":"Same design as Cuba's with the colours swapped; the flag was illegal to display in Puerto Rico from 1948 to 1957."},"map":{"t":"East of the Dominican Republic.","f":"Puerto Rico is a US territory; islanders are US citizens but can't vote for president. The Arecibo radio telescope was here until it collapsed in 2020."},"capital":{"t":"San Juan.","f":"San Juan's El Morro fortress has guarded the harbour since 1539; it's the second-oldest European city in the Americas."}},"sv":{"flag":{"t":"Blue-white-blue horizontal with a coat of arms of a triangle and 'REPUBLICA DE EL SALVADOR' text. The one with writing.","f":"The emblem's five volcanoes stand for the five Central American states; the motto 'Dios, Unión, Libertad'."},"map":{"t":"Central America's smallest, Pacific coast only, below Guatemala and Honduras.","f":"The smallest and most densely populated country in Central America, and the only one without a Caribbean coast; it made Bitcoin legal tender in 2021."},"capital":{"t":"San Salvador — the country name plus San.","f":"San Salvador has been destroyed by earthquakes many times; the volcano looming over it last erupted in 1917."},"currency":{"t":"US DOLLAR — El Salvador switched from the colón in 2001 and made Bitcoin legal tender in 2021 (then dropped it)."}},"tc":{"flag":{"t":"British Blue Ensign with a shield of a conch shell, lobster and cactus. The conch shell.","f":"The badge shows a conch, a lobster and a cactus; a Victorian engraver reportedly mistook the salt piles on the original design for igloos and added doors."},"map":{"t":"Southeast of the Bahamas, north of Hispaniola.","f":"The Turks and Caicos are geographically part of the Bahamas chain; the salt trade made them valuable for centuries."},"capital":{"t":"Cockburn Town.","f":"Cockburn Town on Grand Turk is where some believe Columbus first landed; John Glenn splashed down nearby in 1962."}},"tt":{"flag":{"t":["Red with a black diagonal stripe edged in white, from top-left to bottom-right. The red diagonal flag.","TRINIDAD & TOBAGO: red with one black diagonal edged in white."],"f":"The diagonal black stripe with white edges; the country lies at the mouth of Venezuela's Orinoco."},"map":{"t":"Two islands just off Venezuela's northeast.","f":"Trinidad is just 11 km from Venezuela and geologically part of South America; the steelpan drum was invented here."},"capital":{"t":["Port of Spain — Spain's old port in the New World.","The TRINITY on a TOBOGGAN into a PORTAL, SPINNING — Port of Spain, Trinidad & Tobago."],"f":"Port of Spain hosts one of the biggest Carnivals in the world, and the Queen's Park Savannah is one of the largest roundabouts."}},"us":{"flag":{"t":["Stars and stripes. Liberia and Malaysia copy the layout.","USA: 13 stripes, 50 stars."],"f":"The current 50-star flag was designed by a 17-year-old, Robert Heft, as a school project in 1958 — he got a B minus, raised to an A when Congress adopted it."},"map":{"t":"Between Canada and Mexico, plus Alaska and Hawaii.","f":"The US is the third-largest country and has 50 states; Alaska is the largest and Rhode Island the smallest."},"capital":{"t":["Washington D.C.","Wearing the flag because you're WASHING A TON of clothes — Washington."],"f":"Washington D.C. is not in any state; residents got the presidential vote only in 1961 and still have no voting member of Congress."},"currency":{"t":"DOLLAR — from the Bohemian 'thaler', a silver coin from Joachimsthal."}},"vc":{"flag":{"t":"Blue-yellow-green vertical (wide yellow) with three green diamonds in a V. The 'gems of the Antilles' — V for Vincent.","f":"The three green diamonds form a V for Vincent; islanders call it 'the gems'."},"map":{"t":"Windwards, between St Lucia and Grenada, plus the Grenadines chain.","f":"The Grenadines are 32 islands stretching toward Grenada; the Pirates of the Caribbean films were shot here."},"capital":{"t":"Kingstown — (Jamaica's is Kingston, no W).","f":"Kingstown has the oldest botanic garden in the western hemisphere (1765), with a breadfruit tree grown from one Captain Bligh brought."}},"vg":{"flag":{"t":"British Blue Ensign with a shield of a woman holding lamps. St Ursula and her virgins — 'Virgin' Islands.","f":"The badge shows St Ursula with lamps — Columbus named the islands after her 11,000 virgins."},"map":{"t":"East of Puerto Rico, the British half of the Virgins.","f":"The British Virgin Islands are about 60 islands next to the US Virgin Islands; Richard Branson owns Necker Island here."},"capital":{"t":"Road Town.","f":"Road Town on Tortola is the capital and the base of the BVI's huge offshore company registry."}},"vi":{"flag":{"t":["White with a US eagle between the letters V and I. Letters on the flag.","US VIRGIN ISLANDS: a US eagle between a blue V and a blue I."],"f":"A simplified US eagle between the letters V and I; the eagle holds three arrows for the three main islands."},"map":{"t":"East of Puerto Rico, the US half of the Virgins.","f":"The US bought the islands from Denmark in 1917 for $25 million, worried Germany would seize them in WWI; they drive on the left."},"capital":{"t":"Charlotte Amalie.","f":"Charlotte Amalie, named after a Danish queen, is on St Thomas and is one of the busiest cruise ports in the Caribbean."}},"bl":{"flag":{"t":["France's tricolour.","ST BARTHÉLEMY: flies the French tricolour."],"f":"St Barthélemy uses the French flag; its arms show three fleurs-de-lis, a Maltese cross and three crowns for its Swedish period."},"map":{"t":"Tiny island near St Martin.","f":"St Barts was Swedish from 1784 to 1878, hence the capital's name; it's now a playground for the very rich."},"capital":{"t":"Gustavia.","f":"Gustavia is named after King Gustav III of Sweden; the harbour fills with superyachts at New Year."}},"mf":{"flag":{"t":["France's tricolour.","ST MARTIN: flies the French tricolour."],"f":"The French side of St Martin uses the French tricolour; the island's own unofficial flag shows a sun and hills."},"map":{"t":"The French north half of St Martin.","f":"The smallest inhabited island split between two countries, France and the Netherlands, since 1648."},"capital":{"t":"Marigot.","f":"Marigot is the capital of the French half; the Dutch half's Philipsburg is only a few kilometres away."}},"sx":{"flag":{"t":["Red over blue with a white hoist triangle and coat of arms. Philippines-style triangle.","SINT MAARTEN: red over blue with a white triangle at the pole — the Philippines layout."],"f":"Sint Maarten's flag shows the courthouse and a pelican, in the Philippine-style red-white-blue triangle layout."},"map":{"t":"The Dutch south half of St Martin.","f":"The Dutch half of St Martin; planes landing at Princess Juliana airport pass metres above Maho Beach."},"capital":{"t":"Philipsburg.","f":"Philipsburg was founded in 1763 by a Scottish captain in the Dutch navy, John Philips."}},"gp":{"flag":{"t":["France's tricolour.","GUADELOUPE: flies the French tricolour."],"f":"Guadeloupe uses the French flag; an unofficial local flag shows a sun and sugar cane on black."},"map":{"t":"Butterfly-shaped island in the Leewards, north of Dominica.","f":"Guadeloupe is butterfly-shaped, two islands joined by a mangrove channel; it's a full French department, so it's in the EU."},"capital":{"t":"Basse-Terre.","f":"Basse-Terre is the administrative capital; Pointe-à-Pitre is the larger commercial town."}},"pm":{"flag":{"t":["France's tricolour (official).","ST PIERRE & MIQUELON: flies the French tricolour."],"f":"The unofficial flag shows the ship Grande Hermine, which carried Cartier here in 1536, with Basque, Breton and Norman emblems."},"map":{"t":"Tiny French islands just off Newfoundland.","f":"The last French territory in North America, 25 km off Newfoundland; Al Capone allegedly ran rum through here during Prohibition."},"capital":{"t":"Saint-Pierre.","f":"Saint-Pierre is the only place in North America where the guillotine was used, in 1889."}},"ar":{"flag":{"t":"Light blue-white-light blue horizontal with a golden Sun of May in the centre. Sun on the sky-blue.","f":"The Sun of May was added in 1818; the light blue is said to come from the sky Manuel Belgrano saw when he created the flag in 1812."},"map":{"t":"The long triangle down the east side of the southern cone.","f":"Argentina's Aconcagua is the highest peak outside Asia, and Ushuaia is the world's southernmost city."},"capital":{"t":["Buenos Aires — 'good airs'.","ARGE and TINA go for a walk in the 'good air' — Buenos Aires means good airs."],"f":"Buenos Aires has more bookshops per person than any other city and the widest avenue in the world, 9 de Julio."},"language":{"t":"SPANISH — with an Italian-sounding accent; the 'll' is pronounced 'sh' in Buenos Aires."}},"bo":{"flag":{"t":["Red-yellow-green horizontal (state flag has a crest). Ghana without the star; Bolivia = red on top like blood on the mountains.","BOLIVIA: red-yellow-green — Lithuania (yellow-green-red) shuffled so red is on top."],"f":"Red for bravery, yellow for mineral wealth, green for fertility; Bolivia also flies the rainbow Wiphala as a second national flag."},"map":{"t":"Landlocked in the middle of South America, west of Brazil.","f":"Bolivia has been landlocked since losing its coast to Chile in 1879; Lake Titicaca is the highest navigable lake in the world."},"capital":{"t":["Sucre (constitutional) — La Paz is the seat of government; both accepted. 'SUGAR' = Sucre.","A BOWL of SUGAR — Bolivia, Sucre (sucre is French for sugar)."],"f":"Sucre is the constitutional capital; La Paz, the seat of government, is the highest administrative capital in the world at about 3,650 m."},"currency":{"t":"BOLIVIANO — the currency is just the country's adjective."},"language":{"t":"QUECHUA, AYMARA — Bolivia recognises 37 official languages; Quechua is the Inca language, Aymara the Altiplano one."}},"br":{"flag":{"t":"Green with a yellow diamond and a blue globe of stars with a banner. The globe-and-diamond.","f":"The 27 stars show the sky over Rio on the night the republic was declared (15 Nov 1889), one per state; the motto reads 'Order and Progress'."},"map":{"t":"Half of South America, the big eastern bulge.","f":"Brazil borders every South American country except Chile and Ecuador, and holds about 60% of the Amazon rainforest."},"capital":{"t":["Brasília — not Rio! The planned capital of 1960.","A BRA that's SILLY — Brasília."],"f":"Brasília was built in 41 months and inaugurated in 1960; from the air it's shaped like an aeroplane or a bird."},"currency":{"t":"REAL — Brazil's real is 'royal' in Portuguese; pronounced 'hay-AL'."},"language":{"t":"PORTUGUESE — the only Portuguese-speaking country in South America; more Portuguese speakers than Portugal by a factor of 20."}},"cl":{"flag":{"t":["White over red with a blue canton holding a white star. Texas's flag but the blue is only in the corner.","CHILE: one star in a blue square. Texas's blue runs the full height; Chile's stops halfway."],"f":"The 'Lone Star' flag dates from 1817; Texas's is very similar but with the blue running the full height."},"map":{"t":"The long thin strip down the Pacific coast, west of Argentina.","f":"Chile is about 4,300 km long and averages 180 km wide; the Atacama is the driest desert on Earth."},"capital":{"t":["Santiago — 'SANTI-AGO': Chile's Santiago.","Santa lives somewhere CHILLY — Santiago."],"f":"Santiago sits in a bowl between the Andes and the coastal range; the tallest building in Latin America is here."},"language":{"t":"SPANISH — Chilean Spanish is famously fast and drops its s's."}},"co":{"flag":{"t":["Yellow-blue-red horizontal with a wide yellow top. Yellow gold, blue seas, red blood — plain, no crest.","COLOMBIA: a double-width yellow band over blue and red, plain."],"f":"The yellow takes half the flag for gold and the sun; Venezuela and Ecuador share the design from Gran Colombia."},"map":{"t":"Northwest corner of South America, touching both oceans.","f":"Colombia is the only South American country with both Pacific and Caribbean coasts; it has more bird species than any other country."},"capital":{"t":["Bogotá — 'BOGOTA': bogged in the Andes.","COLUMN B is for BUG — Bogotá."],"f":"Bogotá is 2,640 m up in the Andes; its 'Ciclovía' closes 120 km of roads to cars every Sunday."}},"ec":{"flag":{"t":["Yellow-blue-red horizontal (wide yellow) with a coat of arms in the centre. Colombia with a crest; Venezuela has stars.","ECUADOR: Colombia's flag with a coat of arms."],"f":"The condor on the arms spreads its wings over Mount Chimborazo; the flag differs from Colombia's only by the coat of arms."},"map":{"t":"On the equator, between Colombia and Peru; owns the Galápagos.","f":"The summit of Chimborazo is the farthest point from the Earth's centre, because of the equatorial bulge; the Galápagos are Ecuadorian."},"capital":{"t":["Quito — 'KEY-TOE': the key to the equator.","You need a KEY TO open the EQUATOR DOOR — Quito."],"f":"Quito is the closest capital to the equator and the second-highest, at 2,850 m; its old town was the first UNESCO World Heritage city (with Kraków)."},"currency":{"t":"US DOLLAR — Ecuador adopted the US dollar in 2000 after its sucre collapsed; El Salvador (2001) and Panama (since 1904) also use it."}},"fk":{"flag":{"t":["British Blue Ensign with a shield of a ram and a ship. Sheep islands.","FALK-lands: a FLOCK — a sheep on the shield of a Blue Ensign."],"f":"The badge shows a ram (for sheep farming) and the ship Desire, whose captain sighted the islands in 1592."},"map":{"t":"Islands off Argentina's southern tip.","f":"The Falklands, 500 km off Argentina, have about 3,500 people and half a million sheep; the 1982 war lasted 74 days."},"capital":{"t":"Stanley.","f":"Stanley is the southernmost capital in the world (of any territory), and has more Land Rovers per head than anywhere."}},"gf":{"flag":{"t":["France's tricolour.","FRENCH GUIANA: flies the French tricolour."],"f":"French Guiana uses the French flag; an unofficial green-and-yellow flag with a star is used locally."},"map":{"t":"French territory on South America's north coast, east of Suriname.","f":"It's part of France, so the EU's longest border is with Brazil; the Guiana Space Centre at Kourou launches Ariane rockets."},"capital":{"t":"Cayenne — cayenne pepper.","f":"Cayenne gave its name to cayenne pepper; the Devil's Island penal colony (of 'Papillon') was just offshore."}},"gy":{"flag":{"t":["Green with a red triangle inside a yellow arrow from the hoist. The Golden Arrowhead.","GUYANA: a golden arrowhead with a red one inside on green."],"f":"'The Golden Arrowhead', designed by the American vexillologist Whitney Smith in 1966."},"map":{"t":"North coast of South America, between Venezuela and Suriname.","f":"The only English-speaking country in South America; Kaieteur Falls is about four times higher than Niagara."},"capital":{"t":["Georgetown — one word (Cayman's is two).","A GUY named ANA who used to be GEORGE — Georgetown, Guyana."],"f":"Georgetown lies below sea level behind a seawall; St George's Cathedral is one of the tallest wooden buildings in the world."},"language":{"t":"ENGLISH — the only English-speaking country in South America."}},"pe":{"flag":{"t":["Red-white-red vertical. Austria on its side; the state flag has a crest.","PERU: red-white-red vertical — Canada without the leaf, or Austria stood on end."],"f":"The red and white legend: liberator José de San Martín saw flamingos take off with red wings and white breasts."},"map":{"t":"Pacific coast below Ecuador, west of Brazil and Bolivia.","f":"Peru has Machu Picchu, the Nazca Lines and the source of the Amazon; the potato was domesticated here."},"capital":{"t":["Lima — 'LEE-ma' beans.","Cut open a PEAR-OOO and find LIMA beans — Lima, Peru."],"f":"Lima almost never rains — under 10 mm a year — but is grey and damp with fog for much of the year."},"currency":{"t":"SOL — Peru's sol means 'sun', for the Inca sun god."},"language":{"t":"QUECHUA and SPANISH — Quechua, the Inca language, is still spoken by millions in the Andes."}},"py":{"flag":{"t":"Red-white-blue horizontal with a different emblem on each side — the only two-sided national flag.","f":"The only national flag with different emblems on each side: the arms on the front, the Treasury seal with a lion on the back."},"map":{"t":"Landlocked between Bolivia, Brazil and Argentina.","f":"Paraguay lost about half its population in the 1864–70 war against Brazil, Argentina and Uruguay; the Guaraní language is official alongside Spanish."},"capital":{"t":["Asunción — 'a SUN shone' on Asunción.","A PAIR O' GUYS holding A SUN by the SEA — Asunción, Paraguay."],"f":"Asunción is one of the oldest cities in South America (1537) and the 'Mother of Cities' from which others were founded."},"currency":{"t":"GUARANÍ — Paraguay's currency is named after its indigenous people and language."},"language":{"t":"GUARANÍ — the only country in the Americas where an indigenous language is spoken by most of the population."}},"sr":{"flag":{"t":"Green-white-red-white-green horizontal (wide red) with a yellow star. Red middle with a star — Suriname.","f":"The star stands for the unity of the ethnic groups; adopted at independence from the Netherlands in 1975."},"map":{"t":"Between Guyana and French Guiana on the north coast.","f":"The smallest country in South America and the only Dutch-speaking one; over 90% is rainforest."},"capital":{"t":["Paramaribo — 'PARA-MARIBO': para(chute) into Paramaribo.","SURI is my NAME, in a PAIR OF MARY BOWS — Paramaribo, Suriname."],"f":"Paramaribo's wooden Dutch colonial centre is a UNESCO site; a mosque and a synagogue stand next door to each other."},"language":{"t":"DUTCH — the only Dutch-speaking country in South America, a Dutch colony until 1975."}},"uy":{"flag":{"t":["Nine blue and white stripes with a Sun of May in the canton. Argentina's sun on Greece's stripes.","URUGUAY: Greece's stripes with Argentina's sun in the corner."],"f":"Nine stripes for the nine original departments; the Sun of May shares its face with Argentina's flag."},"map":{"t":"Small wedge between Argentina and Brazil on the Atlantic.","f":"Uruguay is the second-smallest South American country and has more cattle than people, about four to one."},"capital":{"t":["Montevideo — 'MONTY VIDEO'.","'YOU'RE A GUY! I just want to MOUNT A VIDEO' — Montevideo, Uruguay."],"f":"Montevideo hosted the first football World Cup in 1930, which Uruguay won; the name may come from a sailor's log, 'Monte VI de E a O'."}},"ve":{"flag":{"t":"Yellow-blue-red horizontal (equal stripes) with an arc of eight white stars. Stars in an arc.","f":"The eighth star was added by Hugo Chávez in 2006 for the province of Guayana, fulfilling a wish of Simón Bolívar."},"map":{"t":"North coast of South America, east of Colombia.","f":"Angel Falls, the world's highest waterfall at 979 m, is in Venezuela; the country has the largest proven oil reserves."},"capital":{"t":["Caracas — 'CAR-ACKS-AS'.","WHEN YOU SWELL-A, wear CROCS — Caracas, Venezuela."],"f":"Caracas sits in a valley behind the Ávila mountain, a 20-minute cable-car ride from the Caribbean but hidden from it."},"currency":{"t":"BOLÍVAR — named after Simón Bolívar, who also named Bolivia; 'soberano' (sovereign) was added in 2018 after redenomination."},"language":{"t":"SPANISH — Venezuela; 'venezuela' means 'little Venice', named by explorers who saw stilt houses."}},"au":{"flag":{"t":["Blue Ensign with the Union Jack, a big seven-point Commonwealth Star and the Southern Cross in white. Bigger country, more (white) stars than New Zealand.","AUSTRALIA: six white stars. New Zealand: four red stars. More stars, more country.","Union Jack family in the Pacific: Australia (six white stars), New Zealand (four red stars), Fiji (light blue with a shield), Tuvalu (nine yellow stars)."],"f":"The big seven-pointed star is the Commonwealth Star: six points for the states, one for the territories."},"map":{"t":"The island continent.","f":"Australia is the only country that is also a continent; it's wider than the Moon."},"capital":{"t":["Canberra — not Sydney! CAN-BEAR-a: the compromise capital between Sydney and Melbourne.","A koala breaks into a trailer and eats a CAN of BERRIES — Canberra."],"f":"Canberra was built as a compromise because Sydney and Melbourne both wanted to be capital; the name likely means 'meeting place'."}},"nz":{"flag":{"t":"Blue Ensign with the Union Jack and four red stars (Southern Cross). Fewer stars, and they're red — New Zealand.","f":"A 2016 referendum to replace the flag (with a silver fern design) failed; New Zealand kept the Union Jack and four stars."},"map":{"t":"Two long islands southeast of Australia.","f":"New Zealand has more sheep than people (about five to one) and was the last major landmass settled by humans, around 1300."},"capital":{"t":["Wellington — not Auckland! Wellington boots at the windy bottom of the North Island.","A NEWSIE throws the paper straight into a WELL — Wellington, New Zealand."],"f":"Wellington is the world's southernmost capital and one of the windiest cities."},"language":{"t":"MĀORI — official since 1987, along with English and NZ Sign Language."}},"fj":{"flag":{"t":["Light blue with the Union Jack and a shield holding sugar cane, coconut, bananas and a dove. Light blue = Pacific.","FIJI: Union Jack on LIGHT blue — the Pacific one — with a shield."],"f":"Fiji planned to drop the Union Jack in 2015 but abandoned the idea; the shield includes sugar cane, a coconut palm, a dove and bananas."},"map":{"t":"Islands east of Vanuatu, on the 180° line.","f":"The 180th meridian passes through Fiji, so it was for a time the first place to see the new day."},"capital":{"t":["Suva — 'SOO-va': Suva on Viti Levu.","VEGGIE soup will SOOTHE YA — Suva, Fiji."],"f":"Suva is on Viti Levu; Fiji's rugby sevens team won the country's first Olympic medal, gold, in 2016."},"language":{"t":"FIJIAN, FIJI HINDI — about a third of Fijians descend from Indian indentured labourers."}},"pg":{"flag":{"t":["Diagonal split: black with the Southern Cross (bottom-left) and red with a yellow bird of paradise (top-right). The bird of paradise.","PAPUA NEW GUINEA: a bird of paradise on red, the Southern Cross on black, split diagonally."],"f":"The bird of paradise and Southern Cross; designed by a 15-year-old schoolgirl, Susan Karike, in 1971."},"map":{"t":"Eastern half of New Guinea, just north of Australia.","f":"Papua New Guinea has over 800 languages, more than any other country, and shares New Guinea with Indonesia."},"capital":{"t":["Port Moresby — 'PORT MORES-BEE'.","PAPA's NEW GUINEA pig says POUR MORE SPEEDILY — Port Moresby."],"f":"Port Moresby has no road links to most of the country; you fly to reach other major towns."},"currency":{"t":"KINA — Papua New Guinea's kina is named after the kina shell, once used as money; the coin is the toea."},"language":{"t":"TOK PISIN — a creole; PNG has over 800 languages, more than any other country."}},"sb":{"flag":{"t":"Blue and green split by a thin yellow diagonal, five white stars in the corner. Five stars = five main island groups.","f":"The five stars stand for the five original provinces; the diagonal yellow band is sunshine."},"map":{"t":"Island chain east of Papua New Guinea.","f":"Guadalcanal, scene of a decisive WWII battle, is the largest island; the country has almost 1,000 islands."},"capital":{"t":["Honiara — 'HONEY-ARA': honey on Guadalcanal.","A creepy SOLO MAN: 'HONEY, ARE YA…' — Honiara, Solomon Islands."],"f":"Honiara was built around the US wartime airfield, Henderson Field, after the old capital Tulagi was destroyed."}},"vu":{"flag":{"t":["Red over green with a black hoist triangle and a yellow Y with a boar's tusk. The Y flag.","VANUATU: a yellow Y running from the pole on red over green.","Vanuatu doesn't belong to any family, which is why it's hard: a boar's tusk with two fern fronds on a yellow Y — the tusk stands for prosperity."],"f":"The Y-shape shows the islands' layout; the boar's tusk is wealth and the fern fronds are peace."},"map":{"t":"Islands between Solomons and Fiji.","f":"Vanuatu's Pentecost Island is where land-diving with vines started — the inspiration for bungee jumping."},"capital":{"t":["Port Vila — 'VILLA' by the port.","VANNA, YOU OUGHT TO use this BOARD of FILA shoes — Port Vila, Vanuatu."],"f":"Port Vila is on Efate; Vanuatu was jointly run by Britain and France as the New Hebrides until 1980, with two of everything."},"currency":{"t":"VATU — Vanuatu's currency is the vatu: the name is in the country's name."},"language":{"t":"BISLAMA — an English-based creole ('by-and-by language'); official with English and French."}},"ws":{"flag":{"t":["Red with a blue canton holding the Southern Cross in white. Red field — Samoa.","SAMOA: the SAME corner as Australia (Southern Cross in blue) but on red."],"f":"The Southern Cross with a small fifth star; the flag dates from 1948, before independence in 1962."},"map":{"t":"Islands in the middle of the Pacific, north of Tonga.","f":"Samoa jumped the date line in 2011, skipping 30 December to be on the same side as Australia and New Zealand."},"capital":{"t":["Apia — 'AH-pee-a': Apia, Samoa.","A SAMOA-eating APE — Apia, Samoa."],"f":"Apia is where Robert Louis Stevenson spent his last years; his home is now a museum."},"currency":{"t":"TĀLĀ — Samoa's tālā is 'dollar' said with a Samoan accent; the cent is the sene."},"language":{"t":"SAMOAN — a Polynesian language; 'talofa' is hello."}},"to":{"flag":{"t":"Red with a white canton holding a red cross. The Red Cross in the corner.","f":"The red cross on white recalls the Kingdom's Christianity; Tonga is the only Pacific nation never colonised."},"map":{"t":"Islands south of Samoa, east of Fiji.","f":"Tonga's 170 islands stretch 800 km; the 2022 Hunga Tonga eruption was the largest recorded by modern instruments."},"capital":{"t":["Nuku'alofa — 'NUKU-a-LOAF-a': a loaf in Nuku'alofa.","Use TONGS after you NUKE A LOAF — Nukuʻalofa, Tonga."],"f":"Nuku'alofa's royal palace, a wooden Victorian building, has housed the Tongan kings since 1867."},"currency":{"t":"PAʻANGA — Tonga's paʻanga is named after a bean-like seed once used as money."},"language":{"t":"TONGAN — Polynesian; the country's name means 'south'."}},"ki":{"flag":{"t":"Red over six wavy blue-and-white stripes with a gold frigatebird flying over a rising sun. Bird over sunrise over waves.","f":"The frigatebird flies over a rising sun and 17 rays for the 16 Gilbert Islands plus Banaba."},"map":{"t":"Scattered atolls straddling the equator and the date line.","f":"Kiribati straddles both the equator and the 180th meridian, spanning all four hemispheres; it's the first country to see each new year."},"capital":{"t":["South Tarawa — 'TA-RA-WA'.","CARRY A BAT and sock the TAR AWAY — Tarawa, Kiribati."],"f":"South Tarawa is a chain of islets so crowded that its density rivals Hong Kong's, all on land a few metres above the sea."}},"tv":{"flag":{"t":["Light blue with the Union Jack and nine yellow stars laid out like the islands. Nine stars = nine atolls (name means 'eight standing').","TUVALU: nine stars for nine atolls, Union Jack on light blue like Fiji but with no shield."],"f":"The nine stars stand for the nine atolls (the name means 'eight standing together', from when one was uninhabited)."},"map":{"t":"Tiny atolls between Kiribati and Fiji.","f":"Tuvalu is the fourth-smallest country and earns real money licensing its internet domain, .tv."},"capital":{"t":["Funafuti — 'FUNNY-FOOTY'.","A TRUE VALUE FUNFETTI cake — Funafuti, Tuvalu."],"f":"Funafuti's airport runway doubles as a playing field and a place to sleep on hot nights when no planes are due."}},"nr":{"flag":{"t":["Blue with a thin yellow horizontal line (the equator) and a white 12-point star just below it. Nauru just below the equator.","NAURU: a star just BELOW a yellow line — the island sits just below the equator."],"f":"The star sits just below the yellow line, showing Nauru's position just south of the equator; its 12 points are the 12 tribes."},"map":{"t":"A single tiny island east of Papua New Guinea, just below the equator.","f":"Nauru is the smallest island country and was once, through phosphate mining, one of the richest per head — now mostly mined out."},"capital":{"t":["Yaren (de facto) — no official capital.","NARUTO shows off a YARN trick — Yaren, Nauru."],"f":"Nauru has no official capital; Yaren is the district where parliament sits."}},"mh":{"flag":{"t":["Blue with an orange-and-white diagonal band widening to the top-right and a 24-point star. Sunrise diagonal.","MARSHALL ISLANDS: orange and white rays widening upward on blue."],"f":"The orange and white rays widen as they rise, for growth; the star's 24 points are the electoral districts."},"map":{"t":"Atolls north of Kiribati, east of Micronesia.","f":"Bikini Atoll was the site of 23 US nuclear tests between 1946 and 1958, and the bikini swimsuit was named after it."},"capital":{"t":["Majuro — 'MA-JOO-RO'.","Where MARSHA LANDS there's a MAJOR O — Majuro, Marshall Islands."],"f":"Majuro is an atoll; a road runs about 50 km along a strip of land rarely more than a few hundred metres wide."}},"fm":{"flag":{"t":["Light blue with four white stars in a diamond. Four stars = four states.","MICRO-nesia: four MICRO white stars on blue."],"f":"Four stars for the four states — Yap, Chuuk, Pohnpei and Kosrae — on UN blue."},"map":{"t":"Island states across the western Pacific, north of Papua New Guinea.","f":"Yap is famous for its giant stone money, discs up to 4 m across; Chuuk lagoon has a fleet of sunken Japanese WWII ships."},"capital":{"t":["Palikir — 'PAL-ee-KEER': a pal in Palikir.","MICRO KNEES? PAUL CURES them — Palikir, Micronesia."],"f":"Palikir was built as a new capital in 1989 on Pohnpei, near the ancient stone city of Nan Madol."}},"pw":{"flag":{"t":"Light blue with a yellow disc offset toward the hoist. A full moon over the ocean (not Japan's sun).","f":"The yellow disc is the full moon, set off-centre like Bangladesh's — the best time for fishing and planting."},"map":{"t":"Westernmost Pacific islands, east of the Philippines.","f":"Palau created the world's first shark sanctuary and has a lake full of stingless jellyfish."},"capital":{"t":["Ngerulmud — 'ng-er-ROOL-mud': the least-populated capital on Earth.","PAUL is LOUD: NO RULE MOOD — Ngerulmud, Palau."],"f":"Ngerulmud, on Babeldaob, replaced Koror as capital in 2006 and has a domed capitol modelled on Washington's."}},"as":{"flag":{"t":"Blue with a white triangle edged in red pointing to the hoist, holding a bald eagle with fly-whisk and war club. US eagle in a triangle.","f":"The bald eagle holds a Samoan fly whisk and war club, symbols of authority; adopted 1960."},"map":{"t":"East of Samoa.","f":"American Samoa is the only US territory south of the equator; people born there are US 'nationals', not citizens."},"capital":{"t":"Pago Pago — 'PANGO PANGO'.","f":"Pago Pago (pronounced 'pango pango') has one of the best natural harbours in the Pacific, a drowned volcanic crater."}},"ck":{"flag":{"t":["Blue Ensign with a ring of 15 white stars. Fifteen islands in a circle.","COOK ISLANDS: Union Jack with a ring of 15 stars."],"f":"The 15 stars in a ring are the 15 islands; the country is self-governing in free association with New Zealand."},"map":{"t":"Islands between Tonga and French Polynesia, associated with NZ.","f":"Named after Captain Cook, who sighted them in the 1770s; Cook Islanders are New Zealand citizens."},"capital":{"t":"Avarua.","f":"Avarua is on Rarotonga, a round island with a single ring road; the bus runs 'clockwise' and 'anticlockwise'."}},"nu":{"flag":{"t":["Yellow with the Union Jack in the canton, with stars. The yellow ensign.","NIUE: a YELLOW flag with a Union Jack corner."],"f":"One of the few yellow national flags; the Union Jack has stars on it for the link to New Zealand."},"map":{"t":"A single island east of Tonga, associated with NZ.","f":"Niue is one of the largest raised coral islands in the world and has one of the smallest populations of any self-governing state, about 1,600."},"capital":{"t":"Alofi.","f":"Alofi was hit by Cyclone Heta in 2004, which destroyed much of the town, including the hospital."}},"nf":{"flag":{"t":["Green-white-green vertical with a Norfolk Island pine in the middle. Pine tree flag.","NORFOLK ISLAND: Nigeria's green-white-green with a pine tree in the middle."],"f":"The Norfolk Island pine is on the flag; the tree is native only here and to nearby islands."},"map":{"t":"Between Australia and New Zealand.","f":"Norfolk Island was settled by descendants of the Bounty mutineers, moved here from Pitcairn in 1856."},"capital":{"t":"Kingston.","f":"Kingston's Georgian buildings are the remains of one of the harshest penal colonies in the British Empire."}},"nc":{"flag":{"t":["France's tricolour and the Kanak flag (blue-red-green with a yellow disc and totem) both official.","NEW CALEDONIA: the French flag, plus the Kanak flag with a black rooftop spear on a yellow disc."],"f":"New Caledonia flies both the French flag and the Kanak flag with a flèche faîtière (a carved rooftop spear) on a black disc."},"map":{"t":"Island east of Australia, south of Vanuatu.","f":"The world's largest lagoon and second-largest barrier reef surround the main island; three independence referendums (2018–21) all narrowly kept France."},"capital":{"t":"Nouméa — 'NEW-MAY-a'.","f":"Nouméa is called the 'Paris of the Pacific'; its Tjibaou Cultural Centre was designed by Renzo Piano."}},"pf":{"flag":{"t":"Red-white-red horizontal with an emblem of a canoe under a sun. The canoe flag.","f":"The emblem shows an outrigger canoe under a sun with ten rays; the canoe's five figures are the five archipelagos."},"map":{"t":"Tahiti and islands in the eastern Pacific.","f":"French Polynesia's 118 islands are spread over an area the size of Europe; Tahiti is the biggest, Bora Bora the most famous."},"capital":{"t":"Papeete — 'PAP-eh-EH-tay'.","f":"Papeete is on Tahiti; Gauguin lived nearby and the Bounty crew's stay here in 1788 helped trigger the mutiny."}},"wf":{"flag":{"t":["France's tricolour.","WALLIS & FUTUNA: flies the French tricolour."],"f":"The unofficial flag shows a Maltese-style cross of four triangles; Wallis and Futuna still have three traditional kings."},"map":{"t":"Between Fiji and Samoa.","f":"The two islands are 230 km apart, with three kingdoms: Uvea, Sigave and Alo."},"capital":{"t":"Mata-Utu.","f":"Mata-Utu on Wallis has around 1,000 people; the territory is the least-visited French overseas territory."}},"gu":{"flag":{"t":"Dark blue with a red border and an almond-shaped emblem showing a beach and a coconut palm. Almond emblem.","f":"The almond-shaped emblem shows a proa sailing canoe off Two Lovers' Point; the red border is the blood shed in WWII."},"map":{"t":"Largest of the Marianas, west of the Marshalls.","f":"'Where America's day begins' — Guam is the westernmost US territory, and its Andersen Air Force Base is a major military hub."},"capital":{"t":"Hagåtña.","f":"Hagåtña was Agana until 1998; brown tree snakes, accidentally introduced, have wiped out most of Guam's native birds."},"language":{"t":"CHAMORRO — the indigenous language of the Marianas; Guam is a US territory."}},"mp":{"flag":{"t":["Blue with a white star over a grey latte stone, in a wreath. Star on a stone.","NORTHERN MARIANAS: a star on a grey stone inside a flower wreath."],"f":"A latte stone (an ancient Chamorro pillar) inside a flower wreath, with a star on blue; adopted 1976."},"map":{"t":"Chain north of Guam.","f":"The Marianas Trench, the deepest point on Earth at nearly 11 km, lies just east of the islands."},"capital":{"t":"Saipan.","f":"Saipan was the site of a 1944 battle in which thousands of Japanese civilians jumped from cliffs; it's now a tourist island."}},"pn":{"flag":{"t":"British Blue Ensign with a shield of an anchor and Bible. The Bounty's anchor.","f":"The shield shows the Bounty's anchor and a Bible — the mutineers' descendants still live here."},"map":{"t":"Remote islands between French Polynesia and Easter Island.","f":"Pitcairn has about 35 people, the smallest population of any jurisdiction in the world, and no airport."},"capital":{"t":"Adamstown.","f":"Adamstown is named after John Adams, the last surviving Bounty mutineer, who lived to 1829."}},"tk":{"flag":{"t":["Blue with a yellow canoe sailing toward the Southern Cross. Canoe and stars.","TOKELAU: a white canoe sailing toward four stars on blue."],"f":"A Tokelauan canoe sails toward the Southern Cross; adopted 2009 as Tokelau's own flag alongside New Zealand's."},"map":{"t":"Atolls north of Samoa, NZ territory.","f":"Tokelau is three atolls with no airport — you reach it by a 24-hour boat from Samoa — and was the first territory fully solar-powered."},"capital":{"t":"Nukunonu (rotating).","f":"Tokelau has no capital; the government rotates between the three atolls, with Nukunonu often listed."}},"us-al":{"flag":{"t":"A red X (saltire) on white — Alabama's flag looks like a red 'no' sign, the St Andrew's cross of the Confederacy.","f":"The Montgomery bus boycott began here in 1955 after Rosa Parks refused to give up her seat."},"shape":{"t":"A tall rectangle with a little foot sticking out at the bottom-left toward the Gulf — Alabama stands on one toe."},"map":{"t":"Between Mississippi and Georgia, with Florida's panhandle tucked under its foot."},"capital":{"t":["MONT-GOMERY: 'Mont' like a mountain of cotton — not Birmingham, the bigger city.","BAM! AL popped MONTY's GUM bubble — Montgomery, Alabama."]}},"us-ak":{"flag":{"t":"The Big Dipper and the North Star on dark blue — designed by a 13-year-old, Benny Benson, in 1927.","f":"Bought from Russia in 1867 for $7.2 million — about two cents an acre — mocked at the time as 'Seward's Folly'."},"shape":{"t":"A huge hunk with a long tail of islands (the Aleutians) trailing west and a panhandle down the coast — an elephant's head with a trunk."},"map":{"t":"The far north-west, hanging off Canada; Russia is only 88 km across the Bering Strait."},"capital":{"t":["JUNEAU: 'Do you know? Juneau!' — it can't be reached by road, only boat or plane.","D'YOU KNOW how cold Alaska is? — Juneau."]}},"us-az":{"flag":{"t":"A copper star under 13 red-and-gold sun rays — the copper star for the state's main metal, the rays for the original colonies.","f":"The Grand Canyon is about 446 km long and 1.8 km deep; Arizona doesn't observe daylight saving time."},"shape":{"t":"A near-square with the bottom-left corner chopped diagonally along the Colorado River."},"map":{"t":"Bottom-left of the Four Corners, above Mexico, west of New Mexico."},"capital":{"t":["PHOENIX rises from the ashes — in the hottest big city in America.","A PHOENIX rises from Arizona's blazing sun."]}},"us-ar":{"flag":{"t":"A white diamond on red with 25 stars around it — the only US state with a diamond mine.","f":"Arkansas is pronounced 'ARK-an-saw' by state law (1881); the Crater of Diamonds park lets visitors keep what they dig up."},"shape":{"t":"A rough square with the top-right corner bitten off and a wobbly right edge along the Mississippi."},"map":{"t":"West of the Mississippi river, south of Missouri, north of Louisiana."},"capital":{"t":["LITTLE ROCK: the capital is named after a small rock outcrop on the Arkansas river.","The captain of the ARK SAW the LITTLE ROCK too late — Little Rock, Arkansas."]}},"us-ca":{"flag":{"t":"A brown grizzly bear walking left, a red star, and 'California Republic' on white with a red stripe.","f":"California would be the world's fifth-largest economy on its own; it has the highest and lowest points in the contiguous US within 140 km of each other."},"shape":{"t":"A long shape running down the coast with an elbow bending inward — the curve is the Nevada border."},"map":{"t":"The whole west coast from Oregon to Mexico."},"capital":{"t":["SACRAMENTO: not LA, not San Francisco — the sleepy river town chosen in the Gold Rush.","California surfers wear SACRED MEMENTOS — Sacramento."]}},"us-co":{"flag":{"t":"A big red C with a gold ball inside on blue-white-blue stripes — C for Colorado, gold for the sun and mining.","f":"Colorado has more than 50 peaks over 14,000 ft ('fourteeners'); the whole state is above 1,000 m."},"shape":{"t":"A plain rectangle — one of the two rectangular states (with Wyoming). Colorado is the bigger one."},"map":{"t":"Top-right of the Four Corners, under Wyoming."},"capital":{"t":["DENVER: the Mile High City — exactly 5,280 feet on the capitol steps.","Stay warm in Colorado with DENSE FUR — Denver."]}},"us-ct":{"flag":{"t":"Three grapevines on a white shield on blue — 'He who transplanted still sustains'.","f":"The first written constitution in the colonies (Fundamental Orders, 1639) — hence 'the Constitution State'."},"shape":{"t":"A small rectangle with a notch at the top-right corner and a jagged bottom coast."},"map":{"t":"Between New York and Rhode Island on Long Island Sound."},"capital":{"t":["HARTFORD: home of insurance HEADQUARTERS — the 'Insurance Capital of the World'.","CONNECT the dots and CUT out the four HEARTS — Hartford, Connecticut."]}},"us-de":{"flag":{"t":"A buff (tan) diamond on colonial blue, with a farmer and a soldier on the arms; the date 'December 7, 1787' when it became the first state.","f":"First state to ratify the Constitution; more than half of US public companies are incorporated here for the friendly law."},"shape":{"t":"A tiny sliver with a perfectly round top edge — the only state border drawn with a compass (the Twelve-Mile Circle)."},"map":{"t":"The small state on the Delmarva peninsula, east of Maryland, south of Pennsylvania."},"capital":{"t":["DOVER: the first state's capital sounds like the English port — small and near the coast.","Did DELLA WEAR her DOE-FUR coat? — Dover, Delaware."]}},"us-fl":{"flag":{"t":"A red saltire (X) on white with the state seal in the middle — like Alabama's flag with a seal.","f":"Florida has the longest coastline in the contiguous US and is the only state where alligators and crocodiles both live wild."},"shape":{"t":"A peninsula hanging down into the sea, with a panhandle across the top-left — a pistol pointing west."},"map":{"t":"The far south-east, poking toward Cuba; the panhandle runs under Alabama and Georgia."},"capital":{"t":["TALLAHASSEE: 'tall-a-HASSLE' — in the panhandle, nowhere near Miami.","Sit on the FLOOR in the TALL HOUSE by the SEA — Tallahassee, Florida."]}},"us-ga":{"flag":{"t":"Three red-white-red stripes with a blue corner holding the state arms in a ring of 13 stars — it looks like the first Confederate flag.","f":"Founded in 1732 as a colony for debtors; named after King George II; peaches and Coca-Cola."},"shape":{"t":"A rough rectangle wider at the bottom, with a short Atlantic coast at the bottom-right."},"map":{"t":"Between Alabama and South Carolina, above Florida."},"capital":{"t":["ATLANTA: the big one — capital and largest city; the world's busiest airport.","Georgia sails the ATLANTIC AT sunset — Atlanta."]}},"us-hi":{"flag":{"t":"A Union Jack in the corner over eight red-white-blue stripes — the only US flag with a British flag on it.","f":"The only state made entirely of islands, the only one with a royal palace, and the only one that grows coffee commercially."},"shape":{"t":"A chain of eight islands running diagonally from north-west to south-east, the Big Island at the end."},"map":{"t":"Out in the middle of the Pacific, 3,800 km from California."},"capital":{"t":["HONOLULU on Oahu — 'Honolulu, oh how I love you'.","They HONOURED LULU with a trip to Hawaii — Honolulu."]}},"us-id":{"flag":{"t":"The state seal on blue with 'State of Idaho' beneath — a woman, a miner, and a moose.","f":"Grows about a third of America's potatoes; Hells Canyon is deeper than the Grand Canyon."},"shape":{"t":"A shape like a boot or a tall L with a thin panhandle up to Canada and a wide base."},"map":{"t":"West of Montana and Wyoming, east of Oregon and Washington; touches Canada."},"capital":{"t":["BOISE: 'BOY-see' — French for wooded, 'les bois'.","If I'D A HOE, I'd make those BOYS SEE how to weed — Boise, Idaho."]}},"us-il":{"flag":{"t":"An eagle on a rock holding a shield, on white, with 'Illinois' under it.","f":"Chicago reversed the flow of its river in 1900 to send sewage away from the lake; the first skyscraper was built there in 1885."},"shape":{"t":"A tall shape with a flat top, rounded bottom point, and a wavy left side along the Mississippi."},"map":{"t":"Between Indiana and the Mississippi river; Chicago sits at the top-right on Lake Michigan."},"capital":{"t":["SPRINGFIELD: Lincoln's home town — there are Springfields in many states; Illinois has the capital one.","ILL from the NOISE of kids on a FIELD of SPRINGS — Springfield, Illinois."]}},"us-in":{"flag":{"t":"A gold torch with 19 stars on blue — 19th state; the torch of liberty.","f":"The Indy 500 has run since 1911; 'Hoosier' is the nickname and nobody is sure where it came from."},"shape":{"t":"A tall rectangle with a wobbly bottom edge along the Ohio river and a little lake coast at the top-left."},"map":{"t":"Between Illinois and Ohio, under Michigan."},"capital":{"t":["INDIANAPOLIS: the state name plus 'polis' — the only state capital that's just the state name plus city.","Need help? Ask an INDIANA POLICE officer — Indianapolis."]}},"us-ia":{"flag":{"t":"French-style blue-white-red vertical bands with an eagle holding a ribbon in the white — for the French heritage of Louisiana Purchase land.","f":"Grows more corn than any other state; the Iowa caucuses open the presidential race."},"shape":{"t":"A rectangle with wavy sides — the Mississippi on the right and the Missouri on the left — and a little cusp at the bottom-right."},"map":{"t":"Between the Mississippi and Missouri rivers, north of Missouri, south of Minnesota."},"capital":{"t":["DES MOINES: 'duh-MOYN' — French for 'of the monks'.","Give THE COINS to my sister, because I OWE HER — Des Moines, Iowa."]}},"us-ks":{"flag":{"t":"The state seal with a sunflower above it on dark blue and 'KANSAS' in gold below.","f":"The geographic centre of the contiguous 48 states is in Kansas; Dorothy's home in The Wizard of Oz."},"shape":{"t":"A rectangle with a notch in the top-right corner where the Missouri river cuts in."},"map":{"t":"Dead centre of the contiguous US, under Nebraska."},"capital":{"t":["TOPEKA: 'to-PEE-ka' — not Wichita, the biggest city; not Kansas City, which is mostly in Missouri.","We went to Kansas TO PEEK AT Dorothy's house — Topeka."]}},"us-ky":{"flag":{"t":"Two men shaking hands (a frontiersman and a statesman) in the seal on blue, with goldenrod below.","f":"Bourbon must be made in the US but 95% comes from Kentucky; the Kentucky Derby has run since 1875."},"shape":{"t":"A shape like a lumpy wedge pointing west, with a jagged top edge along the Ohio river."},"map":{"t":"South of Ohio and Indiana across the river, north of Tennessee."},"capital":{"t":["FRANKFORT: 'frank-FORT' — spelled with a T, not like Frankfurt in Germany; not Louisville or Lexington.","Kentucky Fried Chicken doesn't serve FRANKFURTERS — Frankfort."]}},"us-la":{"flag":{"t":"A pelican feeding its young with its own blood on blue — 'Union, Justice, Confidence'.","f":"Counties are called parishes here, the law is based on the Napoleonic code, and New Orleans is where jazz was born."},"shape":{"t":"A boot shape — a rectangle on top with a toe pointing east into the Gulf, the Mississippi delta fraying at the toe."},"map":{"t":"At the mouth of the Mississippi, west of Mississippi state, east of Texas."},"capital":{"t":["BATON ROUGE: French for 'red stick' — not New Orleans, the famous city.","LOUISE and ANA put ROUGE on a BAT — Baton Rouge, Louisiana."]}},"us-me":{"flag":{"t":"The state arms on blue: a farmer and a sailor with a pine tree and a moose, 'Dirigo' (I lead) above.","f":"The easternmost state; produces most of the US's lobster and wild blueberries; the only state with a one-syllable name."},"shape":{"t":"A big rough triangle in the top-right corner of the country, with a jagged coast at the bottom."},"map":{"t":"The far north-east; borders only one state, New Hampshire, and Canada."},"capital":{"t":["AUGUSTA: like the golf tournament (which is in Georgia) — Maine's is on the Kennebec river.","A GUST-A wind blew the lion's MANE — Augusta, Maine."]}},"us-md":{"flag":{"t":"The wildest state flag: black-and-gold checks (Calvert) quartered with red-and-white crosses (Crossland) — heraldry straight from the 1600s.","f":"Annapolis was briefly the US capital in 1783–84; the state's borders gave Washington DC its land."},"shape":{"t":"A crab-like shape wrapped around Chesapeake Bay, with a thin western arm only 3 km wide at one point."},"map":{"t":"Wrapped around Washington DC and Chesapeake Bay, south of Pennsylvania."},"capital":{"t":["ANNAPOLIS: home of the Naval Academy — 'Anna's police are sailors'.","MARY gave ANN A POLICE hat — Annapolis, Maryland."]}},"us-ma":{"flag":{"t":"A blue shield on white with a Native American figure and a star, an arm holding a sword above.","f":"The Pilgrims landed here in 1620; the first public school, first college and first subway in the US."},"shape":{"t":"A shape with a hook — Cape Cod curling up at the bottom-right like a flexed arm."},"map":{"t":"On the coast between New Hampshire and Rhode Island/Connecticut; Cape Cod hooks into the Atlantic."},"capital":{"t":["BOSTON: capital and largest city — the Tea Party, Harvard just across the river.","My BOSS has a TON of MASSIVE CHEW STICKS — Boston, Massachusetts."]}},"us-mi":{"flag":{"t":"The state arms on dark blue — an elk and a moose holding a shield with 'Tuebor' (I will defend).","f":"Michigan touches four of the five Great Lakes and has more coastline than any state but Alaska; you're never more than 137 km from one."},"shape":{"t":"A mitten (the Lower Peninsula) plus a separate Upper Peninsula above it — two pieces, wrapped in lakes."},"map":{"t":"Surrounded by four Great Lakes; the Upper Peninsula sits above Wisconsin."},"capital":{"t":["LANSING: not Detroit — the capital is in the middle of the mitten's palm.","The knight with the LANCE SINGS about MISSING someone — Lansing, Michigan."]}},"us-mn":{"flag":{"t":"Since 2024: a dark-blue state outline on light blue with a white eight-point star — replaced the busy seal flag.","f":"The Mississippi starts here at Lake Itasca; 'Land of 10,000 Lakes' actually has about 12,000; the Northwest Angle is the only US land north of the 49th parallel outside Alaska."},"shape":{"t":"A tall shape with a flat bottom, a jagged right edge, and a small bump at the top (the Northwest Angle)."},"map":{"t":"Top of the Mississippi, west of Wisconsin, touching Canada and Lake Superior."},"capital":{"t":["ST PAUL: the twin of Minneapolis — the capital is the saint, not the bigger 'Minne-apolis'.","SAINT PAUL brought MINI SODAS for everyone — St Paul, Minnesota."]}},"us-ms":{"flag":{"t":"Since 2021: a white magnolia flower in a ring of 20 stars on blue, with red and gold bars — replaced the Confederate-emblem flag.","f":"The Delta blues were born here; Elvis was born in Tupelo; the Mississippi river is on its western border, not inside it."},"shape":{"t":"A tall rectangle with a wavy left edge along its namesake river and a short Gulf coast at the bottom."},"map":{"t":"East bank of the lower Mississippi river, between Louisiana and Alabama."},"capital":{"t":["JACKSON: named after Andrew Jackson — like Michael Jackson, the King, and this is the state of the blues.","JACK'S ON a raft down the Mississippi — Jackson."]}},"us-mo":{"flag":{"t":"Red-white-blue horizontal stripes with the state seal in the middle — two bears holding a shield, 24 stars for the 24th state.","f":"The Gateway Arch in St Louis is the tallest monument in the US (192 m); Missouri borders eight states, tied with Tennessee for the most."},"shape":{"t":"A rough square with a 'bootheel' poking down at the bottom-right corner."},"map":{"t":"In the middle, where the Missouri meets the Mississippi; borders eight states."},"capital":{"t":["JEFFERSON CITY: named for Thomas Jefferson — not St Louis, not Kansas City.","MISS OURI and Mr JEFFERSON went to the CITY — Jefferson City, Missouri."]}},"us-mt":{"flag":{"t":"The state seal on blue with 'MONTANA' above — 'Oro y Plata', gold and silver.","f":"'Big Sky Country' has more cattle than people; Glacier National Park and half of Yellowstone's entrances."},"shape":{"t":"A big rectangle with a bumpy bottom-left corner where the Rockies bend the Idaho border."},"map":{"t":"Top row, against Canada, between Idaho and North Dakota."},"capital":{"t":["HELENA: 'HEL-en-a' — a gold-rush town on Last Chance Gulch.","Give HELEN A lemon tea, ANNA — Helena, Montana."]}},"us-ne":{"flag":{"t":"The state seal in gold on dark blue — a blacksmith, a steamboat and a train.","f":"The only state with a one-house (unicameral) legislature; Kool-Aid was invented in Hastings."},"shape":{"t":"A shape like a flat-topped anvil: a rectangle with a panhandle sticking west at the top-left and a wavy right edge."},"map":{"t":"Under South Dakota, above Kansas; the Missouri river forms the eastern border."},"capital":{"t":["LINCOLN: named for Abe — not Omaha, the bigger city.","The LINCOLN statue has KNEES of BRASS — Lincoln, Nebraska."]}},"us-nv":{"flag":{"t":"Cobalt blue with a silver star, sagebrush, and 'Battle Born' in the top-left corner — it joined during the Civil War.","f":"Most of Nevada is federal land; the driest state; Las Vegas grew from a railroad stop after gambling was legalised in 1931."},"shape":{"t":"A shape like a wedge or an arrowhead pointing south, with a long diagonal left edge against California."},"map":{"t":"Between California and Utah, leaning on California's elbow."},"capital":{"t":["CARSON CITY: named after Kit Carson — not Las Vegas, not Reno.","NEVER DID I see so many CARS ON CITY streets — Carson City, Nevada."]}},"us-nh":{"flag":{"t":"The frigate Raleigh being built, in a wreath of laurel, on blue with nine stars.","f":"Holds the first presidential primary; Mount Washington recorded a 372 km/h wind, the strongest ever measured by people, in 1934."},"shape":{"t":"A thin wedge, wide at the bottom and pointed at
